<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }

.form-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
}
.form-topbar .brand img { height: 24px; }
.form-topbar .brand-word { font-size: 17px; }
.form-topbar.hidden { display: none; }

.form-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 48px 20px 80px;
}
.form-card {
  width: 100%; max-width: 560px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px;
  display: flex; flex-direction: column; gap: 24px;
}
.form-header { display: flex; flex-direction: column; gap: 8px; }
.form-title { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.25; }
.form-desc  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.6; }

.q-block { display: flex; flex-direction: column; gap: 8px; }
.q-label {
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: baseline; gap: 4px;
}
.q-label .req { color: var(--red); font-size: 13px; }
.q-subtitle { font-size: 13px; color: var(--text-soft); line-height: 1.55; }

/* Choice / radio */
.choice-list { display: flex; flex-direction: column; gap: 6px; }
.choice-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
}
.choice-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.choice-opt.selected { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.choice-marker {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.choice-opt.selected .choice-marker { border-color: var(--teal); background: var(--teal); }
.choice-opt.selected .choice-marker::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
}

/* Checkbox multi-select */
.check-list { display: flex; flex-direction: column; gap: 6px; }
.check-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
}
.check-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.check-opt.checked { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.check-marker {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.check-opt.checked .check-marker {
  border-color: var(--teal); background: var(--teal);
}
.check-opt.checked .check-marker::after {
  content: ''; width: 9px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

/* Star rating */
.star-row { display: flex; gap: 8px; }
.star-opt {
  background: none; border: none; font-size: 28px; cursor: pointer;
  color: var(--border); transition: color .1s; line-height: 1;
  padding: 0;
}
.star-opt.lit { color: var(--teal); }

/* Phone wrap */
.ph-wrap { display: flex; gap: 8px; max-width: 360px; }
.ph-prefix { width: 120px; flex-shrink: 0; }

/* Submit */
.form-submit { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.btn-submit {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
  background: var(--teal); color: #04231C; border: none;
  border-radius: var(--radius); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s;
}
.btn-submit:hover { background: var(--teal-deep); color: #fff; }
.btn-submit-wa { background: #25D366; color: #fff; }
.btn-submit-wa:hover { background: #1da851; color: #fff; }
.btn-submit-tg { background: #229ED9; color: #fff; }
.btn-submit-tg:hover { background: #1a7fad; color: #fff; }

/* ── Page navigation ──────────────────────────────────────── */
.form-nav { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
.page-progress {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.page-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  white-space: nowrap;
}
.page-dots { display: flex; gap: 6px; align-items: center; }
.page-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: background .2s, transform .2s;
}
.page-dot.done { background: var(--teal); opacity: .5; }
.page-dot.active {
  background: var(--teal); transform: scale(1.35);
}
.page-nav-btns {
  display: flex; align-items: stretch; gap: 8px;
}
.btn-page-prev, .btn-page-next {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font-size: 13px; font-weight: 600;
  border-radius: var(--radius); cursor: pointer;
  border: 1.5px solid var(--border); background: var(--bg-mid);
  color: var(--text); transition: background .15s, border-color .15s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-page-prev:hover { border-color: var(--text-muted); background: var(--bg-raised); }
.btn-page-next {
  border-color: var(--teal); background: var(--teal-dim);
  color: var(--teal-deep); margin-left: auto;
}
[data-theme="dark"] .btn-page-next { color: var(--teal); }
.btn-page-next:hover { background: var(--teal); color: #04231C; }
.page-nav-btns .form-submit { margin-top: 0; flex: 1; }

/* q-block hidden between pages */
.q-block[style*="display: none"] { display: none !important; }

/* States */
.state-screen {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}
.state-box { text-align: center; max-width: 400px; }
.state-box h2 { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
.state-box p  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.65; }
.state-icon { color: var(--teal); margin-bottom: 20px; }

/* Countdown */
.cd-unit {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 62px;
}
.cd-val {
  font-size: 36px; font-weight: 800; line-height: 1;
  color: var(--teal);
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 10px 14px;
  min-width: 62px; text-align: center; font-variant-numeric: tabular-nums;
}
.cd-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.cd-sep { font-size: 32px; font-weight: 800; color: var(--text-muted); align-self: center; line-height: 1; padding-bottom: 18px; }

@media (max-width: 600px) {
  .form-card { padding: 24px 18px; }
  .form-topbar { padding: 12px 16px; }
  .cd-val { font-size: 26px; min-width: 48px; padding: 8px 10px; }
  .cd-unit { min-width: 48px; }
  .cd-sep { font-size: 24px; }
}

/* File upload field */
.file-upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 28px 20px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s; position: relative;
}
.file-upload-area:hover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area.dragover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area input[type="file"] { display: none; }
.file-upload-icon { color: var(--teal); margin-bottom: 8px; }
.file-upload-name {
  font-size: 13px; color: var(--teal); margin-top: 8px;
  word-break: break-all; font-weight: 600;
}
.file-upload-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Color picker */
.color-picker-wrap { display: flex; flex-direction: column; gap: 10px; }
.color-picker-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.color-picker-row input[type="color"] {
  width: 56px; height: 48px; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3px; cursor: pointer;
  background: var(--bg-raised);
}
.color-codes { display: flex; gap: 8px; flex-wrap: wrap; }
.color-code-chip {
  display:inline-flex; align-items:center; gap:5px;
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; font-family: 'JetBrains Mono', monospace;
  background: var(--bg-mid); color: var(--text);
  cursor: pointer; transition: background .15s;
}
.color-code-chip:hover { background: var(--teal-dim); border-color: var(--teal); }
.color-code-chip label { font-weight:700; color:var(--text-muted); font-size:11px; flex-shrink:0; cursor:pointer; }
.color-code-input {
  background:none; border:none; outline:none; color:var(--text);
  font-family:'JetBrains Mono',monospace; font-size:12px;
  min-width:0; width:auto; cursor:text;
}
.color-copy-btn {
  background:none; border:none; cursor:pointer; color:var(--text-muted);
  padding:0 0 0 4px; font-size:11px; line-height:1; flex-shrink:0;
}
.color-copy-btn:hover { color:var(--teal); }
.color-swatch {
  width: 48px; height: 48px; border-radius: 8px;
  border: 1px solid var(--border); flex-shrink: 0;
}

/* Password field */
.password-wrap { position: relative; }
.password-wrap input { padding-right: 44px !important; }
.password-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  padding: 4px; display: flex; align-items: center;
}
.password-toggle:hover { color: var(--teal); }
.password-err {
  font-size: 12px; color: var(--red); margin-top: 4px; display: none;
}

/* URL input */
.url-input-wrap { position: relative; }
.url-input-wrap input { padding-left: 36px !important; }
.url-prefix-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}

/* Dropdown with search */
.dropdown-search-wrap { position: relative; }
.dropdown-search-input {
  width: 100%; padding: 9px 36px 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-raised); color: var(--text);
  font-size: 14px; outline: none; font-family: inherit; cursor: pointer;
}
.dropdown-search-input:focus { border-color: var(--teal); }
.dropdown-list {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); max-height: 220px; overflow-y: auto;
  box-shadow: var(--shadow);
}
.dropdown-list.open { display: block; }
.dropdown-search-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-soft);
  position: sticky; top: 0; background: var(--bg-raised);
}
.dropdown-search-box input {
  width: 100%; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-mid); color: var(--text);
  font-size: 13px; outline: none; font-family: inherit;
}
.dropdown-search-box input:focus { border-color: var(--teal); }
.dropdown-option {
  padding: 9px 14px; cursor: pointer; font-size: 14px; color: var(--text);
  transition: background .1s;
}
.dropdown-option:hover, .dropdown-option.highlighted { background: var(--teal-dim); color: var(--teal-deep); }
.dropdown-option.selected { font-weight: 600; color: var(--teal-deep); }
.dropdown-no-results { padding: 10px 14px; font-size: 13px; color: var(--text-muted); }
.dropdown-arrow {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--text-muted);
}

/* ── Toggle Switch ─────────────────────────────── */
.toggle-switch-wrap { display:flex; align-items:center; gap:14px; }
.toggle-track {
  width:52px; height:28px; border-radius:14px; background:var(--border);
  position:relative; cursor:pointer; transition:background .2s; flex-shrink:0;
  border:none; padding:0;
}
.toggle-track.on { background:var(--teal); }
/* Override global .toggle-track::after for form toggle */
.toggle-switch-wrap .toggle-track::after {
  content:''; position:absolute;
  width:20px; height:20px; border-radius:50%; background:#fff;
  top:4px; left:4px;
  box-shadow:0 1px 4px rgba(0,0,0,.22);
  transition:transform .2s;
  transform:translateX(0);
}
.toggle-switch-wrap .toggle-track.on::after {
  transform:translateX(24px);
}
.toggle-label-text { font-size:14px; color:var(--text); min-width:32px; }

/* ── Multi-select Dropdown ─────────────────────── */
.ms-wrap { position:relative; }
.ms-trigger {
  width:100%; min-height:44px; padding:6px 36px 6px 10px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-raised); cursor:pointer;
  display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  font-size:14px; color:var(--text-muted); font-family:inherit;
}
.ms-trigger:focus { outline:none; border-color:var(--teal); }
.ms-tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; background:var(--teal-dim);
  border:1px solid var(--teal); border-radius:20px;
  font-size:12px; color:var(--teal-deep); font-weight:600;
}
.ms-tag-rm {
  background:none; border:none; cursor:pointer;
  color:var(--teal-deep); padding:0 0 0 2px; font-size:14px; line-height:1;
}
.ms-tag-rm:hover { color:var(--red); }
.ms-arrow { position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--text-muted); }
.ms-panel {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
  background:var(--bg-raised); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.ms-panel.open { display:block; }
.ms-search-box { padding:8px 10px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--bg-raised); }
.ms-search-box input { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-mid); color:var(--text); font-size:13px; outline:none; font-family:inherit; }
.ms-options { max-height:200px; overflow-y:auto; }
.ms-opt {
  padding:9px 14px; cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; gap:8px; transition:background .1s;
}
.ms-opt:hover { background:var(--teal-dim); }
.ms-opt.selected { font-weight:600; color:var(--teal-deep); background:var(--teal-dim); }
.ms-opt-check { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ms-opt.selected .ms-opt-check { background:var(--teal); border-color:var(--teal); }
.ms-opt.selected .ms-opt-check::after { content:""; width:9px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
.ms-no-res { padding:10px 14px; font-size:13px; color:var(--text-muted); }
.ms-max-note { padding:6px 14px; font-size:11px; color:var(--amber); background:rgba(217,119,6,.08); border-top:1px solid var(--border-soft); }
/* Checkbox max note */
.cb-max-note { font-size:11px;color:var(--amber);margin-top:4px; }
/* Ranking drag */
.rank-list { display:flex;flex-direction:column;gap:6px; }
.rank-item { display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:grab;background:var(--bg-raised);user-select:none;transition:box-shadow .15s; }
.rank-item.dragging { opacity:.5;box-shadow:0 4px 16px rgba(0,0,0,.15); }
.rank-item.drag-over { border-color:var(--teal);background:var(--teal-dim); }
.rank-num { font-size:12px;font-weight:700;color:var(--text-muted);min-width:18px;text-align:center; }
.rank-handle { color:var(--text-muted);opacity:.5;flex-shrink:0; }
.rank-text { font-size:14px;flex:1; }
/* Emoji rating */
.emoji-row { display:flex;gap:10px;flex-wrap:wrap; }
.emoji-btn { font-size:28px;background:none;border:2px solid var(--border);border-radius:50%;width:52px;height:52px;cursor:pointer;transition:border-color .15s,transform .15s;line-height:1;display:flex;align-items:center;justify-content:center; }
.emoji-btn:hover { border-color:var(--teal);transform:scale(1.1); }
.emoji-btn.selected { border-color:var(--teal);background:var(--teal-dim);transform:scale(1.12); }
/* Slider */
.slider-wrap { padding:4px 0; }
.slider-wrap input[type=range] { width:100%;accent-color:var(--teal);cursor:pointer; }
.slider-labels { display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:4px; }
.slider-val { font-weight:700;color:var(--teal);font-size:14px;text-align:center;margin-bottom:4px; }
/* NPS Score */
.nps-wrap { display:flex;flex-direction:column;gap:6px; }
.nps-row { display:flex;gap:4px; }
.nps-btn { flex:1;padding:8px 4px;font-size:13px;font-weight:700;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg-raised);color:var(--text);transition:border-color .15s,background .15s;min-width:28px; }
.nps-btn:hover { border-color:var(--teal); }
.nps-btn.selected { background:var(--teal);border-color:var(--teal);color:#fff; }
.nps-labels { display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted); }

/* ── Likert Scale ──────────────────────────────── */
.likert-table { width:100%; border-collapse:collapse; font-size:13px; }
.likert-table th { padding:6px 4px; font-size:11px; font-weight:600; color:var(--text-muted); text-align:center; }
.likert-table th.lk-label { text-align:left; font-size:12px; max-width:120px; }
.likert-table th.lk-label-r { text-align:right; font-size:12px; max-width:120px; }
.likert-table td { padding:10px 4px; text-align:center; border-top:1px solid var(--border-soft); }
.likert-table td.lk-row-label { text-align:left; padding:10px 8px; font-size:13px; color:var(--text); }
.likert-radio {
  /* Reset semua override dari global style.css */
  width:18px !important; height:18px !important;
  min-width:18px !important; max-width:18px !important;
  padding:0 !important; margin:0 !important;
  border:none !important; border-radius:0 !important;
  background:none !important; outline:revert !important;
  accent-color:var(--teal); cursor:pointer;
  display:inline-block !important; appearance:auto !important;
  -webkit-appearance:radio !important;
  position:static !important; opacity:1 !important;
  pointer-events:auto !important;
  box-sizing:content-box !important;
}
.likert-scroll { overflow-x:auto; }
/* Label wrapper di dalam td likert */
.likert-table td label {
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; padding:6px; width:100%;
}

/* ── Matrix / Grid ─────────────────────────────── */
.matrix-scroll { overflow-x:auto; }
.matrix-table { width:100%; border-collapse:collapse; font-size:13px; }
.matrix-table th { padding:9px 14px; text-align:center; font-weight:600; color:var(--text); border-bottom:2px solid var(--border); white-space:nowrap; }
.matrix-table th:first-child { text-align:left; }
.matrix-table td { padding:10px 14px; border-top:1px solid var(--border-soft); text-align:center; }
.matrix-table td:first-child { text-align:left; font-size:13px; color:var(--text); }
.matrix-table tr:hover td { background:var(--teal-dim); }
.matrix-cell { width:20px; height:20px; border-radius:50%; border:2px solid var(--border); background:transparent; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; transition:border-color .15s; }
.matrix-cell:hover { border-color:var(--teal); }
.matrix-cell .matrix-dot { width:10px; height:10px; border-radius:50%; background:transparent; transition:background .15s; }
.matrix-cell.selected { border-color:var(--teal); }
.matrix-cell.selected .matrix-dot { background:var(--teal); }
/* ── Data Table field ── */
.dt-scroll { overflow-x:auto; }
.dt-table  { width:100%; border-collapse:collapse; font-size:13px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.dt-table th { padding:9px 14px; font-weight:600; color:var(--text); background:var(--bg-mid); border-bottom:2px solid var(--border); white-space:nowrap; text-align:center; }
.dt-table th.dt-th-corner { text-align:left; border-right:1px solid var(--border); }
.dt-table th:not(.dt-th-corner) { border-right:1px solid var(--border-soft); }
.dt-table td { padding:8px 12px; border-top:1px solid var(--border-soft); border-right:1px solid var(--border-soft); text-align:center; }
.dt-table .dt-row-label-cell { text-align:left; font-weight:600; font-size:13px; background:var(--bg-mid); border-right:1px solid var(--border); white-space:nowrap; }
.dt-table .dt-cell-fixed  { font-size:13px; color:var(--text); }
.dt-table .dt-cell-editable { padding:5px 8px; }

// ── Build WhatsApp / Telegram link ────────────────────────────
// NOTE: WhatsApp applies *bold*/_italic_ formatting to text sent via wa.me
// links. Telegram does NOT parse Markdown for text pre-filled via t.me
// deep links (that only works with the Bot API's parse_mode) — so for
// Telegram we send plain text without markdown syntax, otherwise the
// literal asterisks/underscores show up in the message.
function buildLink(settings, questions, answers, targetOverride, formTitle) {
  const target = targetOverride || settings.target || "wa";
  const isTg = target === "tg";
  const bold   = (s) => isTg ? s : `*${s}*`;
  const italic = (s) => isTg ? s : `_${s}_`;

  const lines = [];
  lines.push(bold(formTitle || "Form"));
  lines.push("");

  const line = (text) => lines.push(isTg ? text : `> ${text}`);

  questions.forEach(q => {
    if (["divider","spacer","button_link","title","image","video","page_break"].includes(q.type)) return;
    const ans = answers[q.id];
    if (ans === undefined || ans === null || ans === "") return;

    // Map: format as readable text
    if (q.type === "map" && typeof ans === "object") {
      const parts = [];
      if (ans.address) parts.push(ans.address);
      if (ans.lat != null && ans.lng != null) parts.push(`${Number(ans.lat).toFixed(6)}, ${Number(ans.lng).toFixed(6)}`);
      if (parts.length) line(`${q.title}: ${parts.join(", ")}`);
      return;
    }
    // File upload: format "Pertanyaan: namaFile,link" (ans = "namaFile||url")
    if (q.type === "file_upload" && typeof ans === "string" && ans.includes("||")) {
      const sep      = ans.indexOf("||");
      const fileName = ans.slice(0, sep);
      const fileUrl  = ans.slice(sep + 2);
      line(`${q.title}: ${fileName},${fileUrl}`);
      return;
    }
    line(`${q.title}: ${ans}`);
  });

  lines.push("");
  lines.push(italic("Created by wateform.my.id"));

  const body = lines.join("\n");

  if (target === "tg") {
    const user = settings.tgUsername || "";
    return `https://t.me/${user}?text=${encodeURIComponent(body)}`;
  } else {
    const number = (settings.waPrefix || "+62").replace("+","") + (settings.waNumber || "").replace(/\D/g,"");
    return `https://wa.me/${number}?text=${encodeURIComponent(body)}`;
  }
}

// ── Schedule state screen ────────────────────────────────────
let _countdownInterval = null;

function showScheduled(state, openTime, closeTime, closedMessage) {
  const fmt = dt => dt ? dt.toLocaleString(undefined, { weekday:"short", year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : null;
  root.className = "state-screen";

  if (state === "not-open") {
    // Build countdown display
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--teal);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <h2>Form not open yet</h2>
        <p style="margin-bottom:20px">Form akan dibuka pada<br><strong>${fmt(openTime)}</strong></p>
        <div id="countdown-wrap" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
          <div class="cd-unit"><div class="cd-val" id="cd-d">--</div><div class="cd-lbl">Hari</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-h">--</div><div class="cd-lbl">Jam</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-m">--</div><div class="cd-lbl">Menit</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-s">--</div><div class="cd-lbl">Detik</div></div>
        </div>
        ${closeTime ? `<p style="font-size:13px;color:var(--text-muted)">Dan akan ditutup pada <strong>${fmt(closeTime)}</strong></p>` : ""}
      </div>`;

    // Start live countdown
    if (_countdownInterval) clearInterval(_countdownInterval);
    function tick() {
      const diff = openTime - new Date();
      if (diff <= 0) { clearInterval(_countdownInterval); location.reload(); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const pad = n => String(n).padStart(2,"0");
      const el = id => document.getElementById(id);
      if (el("cd-d")) el("cd-d").textContent = pad(d);
      if (el("cd-h")) el("cd-h").textContent = pad(h);
      if (el("cd-m")) el("cd-m").textContent = pad(m);
      if (el("cd-s")) el("cd-s").textContent = pad(s);
    }
    tick();
    _countdownInterval = setInterval(tick, 1000);

  } else {
    // Closed state — show custom message if set
    const msg = closedMessage || "This form is no longer accepting responses.";
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
        </svg>
        <h2 style="color:var(--text-muted)">Form ditutup</h2>
        <p>${esc(msg)}</p>
        ${closeTime ? `<p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Ditutup pada ${fmt(closeTime)}</p>` : ""}
      </div>`;
  }
}

// ── Generate short code for file viewer links ─────────────────
function genShortCode(len = 8) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => chars[b % chars.length]).join("");
}

function renderForm(form) {

  const answers   = {};
  const fileMap   = {};   // qId → File object (for Supabase Storage upload)

    }

    // Video type
    if (q.type === "video") {

        const ytMatch = vidSrc.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);

        vidBlock.innerHTML = `
          ${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
          ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
          ${embedSrc
            ? `<div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden"><iframe src="${esc(embedSrc)}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>`
            : `<video src="${esc(vidSrc)}" controls style="width:100%;border-radius:10px;display:block"></video>`}`;
      } else {
        vidBlock.innerHTML = `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}<div style="background:var(--bg-mid);border:1px dashed var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text-muted);font-size:13px">No video set</div>`;
      }
      card.appendChild(vidBlock);
      return;
    }

    // Divider type
    if (q.type === "divider") {
      const dBlock = document.createElement("div");
      dBlock.className = "q-block";
      dBlock.style.cssText = "padding:4px 0";

      card.appendChild(sBlock);
      return;
    }

    // Button (link) type
    if (q.type === "button_link") {
      const bBlock = document.createElement("div");
      bBlock.className = "q-block";
      const bStyle = q.buttonStyle || "primary";
      const bLabel = esc(q.buttonLabel || "Open link");
      const bAlign = q.buttonAlign || "left";
      const alignMap = {left:"flex-start",center:"center",right:"flex-end"};
      let btnCss = "padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:opacity .15s;";
      if (bStyle === "primary")  btnCss += "background:var(--teal);color:#fff;border:2px solid var(--teal)";
      if (bStyle === "outline")  btnCss += "background:transparent;color:var(--teal);border:2px solid var(--teal)";

        <div style="display:flex;justify-content:${alignMap[bAlign]||"flex-start"}">

             onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">

            <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' width='13' height='13'>

              <polyline points='15 3 21 3 21 9'/><line x1='10' y1='14' x2='21' y2='3'/>
            </svg>
          </a>
        </div>`;
      card.appendChild(bBlock);
      return;
    }

    // Map / Location type
    if (q.type === "map") {
      const mBlock = document.createElement("div");
      mBlock.className = "q-block";
      const mapId = "map-" + q.id;
      const mapData = { lat: q.mapLat, lng: q.mapLng };
      mBlock.innerHTML = `
        <div class="q-label">${esc(q.title)}${req}</div>
        ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
        <div id="${mapId}" style="height:220px;border-radius:10px;border:1px solid var(--border);overflow:hidden;position:relative;background:#e8f4f0;margin-bottom:8px">
          <div id="${mapId}-inner" style="width:100%;height:100%"></div>
          ${q.mapAllowGps !== false ? `
          <button type="button" id="${mapId}-gps"
            style="position:absolute;bottom:10px;right:10px;z-index:1000;background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--teal);box-shadow:0 2px 6px rgba(0,0,0,.1)">
            <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' width='14' height='14'><circle cx='12' cy='12' r='3'/><path d='M12 1v4M12 19v4M1 12h4M19 12h4'/></svg>
            Use my location
          </button>` : ""}
        </div>
        ${q.mapShowAddress !== false ? `
        <input type="text" id="${mapId}-addr" placeholder="Address…"
          style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:4px">` : ""}
        <div style="font-size:11px;color:var(--text-muted)" id="${mapId}-coords"></div>
        <div class="q-err" style="font-size:12px;color:var(--red);display:none">Please pick a location on the map.</div>`;
      card.appendChild(mBlock);

      // Init Leaflet map after DOM is ready
      setTimeout(() => {
        if (typeof L === "undefined") return;
        const defaultLat = q.mapLat || -6.2088;
        const defaultLng = q.mapLng || 106.8456;
        const zoom = q.mapZoom || 13;
        const map = L.map(mapId + "-inner").setView([defaultLat, defaultLng], zoom);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19,
        }).addTo(map);

        let marker = null;
        function setPin(lat, lng) {
          if (marker) map.removeLayer(marker);
          marker = L.marker([lat, lng]).addTo(map);
          answers[q.id] = { lat, lng, address: document.getElementById(mapId + "-addr")?.value || "" };
          const coordsEl = document.getElementById(mapId + "-coords");
          if (coordsEl) coordsEl.textContent = `(pin) ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }

        map.on("click", e => {
          setPin(e.latlng.lat, e.latlng.lng);
          // Reverse geocode
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`)
            .then(r => r.json()).then(d => {
              const addr = d.display_name || "";
              const addrEl = document.getElementById(mapId + "-addr");
              if (addrEl) addrEl.value = addr;
              if (answers[q.id]) answers[q.id].address = addr;
            }).catch(() => {});
        });

        const addrEl = document.getElementById(mapId + "-addr");
        if (addrEl) {
          addrEl.addEventListener("change", () => {
            if (answers[q.id]) answers[q.id].address = addrEl.value;
            // Forward geocode
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addrEl.value)}&limit=1`)
              .then(r => r.json()).then(d => {
                if (d[0]) {
                  const lat = parseFloat(d[0].lat), lng = parseFloat(d[0].lon);
                  map.setView([lat, lng], zoom);
                  setPin(lat, lng);
                  addrEl.value = d[0].display_name || addrEl.value;
                  if (answers[q.id]) answers[q.id].address = addrEl.value;
                }
              }).catch(() => {});
          });
        }

        const gpsBtn = document.getElementById(mapId + "-gps");
        if (gpsBtn) {
          gpsBtn.addEventListener("click", () => {
            if (!navigator.geolocation) return;

      ${q.type === "checkbox" ? `<div class="q-label" style="margin-bottom:2px">${esc(q.title)}${req}</div>` : ""}
      ${inputHtml}
      ${q.type !== "password" ? `<div class="q-err" style="font-size:12px;color:var(--red);display:none">This field is required.</div>` : ""}`;
    card.appendChild(block);

    // Bind checkbox multi-select events
    if (q.type === "checkbox") {
      const selectedVals = new Set();
      const cbMax = q.checkboxMax || 0;
      block.querySelectorAll(".check-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          const val = opt.dataset.val;
          const otherInput = block.querySelector(`#q-${q.id}-other`);
          if (opt.classList.contains("checked")) {
            opt.classList.remove("checked");
            selectedVals.delete(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "none";
          } else {
            if (cbMax > 0 && selectedVals.size >= cbMax) return; // enforce max
            opt.classList.add("checked");
            selectedVals.add(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "";
          }
          // Build answer string
          const parts = [];
          selectedVals.forEach(v => {
            if (v === "__other__") {
              const txt = otherInput?.value?.trim();
              if (txt) parts.push("Other: " + txt);
            } else {
              parts.push(v);
            }
          });
          answers[q.id] = parts.join(",");
        });
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        const parts = [];
        selectedVals.forEach(v => {
          if (v === "__other__") {
            if (e.target.value.trim()) parts.push("Other: " + e.target.value.trim());
          } else {
            parts.push(v);
          }
        });
        answers[q.id] = parts.join(",");
      });
    }

    // Bind choice events
    if (q.type === "choice") {
      block.querySelectorAll(".choice-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          block.querySelectorAll(".choice-opt").forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          const val = opt.dataset.val;
          const otherInput = block.querySelector(`#q-${q.id}-other`);
          if (val === "__other__") {
            if (otherInput) otherInput.style.display = "";
            answers[q.id] = otherInput?.value || "";
          } else {
            if (otherInput) otherInput.style.display = "none";
            answers[q.id] = val;
          }
        });
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        answers[q.id] = e.target.value;
      });
    }

    // Bind rating events
    if (q.type === "rating") {
      block.querySelectorAll(".star-opt").forEach(star => {
        star.addEventListener("click", () => {
          const val = Number(star.dataset.val);
          starState[q.id] = val;
          answers[q.id] = val + "/" + (q.maxRating || 5);
          block.querySelectorAll(".star-opt").forEach((s, i) => {
            s.classList.toggle("lit", i < val);
          });
        });
      });
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel) {
        sel.addEventListener("change", () => {
          answers[q.id] = sel.value;
        });
      }
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel && sel.tagName === "SELECT") sel.addEventListener("change", () => { answers[q.id] = sel.value; });
      // Searchable dropdown (> 10 opts)
      const ddWrap = block.querySelector(`#ddw-${q.id}`);
      if (ddWrap) {
        const trigger = ddWrap.querySelector(`#q-${q.id}`);
        const list    = ddWrap.querySelector(`#ddl-${q.id}`);
        const search  = ddWrap.querySelector(`#dds-${q.id}`);
        const optsDiv = ddWrap.querySelector(`#ddo-${q.id}`);
        const noRes   = ddWrap.querySelector(`#ddnr-${q.id}`);
        trigger.addEventListener("click", () => { list.classList.toggle("open"); if (list.classList.contains("open")) search.focus(); });
        document.addEventListener("click", e => { if (!ddWrap.contains(e.target)) list.classList.remove("open"); }, true);
        search.addEventListener("input", () => {
          const q2 = search.value.toLowerCase();
          let shown = 0;
          optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
            const match = o.dataset.val.toLowerCase().includes(q2);
            o.style.display = match ? "" : "none";
            if (match) shown++;
          });
          noRes.style.display = shown === 0 ? "" : "none";
        });
        optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
          o.addEventListener("click", () => {
            optsDiv.querySelectorAll(".dropdown-option").forEach(x => x.classList.remove("selected"));
            o.classList.add("selected");
            trigger.value = o.dataset.val;
            answers[q.id] = o.dataset.val;
            list.classList.remove("open");
          });
        });
      }
    }

    // Bind file upload
    if (q.type === "file_upload") {
      const fileInput = block.querySelector(`#q-${q.id}`);
      const area = block.querySelector(`#fua-${q.id}`);
      const nameDiv = block.querySelector(`#fun-${q.id}`);
      const maxMb = q.maxFileSizeMb || 10;
      const processFile = file => {
        if (!file) return;
        if (file.size > maxMb * 1024 * 1024) {
          nameDiv.textContent = `File too large. Max ${maxMb}MB.`;
          nameDiv.style.color = "var(--red)";
          nameDiv.style.display = "";
          answers[q.id] = "";
          return;
        }
        nameDiv.style.color = "var(--teal)";
        nameDiv.textContent = "\u{1F4CE} " + file.name + " (" + (file.size/1024/1024).toFixed(2) + "MB)";
        nameDiv.style.display = "";
        fileMap[q.id] = file;
        answers[q.id] = "[Attached: " + file.name + "]";
      };
      area.addEventListener("click", () => fileInput.click());
      area.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
      area.addEventListener("dragover", e => { e.preventDefault(); area.classList.add("dragover"); });
      area.addEventListener("dragleave", () => area.classList.remove("dragover"));
      area.addEventListener("drop", e => { e.preventDefault(); area.classList.remove("dragover"); processFile(e.dataTransfer.files[0]); });
      fileInput.addEventListener("change", () => processFile(fileInput.files[0]));
    }

    // Bind color picker
    if (q.type === "color") {
      const colorInp = block.querySelector(`#q-${q.id}`);
      const swatch   = block.querySelector(`#csw-${q.id}`);
      const hexInput = block.querySelector(`#ci-hex-${q.id}`);
      const rgbInput = block.querySelector(`#ci-rgb-${q.id}`);
      const hslInput = block.querySelector(`#ci-hsl-${q.id}`);

      function hexToRgb(hex) {
        const h = hex.replace(/^#/,"");
        if (h.length !== 6) return null;
        const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
        if (isNaN(r)||isNaN(g)||isNaN(b)) return null;
        return {r,g,b};
      }
      function rgbToHsl(r,g,b) {
        r/=255; g/=255; b/=255;
        const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
        if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
          switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;default:h=((r-g)/d+4)/6;}}
        return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
      }
      function rgbToHex(r,g,b) {
        return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
      }
      function hslToRgb(h,s,l) {
        s/=100; l/=100;
        const k=n=>(n+h/30)%12;
        const a=s*Math.min(l,1-l);
        const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
        return {r:Math.round(f(0)*255),g:Math.round(f(8)*255),b:Math.round(f(4)*255)};
      }
      function parseRgb(str) {
        const m = str.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
        if (!m) return null;
        return {r:parseInt(m[1]),g:parseInt(m[2]),b:parseInt(m[3])};
      }
      function parseHsl(str) {
        const m = str.match(/(\d+)[°,\s]+(\d+)[%,\s]+(\d+)/);
        if (!m) return null;
        return {h:parseInt(m[1]),s:parseInt(m[2]),l:parseInt(m[3])};
      }

      function updateFromHex(hex, skipHexInput) {
        const rgb = hexToRgb(hex);
        if (!rgb) return;
        const {r,g,b} = rgb;
        const {h,s,l} = rgbToHsl(r,g,b);
        swatch.style.background = hex;
        colorInp.value = hex;
        if (!skipHexInput) hexInput.value = hex.toUpperCase();
        rgbInput.value = `${r}, ${g}, ${b}`;
        hslInput.value = `${h}°, ${s}%, ${l}%`;
        answers[q.id] = `${hex.toUpperCase()},RGB(${r},${g},${b}),HSL(${h}°,${s}%,${l}%)`;
      }

      updateFromHex(colorInp.value);

      // Native color picker → update all
      colorInp.addEventListener("input", () => updateFromHex(colorInp.value));

      // HEX input edited
      hexInput.addEventListener("input", () => {
        let v = hexInput.value.trim();
        if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9a-fA-F]{6}$/.test(v)) updateFromHex(v, true);
      });
      hexInput.addEventListener("blur", () => {
        let v = hexInput.value.trim();
        if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9a-fA-F]{6}$/.test(v)) updateFromHex(v, true);
        else hexInput.value = colorInp.value.toUpperCase();
      });

      // RGB input edited
      rgbInput.addEventListener("blur", () => {
        const rgb = parseRgb(rgbInput.value);
        if (rgb) updateFromHex(rgbToHex(rgb.r,rgb.g,rgb.b));
      });

      // HSL input edited
      hslInput.addEventListener("blur", () => {
        const hsl = parseHsl(hslInput.value);
        if (hsl) { const {r,g,b}=hslToRgb(hsl.h,hsl.s,hsl.l); updateFromHex(rgbToHex(r,g,b)); }
      });

      // Copy buttons
      block.querySelectorAll(".color-copy-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const inp = block.querySelector(`#${btn.dataset.target}`);
          if (!inp) return;
          navigator.clipboard?.writeText(inp.value).catch(()=>{});
          const orig = btn.textContent; btn.textContent = "✓";
          setTimeout(() => { btn.textContent = orig; }, 1200);
        });
      });
    }

    // Bind password
    if (q.type === "password") {
      const pwInp = block.querySelector(`#q-${q.id}`);
      const togBtn = block.querySelector(`#ptog-${q.id}`);
      const togIcon = block.querySelector(`#ptog-icon-${q.id}`);
      togBtn.addEventListener("click", () => {
        const isHidden = pwInp.type === "password";
        pwInp.type = isHidden ? "text" : "password";
        togIcon.innerHTML = isHidden
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      });
      pwInp.addEventListener("input", () => {
        answers[q.id] = pwInp.value;
        block.querySelector(`#perr-${q.id}`).style.display = "none";
      });
    }

    // Bind toggle
    if (q.type === "toggle") {
      const track  = block.querySelector(`#q-${q.id}`);
      const lblEl  = block.querySelector(`#qtl-${q.id}`);
      const onLbl  = q.toggleOnLabel  || "Yes";
      const offLbl = q.toggleOffLabel || "No";
      let state = !!q.toggleDefault;
      answers[q.id] = state ? onLbl : offLbl;
      track.addEventListener("click", () => {
        state = !state;
        track.classList.toggle("on", state);
        track.setAttribute("aria-pressed", state);
        if (lblEl) lblEl.textContent = state ? onLbl : offLbl;
        answers[q.id] = state ? onLbl : offLbl;
      });
    }

    // Bind multiselect
    if (q.type === "multiselect") {
      const trigger  = block.querySelector(`#mst-${q.id}`);
      const panel    = block.querySelector(`#mspanel-${q.id}`);
      const searchEl = block.querySelector(`#mssearch-${q.id}`);
      const listEl   = block.querySelector(`#mslist-${q.id}`);
      const noResEl  = block.querySelector(`#msnr-${q.id}`);
      const phEl     = block.querySelector(`#msp-${q.id}`);
      const msMax    = q.multiselectMax || 0;
      const selected = new Set();

      function updateTrigger() {
        const tags = [...selected].map(v =>
          `<span class="ms-tag">${esc(v)}<button type="button" class="ms-tag-rm" data-val="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`
        ).join("");
        if (selected.size === 0) {
          trigger.innerHTML = `<span class="ms-placeholder">${esc(q.multiselectPlaceholder||"Select options…")}</span>`;
        } else {
          trigger.innerHTML = tags;
          trigger.querySelectorAll(".ms-tag-rm").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              selected.delete(btn.dataset.val);
              listEl.querySelectorAll(".ms-opt").forEach(o => {
                if (o.dataset.val === btn.dataset.val) o.classList.remove("selected");
              });
              updateTrigger();
              answers[q.id] = [...selected].join(",");
            });
          });
        }
      }

      trigger.addEventListener("click", () => {
        const open = panel.classList.toggle("open");
        trigger.setAttribute("aria-expanded", open);
        if (open) { searchEl.focus(); searchEl.value = ""; filterMs(""); }
      });
      document.addEventListener("click", e => { if (!block.contains(e.target)) panel.classList.remove("open"); }, true);

      function filterMs(q2) {
        let shown = 0;
        listEl.querySelectorAll(".ms-opt").forEach(o => {
          const match = o.dataset.val.toLowerCase().includes(q2.toLowerCase());
          o.style.display = match ? "" : "none";
          if (match) shown++;
        });
        noResEl.style.display = shown === 0 ? "" : "none";
      }
      searchEl.addEventListener("input", () => filterMs(searchEl.value));

      listEl.querySelectorAll(".ms-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          const val = opt.dataset.val;
          if (selected.has(val)) {
            selected.delete(val); opt.classList.remove("selected");
          } else {
            if (msMax > 0 && selected.size >= msMax) return;
            selected.add(val); opt.classList.add("selected");
          }
          updateTrigger();
          answers[q.id] = [...selected].join(",");
        });
      });
      answers[q.id] = "";
    }

    // Bind likert
    if (q.type === "likert") {
      const lkRows = (q.likertRows||[""]).filter(Boolean);
      const rowAnswers = {};
      lkRows.forEach((r, ri) => { rowAnswers[ri] = null; });
      block.querySelectorAll(`.likert-radio`).forEach(inp => {
        inp.addEventListener("change", () => {
          rowAnswers[inp.dataset.row] = inp.dataset.val;
          const parts = lkRows.map((r,ri) => rowAnswers[ri] ? `${r}-${rowAnswers[ri]}` : null).filter(Boolean);
          answers[q.id] = parts.join(",");
        });
      });
    }

    // Bind matrix
    if (q.type === "matrix") {
      const mType = q.matrixType || "radio";
      const mRows = q.matrixRows || [];
      // Base rule from selection type: "radio" behaves as one answer per row by default.
      const onePerRow = q.matrixOnePerRow || mType === "radio";
      const onePerCol = q.matrixOnePerCol || false;
      const selected = new Set(); // "ri,ci" keys

      function cellKey(ri, ci) { return `${ri},${ci}`; }

      function rebuildMatrixAnswer() {
        const parts = mRows.map((r, ri) => {
          const cols = [];
          block.querySelectorAll(`.matrix-cell[data-row="${ri}"]`).forEach(btn => {
            if (selected.has(cellKey(ri, Number(btn.dataset.col)))) cols.push(btn.dataset.colname);
          });
          return cols.length ? cols.map(c => `${r}-${c}`).join(",") : null;
        }).filter(Boolean);
        answers[q.id] = parts.join(",");
      }

      block.querySelectorAll(".matrix-cell").forEach(btn => {
        btn.addEventListener("click", () => {
          const ri = Number(btn.dataset.row);
          const ci = Number(btn.dataset.col);
          const key = cellKey(ri, ci);

          if (selected.has(key)) {
            // Click again on an already-selected cell → deselect it.
            selected.delete(key);
            btn.classList.remove("selected");
            btn.setAttribute("aria-pressed", "false");
          } else {
            if (onePerRow) {
              block.querySelectorAll(`.matrix-cell[data-row="${ri}"]`).forEach(other => {
                const otherKey = cellKey(ri, Number(other.dataset.col));
                if (selected.has(otherKey)) {
                  selected.delete(otherKey);
                  other.classList.remove("selected");
                  other.setAttribute("aria-pressed", "false");
                }
              });
            }
            if (onePerCol) {
              block.querySelectorAll(`.matrix-cell[data-col="${ci}"]`).forEach(other => {
                const otherKey = cellKey(Number(other.dataset.row), ci);
                if (selected.has(otherKey)) {
                  selected.delete(otherKey);
                  other.classList.remove("selected");
                  other.setAttribute("aria-pressed", "false");
                }
              });
            }
            selected.add(key);
            btn.classList.add("selected");
            btn.setAttribute("aria-pressed", "true");
          }
          rebuildMatrixAnswer();
        });
      });
    }

    // Bind data_table
    if (q.type === "data_table") {
      const dtRows  = q.tableRows    || [];
      const dtCols  = q.tableColumns || [];
      const dtCells = q.tableCells   || dtRows.map(() => dtCols.map(() => ""));
      const allowMultiple = q.tableAllowMultiple !== false; // default true
      const userVals = {};
      function rebuildDtAnswer() {
        const parts = [];
        dtRows.forEach((r, ri) => {
          dtCols.forEach((c, ci) => {
            const ownerV = (dtCells[ri]||[])[ci] ?? "";
            const userV  = userVals[`${ri},${ci}`] || "";
            const val    = ownerV !== "" ? ownerV : userV;
            if (val) parts.push(`${r}-${c}=${val}`);
          });
        });
        answers[q.id] = parts.join(",");
      }
      const allInputs = [...block.querySelectorAll(".dt-user-input")];
      function updateSingleAnswerLock() {
        if (allowMultiple) return;
        // Find the first input that has a value
        const filledInp = allInputs.find(i => (userVals[i.dataset.ri + "," + i.dataset.ci] || "") !== "");
        allInputs.forEach(i => {
          const key = i.dataset.ri + "," + i.dataset.ci;
          const isFilled = (userVals[key] || "") !== "";
          if (filledInp && !isFilled) {
            i.disabled = true;
            i.style.opacity = "0.35";
            i.style.cursor = "not-allowed";
            i.placeholder = "";
          } else {
            i.disabled = false;
            i.style.opacity = "";
            i.style.cursor = "";
            i.placeholder = "—";
          }
        });
      }
      allInputs.forEach(inp => {
        inp.addEventListener("input", () => {
          userVals[inp.dataset.ri + "," + inp.dataset.ci] = inp.value.trim();
          rebuildDtAnswer();
          updateSingleAnswerLock();
        });
      });
      // Seed answer with owner-prefilled values
      rebuildDtAnswer();
      updateSingleAnswerLock();
    }

    // Bind multi_input
    if (q.type === "multi_input") {
      const miFields = q.multiInputFields || [];
      const fieldVals = {};
      miFields.forEach((f,fi) => { fieldVals[fi] = ""; });
      block.querySelectorAll(`[data-fi]`).forEach(inp => {
        const fi = Number(inp.dataset.fi);
        const f = miFields[fi];
        inp.addEventListener("input", () => {
          fieldVals[fi] = inp.value.trim();
          const parts = miFields.map((f,fi) => fieldVals[fi] || null).filter(Boolean);
          answers[q.id] = parts.join(",");
        });
      });
    }

    // url_input: static link, no user input needed — no answer to capture

    // Bind text inputs
    // Bind ranking drag-and-drop
    if (q.type === "ranking") {
      const rkList = block.querySelector(`#rk-${q.id}`);
      let dragSrc = null;
      function updateRankAnswers() {
        const items = rkList.querySelectorAll(".rank-item");
        const order = [];
        items.forEach((item, i) => {
          item.querySelector(".rank-num").textContent = i + 1;
          order.push(item.querySelector(".rank-text").textContent);
        });
        answers[q.id] = order.map((o, i) => `${i + 1}.${o}`).join(", ");
      }
      rkList.querySelectorAll(".rank-item").forEach(item => {
        item.addEventListener("dragstart", e => { dragSrc = item; item.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
        item.addEventListener("dragend", () => { dragSrc = null; rkList.querySelectorAll(".rank-item").forEach(i => i.classList.remove("dragging","drag-over")); });
        item.addEventListener("dragover", e => { e.preventDefault(); item.classList.add("drag-over"); });
        item.addEventListener("dragleave", () => item.classList.remove("drag-over"));
        item.addEventListener("drop", e => {
          e.preventDefault(); item.classList.remove("drag-over");
          if (dragSrc && dragSrc !== item) {
            const allItems = [...rkList.querySelectorAll(".rank-item")];
            const srcIdx = allItems.indexOf(dragSrc);
            const tgtIdx = allItems.indexOf(item);
            if (srcIdx < tgtIdx) rkList.insertBefore(dragSrc, item.nextSibling);
            else rkList.insertBefore(dragSrc, item);
            updateRankAnswers();
          }
        });
      });
      // Initial answer
      const initOpts = q.rankingOptions || [];
      answers[q.id] = initOpts.map((o, i) => `${i + 1}.${o}`).join(", ");
    }

    // Bind emoji rating
    if (q.type === "emoji_rating") {
      block.querySelectorAll(".emoji-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          block.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          answers[q.id] = btn.dataset.emoji;
        });
      });
    }

    // Bind slider
    if (q.type === "slider") {
      const sl = block.querySelector(`#q-${q.id}`);
      const sv = block.querySelector(`#sv-${q.id}`);
      if (sl) {
        const sMax = q.sliderMax != null ? q.sliderMax : 100;
        answers[q.id] = sl.value + "/" + sMax;
        sl.addEventListener("input", () => { if (sv) sv.textContent = sl.value; answers[q.id] = sl.value + "/" + sMax; });
      }
    }

    // Bind NPS
    if (q.type === "nps_score") {
      block.querySelectorAll(".nps-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          block.querySelectorAll(".nps-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          answers[q.id] = btn.dataset.val + "/10";
        });
      });
    }

    if (!["choice","dropdown","rating","file_upload","color","password","url_input","checkbox",
           "toggle","multiselect","likert","matrix","data_table","multi_input","ranking","emoji_rating","slider","nps_score"].includes(q.type)) {
      const el = block.querySelector(`#q-${q.id}`);
      if (el) {
        el.addEventListener("input", () => {
          if (q.type === "phone") {
            const prefix = block.querySelector(`#q-${q.id}-prefix`)?.value || "";
            answers[q.id] = prefix + " " + el.value.trim();
          } else {
            answers[q.id] = el.value.trim();
          }
        });
        // Also bind prefix changes for phone
        if (q.type === "phone") {
          block.querySelector(`#q-${q.id}-prefix`)?.addEventListener("input", () => {
            const prefix = block.querySelector(`#q-${q.id}-prefix`).value;
            answers[q.id] = prefix + " " + el.value.trim();
          });
        }
      }
    }
  });

  // ── Multi-page navigation setup ──────────────────────────────
  const target = settings.target || "wa";

  // Split card children into pages based on .q-page-break-marker sentinels
  const allChildren = Array.from(card.children).filter(el => !el.classList.contains("form-header"));
  const pages = [[]];
  allChildren.forEach(el => {
    if (el.classList.contains("q-page-break-marker")) {
      pages.push([]);
    } else {
      pages[pages.length - 1].push(el);
    }
  });
  // Remove markers from DOM
  card.querySelectorAll(".q-page-break-marker").forEach(el => el.remove());

  const totalPages = pages.length;
  let currentPage = 0;

  // Build the submit buttons HTML
  const submitBtnsHtml = (() => {
    if (target === "both") {
      const labelWa = settings.submitLabelWa || "Send WateForm to WhatsApp";
      const labelTg = settings.submitLabelTg || "Send WateForm to Telegram";
      return `
        <button class="btn-submit btn-submit-wa" id="submit-btn-wa">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.997 0C5.373 0 0 5.373 0 12c0 2.122.559 4.112 1.532 5.835L.054 23.94l6.285-1.448A11.94 11.94 0 0 0 12 24c6.627 0 12-5.373 12-12S18.624 0 11.997 0zm.003 21.818a9.82 9.82 0 0 1-5.022-1.376l-.36-.214-3.733.979 1.001-3.656-.234-.376A9.82 9.82 0 0 1 2.182 12c0-5.421 4.41-9.818 9.818-9.818 5.42 0 9.818 4.397 9.818 9.818 0 5.42-4.397 9.818-9.818 9.818z"/></svg>
          ${esc(labelWa)}
        </button>
        <button class="btn-submit btn-submit-tg" id="submit-btn-tg">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.17 14.147l-2.95-.924c-.64-.203-.655-.64.136-.953l11.57-4.461c.537-.194 1.006.131.968.412z"/></svg>
          ${esc(labelTg)}
        </button>`;
    } else {
      const submitLabel = settings.submitLabel || (
        target === "tg" ? "Send WateForm to Telegram" : "Send WateForm to WhatsApp"
      );
      return `<button class="btn-submit" id="submit-btn">${esc(submitLabel)}</button>`;
    }
  })();

  // Navigation footer element
  const navDiv = document.createElement("div");
  navDiv.className = "form-nav";

  function buildNavHtml(pg) {
    const isFirst = pg === 0;
    const isLast  = pg === totalPages - 1;
    if (totalPages <= 1) {
      // No pages — just show submit
      return `<div class="form-submit" style="margin-top:0">${submitBtnsHtml}</div>`;
    }
    // Progress dots
    const dots = Array.from({length: totalPages}, (_, i) =>
      `<span class="page-dot ${i === pg ? 'active' : i < pg ? 'done' : ''}"></span>`
    ).join("");
    if (isLast) {
      // Last page: nav row (prev only) above submit
      return `
        <div class="page-progress">
          <span class="page-label">Page ${pg + 1} of ${totalPages}</span>
          <div class="page-dots">${dots}</div>
        </div>
        ${!isFirst ? `<div class="page-nav-btns" style="justify-content:flex-start">
          <button class="btn-page-prev" id="nav-prev">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Previous
          </button>
        </div>` : ""}
        <div class="form-submit" style="margin-top:4px">${submitBtnsHtml}</div>`;
    }
    return `
      <div class="page-progress">
        <span class="page-label">Page ${pg + 1} of ${totalPages}</span>
        <div class="page-dots">${dots}</div>
      </div>
      <div class="page-nav-btns">
        ${!isFirst ? `<button class="btn-page-prev" id="nav-prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Previous
        </button>` : `<span></span>`}
        <button class="btn-page-next" id="nav-next">
          Next
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>`;
  }

  function showPage(pg) {
    // Hide all q-blocks
    pages.forEach((pageBlocks, pi) => {
      pageBlocks.forEach(el => { el.style.display = pi === pg ? "" : "none"; });
    });
    currentPage = pg;
    navDiv.innerHTML = buildNavHtml(pg);
    navDiv.querySelector("#nav-prev")?.addEventListener("click", () => {
      window.scrollTo({top: 0, behavior: "smooth"});
      showPage(currentPage - 1);
    });
    navDiv.querySelector("#nav-next")?.addEventListener("click", () => {
      if (!validatePage(currentPage)) return;
      window.scrollTo({top: 0, behavior: "smooth"});
      showPage(currentPage + 1);
    });
    if (target === "both") {
      navDiv.querySelector("#submit-btn-wa")?.addEventListener("click", () => doSubmit("wa"));
      navDiv.querySelector("#submit-btn-tg")?.addEventListener("click", () => doSubmit("tg"));
    } else {
      navDiv.querySelector("#submit-btn")?.addEventListener("click", () => doSubmit());
    }
  }

  card.appendChild(navDiv);
  root.appendChild(card);

  // ── Branding footer & navbar ───────────────────────────────────
  // removeWatermark defaults to true — hides the topbar (logo/name) and the
  // "created using WateForm" footer, leaving only the form itself.
  const hideBranding = settings.removeWatermark !== false;
  document.querySelector(".form-topbar")?.classList.toggle("hidden", hideBranding);
  if (!hideBranding) {
    const branding = document.createElement("p");
    branding.style.cssText = "text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-muted)";
    branding.innerHTML = '<strong>This form was created using <a href="https://wateform.my.id" target="_blank" rel="noopener" style="color:#2bbda4;text-decoration:underline">WateForm</a></strong>';
    root.appendChild(branding);
  }

  // ── Validate a single page (for Next button) ────────────────
  function validatePage(pg) {
    let valid = true;
    const pageBlocks = pages[pg] || [];
    // Get questions that belong to this page by matching their rendered blocks
    const allBlocks = Array.from(card.querySelectorAll(".q-block"));
    // Filter questions that appear in the blocks of this page
    questions.forEach(q => {
      if (q.type === "page_break") return;
      const block = allBlocks.find(b => b.querySelector(`#q-${q.id}`) || b.querySelector(`#perr-${q.id}`));
      if (!block || !pageBlocks.includes(block)) return;
      const errEl = block?.querySelector(".q-err");

      if (q.type === "password") {
        const pwInp = block?.querySelector(`#q-${q.id}`);
        const perrEl = block?.querySelector(`#perr-${q.id}`);
        const entered = (pwInp?.value || "").trim();
        const expected = (q.passwordValue || "").trim();
        if (expected && entered !== expected) {
          if (perrEl) perrEl.style.display = "";
          if (pwInp) pwInp.style.borderColor = "var(--red)";
          valid = false;
        } else {
          if (perrEl) perrEl.style.display = "none";
          if (pwInp) pwInp.style.borderColor = "";
        }
        return;
      }

      if (["divider","spacer","button_link","title","image","video","page_break","url_input"].includes(q.type)) return;

      const ans = answers[q.id];
      let isEmpty;
      if (q.type === "map") {
        isEmpty = !ans || (!ans.lat && !ans.lng);
      } else {
        isEmpty = !ans || (typeof ans === 'string' && ans.trim() === '');
      }
      // Ranking: never required (always has a default order)
      if (q.required && isEmpty && q.type !== "ranking") {
        if (errEl) errEl.style.display = "";
        valid = false;
      } else {
        if (errEl) errEl.style.display = "none";
      }
    });
    if (!valid) {
      // Scroll to first error on this page
      const firstErr = pageBlocks.find(b => b.querySelector(".q-err:not([style*='none'])"));
      firstErr?.scrollIntoView({behavior:"smooth", block:"center"});
    }
    return valid;
  }

  // ── Validate helper ─────────────────────────────────────────
  function validateForm() {
    let valid = true;
    questions.forEach(q => {
      if (q.type === "page_break") return;
      const block = card.querySelectorAll(".q-block")[questions.filter(x => x.type !== "page_break").indexOf(q)];
      const errEl = block?.querySelector(".q-err");

      // Password gate: always validate regardless of required flag
      if (q.type === "password") {
        const pwInp = block?.querySelector(`#q-${q.id}`);
        const perrEl = block?.querySelector(`#perr-${q.id}`);
        const entered = (pwInp?.value || "").trim();
        const expected = (q.passwordValue || "").trim();
        if (expected && entered !== expected) {
          if (perrEl) perrEl.style.display = "";
          if (pwInp) pwInp.style.borderColor = "var(--red)";
          valid = false;
        } else {
          if (perrEl) perrEl.style.display = "none";
          if (pwInp) pwInp.style.borderColor = "";
        }
        return;
      }

      // Skip display-only fields
      if (["divider","spacer","button_link","page_break","url_input"].includes(q.type)) return;

      const ans = answers[q.id];
      let isEmpty;
      if (q.type === "map") {
        isEmpty = !ans || (!ans.lat && !ans.lng);
      } else {
        isEmpty = !ans || (typeof ans === 'string' && ans.trim() === '');
      }
      // Ranking: never required (always has a default order)
      if (q.required && isEmpty && q.type !== "ranking") {
        if (errEl) errEl.style.display = "";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "var(--red)";
        }
        valid = false;
      } else {
        if (errEl) errEl.style.display = "none";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "";
        }
      }
    });
    return valid;
  }

  // ── Submit ──────────────────────────────────────────────────
  let submitting = false;
  async function doSubmit(targetOverride) {
    if (submitting) return;
    if (!validateForm()) return;
    submitting = true;
    // Open a blank window IMMEDIATELY (synchronously, before any await) so mobile
    // browsers treat it as a direct user-gesture popup and don't block it.
    // We'll set its URL after the async work is done.
    const _msgWindow = window.open("", "_blank");
    const btns = [
      document.getElementById("submit-btn-wa"),
      document.getElementById("submit-btn-tg"),
      document.getElementById("submit-btn"),
    ].filter(Boolean);
    btns.forEach(b => b.disabled = true);

    try {
      // ── Insert response dulu (draft), lalu upload file, lalu update answers dengan link final ──
      const responseId = (crypto.randomUUID && crypto.randomUUID()) || genShortCode() + genShortCode();

      const { error: respErr } = await sb.from("responses").insert({
        id:      responseId,
        form_id: form.id,
        answers: answers,
        sent_to: targetOverride || target,
      });
      if (respErr) console.error("Failed to create response row:", respErr);

      // ── Upload file_upload fields ke Supabase Storage ──
      const fileQuestions = questions.filter(q => q.type === "file_upload" && fileMap[q.id]);
      for (const q of fileQuestions) {
        const file = fileMap[q.id];
        try {
          const storageOwner = form.storage_owner_id || form.created_by;

          // ── CEK KUOTA DULU sebelum upload (atomic: cek + increment dalam 1 RPC) ──
          const { data: quotaResult, error: quotaErr } = await sb.rpc("increment_storage_usage", {
            p_owner_id: storageOwner,
            p_bytes:    file.size,
          });

          // Jika kuota habis atau RPC error → tampilkan pesan, skip upload file ini
          if (quotaErr || !quotaResult || quotaResult.ok === false) {
            console.warn("Storage quota exceeded atau RPC error untuk owner:", storageOwner, quotaResult, quotaErr);
            const allBlocks = Array.from(card.querySelectorAll(".q-block"));
            const block = allBlocks.find(b => b.querySelector(`#fua-${q.id}`));
            if (block) {
              const errEl = block.querySelector(".q-err");
              if (errEl) {
                errEl.textContent = "The form owner has run out of storage. The file cannot be uploaded.";
                errEl.style.display = "";
              }
              const area = block.querySelector(`#fua-${q.id}`);
              if (area) area.style.borderColor = "var(--red)";
            }
            continue; // skip ke file berikutnya
          }

          // Kuota aman & sudah di-increment — lanjut upload
          const shortCode = genShortCode();
          const safeName  = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const filePath  = `${form.id}/${shortCode}/${safeName}`;

          const { error: uploadErr } = await sb.storage
            .from("response-uploads")
            .upload(filePath, file, { contentType: file.type, upsert: false });

          if (!uploadErr) {
            const { error: fuErr } = await sb.from("form_uploads").insert({
              short_code:  shortCode,
              form_id:     form.id,
              response_id: respErr ? null : responseId,
              owner_id:    storageOwner,
              file_name:   file.name,
              file_path:   filePath,
              file_size:   file.size,
              mime_type:   file.type || "application/octet-stream",
            });
            if (fuErr) console.error("form_uploads insert failed:", fuErr);

            answers[q.id] = `${file.name}||https://wateform.my.id/storage/${shortCode}`;
          } else {
            // Upload ke storage gagal padahal kuota sudah di-increment → rollback usage
            console.error("Upload ke storage gagal, rollback storage usage:", uploadErr);
            await sb.rpc("decrement_storage_usage", {
              p_owner_id: storageOwner,
              p_bytes:    file.size,
            }).catch(e => console.error("Rollback decrement gagal:", e));
          }
        } catch (fileErr) {
          console.error("File upload failed for question", q.id, fileErr);
        }
      }

      // ── PATCH answers dengan link file final menggunakan service-role via RPC ──
      if (!respErr && fileQuestions.length > 0) {
        const { error: updErr } = await sb.rpc("update_response_answers", {
          p_response_id: responseId,
          p_answers:     answers,
        });
        if (updErr) console.error("Failed to update response answers:", updErr);
      }
    } catch (err) {
      console.error("Failed to save response:", err);
      // Non-blocking: still let the person send their answers even if the save failed.
    }

    // Now point the pre-opened window to the real link.
    // Using location.href on the pre-opened window avoids the popup-blocker
    // issue on mobile (Chrome/Safari Android) that fires when window.open()
    // is called after an await.
    const _link = buildLink(settings, questions, answers, targetOverride, form?.title);
    if (_msgWindow && !_msgWindow.closed) {
      _msgWindow.location.href = _link;
    } else {
      // Fallback: try window.open again, or redirect current tab
      try { window.open(_link, "_blank"); } catch(e) { window.location.href = _link; }
    }
    showSuccess(settings, targetOverride);
    btns.forEach(b => b.disabled = false);
    submitting = false;
  }

  // Enter key on single-line inputs: go next or submit
  root.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const tag = e.target?.tagName?.toLowerCase();
      if (tag === "textarea") return;
      if (tag === "input" || tag === "select") {
        e.preventDefault();
        const isLast = currentPage === totalPages - 1;
        if (!isLast) {
          navDiv.querySelector("#nav-next")?.click();
        } else if (target === "both") {
          navDiv.querySelector("#submit-btn-wa")?.click();
        } else {
          navDiv.querySelector("#submit-btn")?.click();
        }
      }
    }
  });

  // Initialize: show first page
  showPage(0);
}

// ── Main: fetch form ──────────────────────────────────────────
(async function() {
  let form = null;

  if (customSlug) {
    // ── Custom single-segment URL: wateform.my.id/{slug} ──────
    const { data, error } = await sb
      .from("forms")
      .select("*")
      .eq("slug", customSlug)
      .maybeSingle();

    if (error || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else if (wsShort && formShort) {
    // ── Auto-generated two-segment URL: /ws_short/form_short ──
    const { data: wsData, error: wsErr } = await sb
      .from("workspaces")
      .select("id")
      .eq("short_id", wsShort)
      .single();

    if (wsErr || !wsData) {
      showError("This form link is invalid or has been deleted.");
      return;
    }

    const { data, error: formErr } = await sb
      .from("forms")
      .select("*")
      .eq("short_id", formShort)
      .eq("workspace_id", wsData.id)
      .single();

    if (formErr || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else {
    showError("No form ID found in the URL.");
    return;
  }

  if (!form.is_published) {
    showError("This form is not published yet.");
    return;
  }

  const s   = form.settings || {};
  const now = new Date();

  // Check Active toggle first — an inactive form always shows the inactive page
  if (s.isActive === false) {
    showInactive();
    return;
  }

  // Check open schedule
  if (s.openAt) {
    const openTime = new Date(s.openAt);
    if (now < openTime) {
      showScheduled("not-open", openTime, s.closeAt ? new Date(s.closeAt) : null, null);
      return;
    }
  }

  
  // Check close schedule
  if (s.closeAt) {
    const closeTime = new Date(s.closeAt);
    if (now >= closeTime) {
      showScheduled("closed", null, closeTime, s.closedMessage || null);
      return;
    }
  }

  renderForm(form);
})();
</script>
