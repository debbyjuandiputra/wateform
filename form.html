            <svg id="ptog-icon-${q.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="password-err" id="perr-${q.id}">Incorrect password. Please try again.</div>
        </div>`;
        break;
      }
      case "datetime": {
        const dtMode = q.datetimeMode || "date";
        const inpType = dtMode === "year" ? "number" : dtMode;
        inputHtml = `<input type="${inpType}" id="q-${q.id}" class="q-input" ${dtMode==="year"?"min='1900' max='2100' placeholder='YYYY'":""} style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      }
      case "ranking": {
        const rkOpts = Array.isArray(q.rankingOptions) && q.rankingOptions.length ? q.rankingOptions : ["Option 1","Option 2","Option 3"];
        inputHtml = `<div class="rank-list" id="rk-${q.id}">` +
          rkOpts.map((opt,i) => `<div class="rank-item" draggable="true" data-qid="${q.id}" data-idx="${i}">
            <span class="rank-num">${i+1}</span>
            <svg class="rank-handle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/></svg>
            <span class="rank-text">${esc(opt)}</span>
          </div>`).join("") +
          `</div>`;
        break;
      }
      case "emoji_rating": {
        const eset = q.emojiSet || "5";
        const emojis = eset==="2" ? ["\u{1F44E}","\u{1F44D}"] : eset==="3" ? ["\u{1F61E}","\u{1F610}","\u{1F60A}"] : ["\u{1F622}","\u{1F620}","\u{1F610}","\u{1F60A}","\u{1F601}"];
        inputHtml = `<div class="emoji-row" id="er-${q.id}">` +
          emojis.map((e,i) => `<button type="button" class="emoji-btn" data-qid="${q.id}" data-val="${i+1}" data-emoji="${e}">${e}</button>`).join("") +
          `</div>`;
        break;
      }
      case "slider": {
        const mn = q.sliderMin!=null ? q.sliderMin : 0;
        const mx = q.sliderMax!=null ? q.sliderMax : 100;
        const df = q.sliderDefault!=null ? q.sliderDefault : 50;
        const st = q.sliderStep || 1;
        const mnL = q.sliderMinLabel || "";
        const mxL = q.sliderMaxLabel || "";
        inputHtml = `<div class="slider-wrap">
          <div class="slider-val" id="sv-${q.id}">${df}</div>
          <input type="range" id="q-${q.id}" min="${mn}" max="${mx}" step="${st}" value="${df}" style="width:100%;accent-color:var(--teal);cursor:pointer">
          <div class="slider-labels">
            <span>${esc(mnL)||mn}</span>
            <span>${esc(mxL)||mx}</span>
          </div>
        </div>`;
        break;
      }
      case "nps_score": {
        const mnL = q.npsMinLabel || "Not likely";
        const mxL = q.npsMaxLabel || "Very likely";
        inputHtml = `<div class="nps-wrap" id="nps-${q.id}">
          <div class="nps-row">` +
          Array.from({length:11},(_,i)=>`<button type="button" class="nps-btn" data-qid="${q.id}" data-val="${i}">${i}</button>`).join("") +
          `</div>
          <div class="nps-labels"><span>${esc(mnL)}</span><span>${esc(mxL)}</span></div>
        </div>`;
        break;
      }
      case "calculation": {
        // Rendered as a live-updating summary card; no user input
        inputHtml = `<div class="calc-card" id="calc-${q.id}">
          <div class="calc-summary-label">${esc(q.calcLabel || "Order Summary")}</div>
          <div class="calc-total-row"><span class="calc-total-lbl">Total</span><span class="calc-total-val">—</span></div>
        </div>`;
        break;
      }
      case "payment": {
        // Render HTML payment field sesuai mode: fixed price atau dari Calculation
        var paymentSrc  = q.paymentSource || "fixed";
        var paymentItems = Array.isArray(q.paymentItems) ? q.paymentItems : [];

        // Baris breakdown item (hanya untuk mode fixed)
        var itemRowsHtml = "";
        if (paymentSrc === "fixed") {
          paymentItems.forEach(function(it) {
            if (!it.label && !it.value) return;
            itemRowsHtml += `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);padding:2px 0">
              <span>${esc(it.label || "Item")}</span>
              <span id="payment-total-${q.id}" style="display:none"></span>
            </div>`;
          });
        }

        inputHtml = `<div class="payment-card" id="payment-${q.id}">
          <div class="payment-card-header">${esc(q.paymentLabel || "Payment")}</div>
          ${q.paymentDescription ? `<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px">${esc(q.paymentDescription)}</div>` : ""}
          ${paymentSrc === "fixed" && paymentItems.length > 0 ? `<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)">${
            paymentItems.map(it => `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);padding:2px 0"><span>${esc(it.label || "Item")}</span><span style="font-family:'JetBrains Mono',monospace">Rp${Number(it.value||0).toLocaleString("en-US")}</span></div>`).join("")
          }</div>` : ""}
          <div class="payment-amount-row">
            <span>Total</span>
            <span class="payment-amount-val" id="payment-total-${q.id}">—</span>
          </div>
          <button type="button" class="btn-pay-qris" id="btn-pay-${q.id}" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            Pay with QRIS
          </button>
          <div class="payment-status-hint" id="payment-hint-${q.id}">${paymentSrc === "fixed" ? "Preparing payment..." : "Calculating total..."}</div>
        </div>`;
        break;
      }
        inputHtml = `<input type="text" id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
    }


    block.innerHTML = `
      ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px">` : ""}
      <div class="q-label"${q.type === "checkbox" ? ` style="margin-bottom:2px"` : ""}>${esc(q.title)}${req}</div>
      ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
      ${inputHtml}
      ${q.type !== "password" ? `<div class="q-err" style="font-size:12px;color:var(--red);display:none">This field is required.</div>` : ""}`;
    card.appendChild(block);

    // Helper: bind qty stepper buttons inside an opt element
    function bindQtyStepper(optEl, onChangeCallback) {
      const inp = optEl.querySelector(".opt-qty-val");
      if (!inp) return;
      const stepper = optEl.querySelector(".opt-qty-stepper");
      const qtyMin = parseInt(stepper?.dataset.qtyMin) || 1;
      const qtyMax = parseInt(stepper?.dataset.qtyMax) || 0;
      function clamp(v) {
        let val = Math.max(qtyMin, v);
        if (qtyMax > 0) val = Math.min(qtyMax, val);
        return val;
      }
      function setQty(v) {
        const val = clamp(v);
        inp.value = val;
        optEl.dataset.qty = val;
        onChangeCallback();
      }
      inp.addEventListener("click", e => e.stopPropagation());
      inp.addEventListener("mousedown", e => e.stopPropagation());
      inp.addEventListener("input", e => {
        e.stopPropagation();
        const raw = parseInt(inp.value);
        if (!isNaN(raw)) {
          optEl.dataset.qty = raw;
          onChangeCallback();
        }
      });
      inp.addEventListener("blur", e => {
        const raw = parseInt(inp.value);
        setQty(isNaN(raw) ? qtyMin : raw);
      });
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") { inp.blur(); e.preventDefault(); }
      });
    }

    // Bind checkbox multi-select events
    if (q.type === "checkbox") {
      const selectedVals = new Set();
      const cbMax = q.checkboxMax || 0;
      function buildCbAnswer(otherInput) {
        const parts = [];
        selectedVals.forEach(v => {
          if (v === "__other__") {
            const txt = otherInput?.value?.trim();
            if (txt) parts.push("Other: " + txt);
          } else {
            parts.push(v);
          }
        });
        answers[q.id] = parts.join(",");
        updateCalcFields(); updatePaymentFields();
      }
      block.querySelectorAll(".check-opt").forEach(opt => {
        const otherInput = block.querySelector(`#q-${q.id}-other`);
        opt.addEventListener("click", e => {
          // Don't toggle if click was on the stepper
          if (e.target.closest(".opt-qty-stepper")) return;
          const val = opt.dataset.val;
          if (opt.classList.contains("checked")) {
            opt.classList.remove("checked");
            selectedVals.delete(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "none";
          } else {
            if (cbMax > 0 && selectedVals.size >= cbMax) return;
            opt.classList.add("checked");
            selectedVals.add(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "";
          }
          buildCbAnswer(otherInput);
        });
        // Bind stepper buttons if present
        bindQtyStepper(opt, () => buildCbAnswer(otherInput));
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        const otherInput = e.target;
        const parts = [];
        selectedVals.forEach(v => {
          if (v === "__other__") {
            if (otherInput.value.trim()) parts.push("Other: " + otherInput.value.trim());
          } else {
            parts.push(v);
          }
        });
        answers[q.id] = parts.join(",");
        updateCalcFields(); updatePaymentFields();
      });
    }

    // Bind choice events
    if (q.type === "choice") {
      block.querySelectorAll(".choice-opt").forEach(opt => {
        const otherInput = block.querySelector(`#q-${q.id}-other`);
        opt.addEventListener("click", e => {
          if (e.target.closest(".opt-qty-stepper")) return;
          block.querySelectorAll(".choice-opt").forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          const val = opt.dataset.val;
          if (val === "__other__") {
            if (otherInput) otherInput.style.display = "";
            answers[q.id] = otherInput?.value || "";
          } else {
            if (otherInput) otherInput.style.display = "none";
            answers[q.id] = val;
          }
          updateCalcFields(); updatePaymentFields();
        });
        bindQtyStepper(opt, () => { updateCalcFields(); updatePaymentFields(); });
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        answers[q.id] = e.target.value;
        updateCalcFields(); updatePaymentFields();
      });
    }

    // Bind rating events
    if (q.type === "rating") {
      block.querySelectorAll(".star-opt").forEach(star => {
        star.addEventListener("click", () => {
          const val = Number(star.dataset.val);
          starState[q.id] = val;
          answers[q.id] = val + "/" + (q.maxRating || 5);
          block.querySelectorAll(".star-opt").forEach((s, i) => {
            s.classList.toggle("lit", i < val);
          });
        });
      });
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel) {
        sel.addEventListener("change", () => {
          answers[q.id] = sel.value;
        });
      }
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel && sel.tagName === "SELECT") sel.addEventListener("change", () => { answers[q.id] = sel.value; updateCalcFields(); updatePaymentFields(); });
      // Searchable dropdown (> 10 opts)
      const ddWrap = block.querySelector(`#ddw-${q.id}`);
      if (ddWrap) {
        const trigger = ddWrap.querySelector(`#q-${q.id}`);
        const list    = ddWrap.querySelector(`#ddl-${q.id}`);
        const search  = ddWrap.querySelector(`#dds-${q.id}`);
        const optsDiv = ddWrap.querySelector(`#ddo-${q.id}`);
        const noRes   = ddWrap.querySelector(`#ddnr-${q.id}`);
        trigger.addEventListener("click", () => { list.classList.toggle("open"); if (list.classList.contains("open")) search.focus(); });
        document.addEventListener("click", e => { if (!ddWrap.contains(e.target)) list.classList.remove("open"); }, true);
        search.addEventListener("input", () => {
          const q2 = search.value.toLowerCase();
          let shown = 0;
          optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
            const match = o.dataset.val.toLowerCase().includes(q2);
            o.style.display = match ? "" : "none";
            if (match) shown++;
          });
          noRes.style.display = shown === 0 ? "" : "none";
        });
        optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
          o.addEventListener("click", () => {
            optsDiv.querySelectorAll(".dropdown-option").forEach(x => x.classList.remove("selected"));
            o.classList.add("selected");
            trigger.value = o.dataset.val;
            answers[q.id] = o.dataset.val;
            updateCalcFields();
            list.classList.remove("open");
          });
        });
      }
    }

    // Bind file upload
    if (q.type === "file_upload") {
      const fileInput = block.querySelector(`#q-${q.id}`);
      const area = block.querySelector(`#fua-${q.id}`);
      const nameDiv = block.querySelector(`#fun-${q.id}`);
      const maxMb = q.maxFileSizeMb || 10;
      const processFile = file => {
        if (!file) return;
        if (file.size > maxMb * 1024 * 1024) {
          nameDiv.textContent = `File too large. Max ${maxMb}MB.`;
          nameDiv.style.color = "var(--red)";
          nameDiv.style.display = "";
          answers[q.id] = "";
          return;
        }
        nameDiv.style.color = "var(--teal)";
        nameDiv.textContent = "\u{1F4CE} " + file.name + " (" + (file.size/1024/1024).toFixed(2) + "MB)";
        nameDiv.style.display = "";
        fileMap[q.id] = file;
        answers[q.id] = "[Attached: " + file.name + "]";
      };
      area.addEventListener("click", () => fileInput.click());
      area.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
      area.addEventListener("dragover", e => { e.preventDefault(); area.classList.add("dragover"); });
      area.addEventListener("dragleave", () => area.classList.remove("dragover"));
      area.addEventListener("drop", e => { e.preventDefault(); area.classList.remove("dragover"); processFile(e.dataTransfer.files[0]); });
      fileInput.addEventListener("change", () => processFile(fileInput.files[0]));
    }

    // Bind color picker
    if (q.type === "color") {
      const colorInp = block.querySelector(`#q-${q.id}`);
      const swatch   = block.querySelector(`#csw-${q.id}`);
      const hexInput = block.querySelector(`#ci-hex-${q.id}`);
      const rgbInput = block.querySelector(`#ci-rgb-${q.id}`);
      const hslInput = block.querySelector(`#ci-hsl-${q.id}`);

      function hexToRgb(hex) {
        const h = hex.replace(/^#/,"");
        if (h.length !== 6) return null;
        const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
        if (isNaN(r)||isNaN(g)||isNaN(b)) return null;
        return {r,g,b};
      }
      function rgbToHsl(r,g,b) {
        r/=255; g/=255; b/=255;
        const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
        if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
          switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;default:h=((r-g)/d+4)/6;}}
        return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
      }
      function rgbToHex(r,g,b) {
        return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
      }
      function hslToRgb(h,s,l) {
        s/=100; l/=100;
        const k=n=>(n+h/30)%12;
        const a=s*Math.min(l,1-l);
        const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
        return {r:Math.round(f(0)*255),g:Math.round(f(8)*255),b:Math.round(f(4)*255)};
      }
      function parseRgb(str) {
        const m = str.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
        if (!m) return null;
        return {r:parseInt(m[1]),g:parseInt(m[2]),b:parseInt(m[3])};
      }
      function parseHsl(str) {
        const m = str.match(/(\d+)[°,\s]+(\d+)[%,\s]+(\d+)/);
        if (!m) return null;
        return {h:parseInt(m[1]),s:parseInt(m[2]),l:parseInt(m[3])};
      }

      function updateFromHex(hex, skipHexInput) {
        const rgb = hexToRgb(hex);
        if (!rgb) return;
        const {r,g,b} = rgb;
        const {h,s,l} = rgbToHsl(r,g,b);
        swatch.style.background = hex;
        colorInp.value = hex;
        if (!skipHexInput) hexInput.value = hex.toUpperCase();
        rgbInput.value = `${r}, ${g}, ${b}`;
        hslInput.value = `${h}°, ${s}%, ${l}%`;
        answers[q.id] = `${hex.toUpperCase()},RGB(${r},${g},${b}),HSL(${h}°,${s}%,${l}%)`;
      }

      updateFromHex(colorInp.value);

      // Native color picker → update all
      colorInp.addEventListener("input", () => updateFromHex(colorInp.value));

      // HEX input edited
      hexInput.addEventListener("input", () => {
        let v = hexInput.value.trim();
        if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9a-fA-F]{6}$/.test(v)) updateFromHex(v, true);
      });
      hexInput.addEventListener("blur", () => {
        let v = hexInput.value.trim();
        if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9a-fA-F]{6}$/.test(v)) updateFromHex(v, true);
        else hexInput.value = colorInp.value.toUpperCase();
      });

      // RGB input edited
      rgbInput.addEventListener("blur", () => {
        const rgb = parseRgb(rgbInput.value);
        if (rgb) updateFromHex(rgbToHex(rgb.r,rgb.g,rgb.b));
      });

      // HSL input edited
      hslInput.addEventListener("blur", () => {
        const hsl = parseHsl(hslInput.value);
        if (hsl) { const {r,g,b}=hslToRgb(hsl.h,hsl.s,hsl.l); updateFromHex(rgbToHex(r,g,b)); }
      });

      // Copy buttons
      block.querySelectorAll(".color-copy-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const inp = block.querySelector(`#${btn.dataset.target}`);
          if (!inp) return;
          navigator.clipboard?.writeText(inp.value).catch(()=>{});
          const orig = btn.textContent; btn.textContent = "✓";
          setTimeout(() => { btn.textContent = orig; }, 1200);
        });
      });
    }

    // Bind password
    if (q.type === "password") {
      const pwInp = block.querySelector(`#q-${q.id}`);
      const togBtn = block.querySelector(`#ptog-${q.id}`);
      const togIcon = block.querySelector(`#ptog-icon-${q.id}`);
      togBtn.addEventListener("click", () => {
        const isHidden = pwInp.type === "password";
        pwInp.type = isHidden ? "text" : "password";
        togIcon.innerHTML = isHidden
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      });
      pwInp.addEventListener("input", () => {
        answers[q.id] = pwInp.value;
        block.querySelector(`#perr-${q.id}`).style.display = "none";
      });
    }

    // Bind toggle
    if (q.type === "toggle") {
      const track  = block.querySelector(`#q-${q.id}`);
      const lblEl  = block.querySelector(`#qtl-${q.id}`);
      const onLbl  = q.toggleOnLabel  || "Yes";
      const offLbl = q.toggleOffLabel || "No";
      let state = !!q.toggleDefault;
      answers[q.id] = state ? onLbl : offLbl;
      track.addEventListener("click", () => {
        state = !state;
        track.classList.toggle("on", state);
        track.setAttribute("aria-pressed", state);
        if (lblEl) lblEl.textContent = state ? onLbl : offLbl;
        answers[q.id] = state ? onLbl : offLbl;
      });
    }

    // Bind multiselect
    if (q.type === "multiselect") {
      const trigger  = block.querySelector(`#mst-${q.id}`);
      const panel    = block.querySelector(`#mspanel-${q.id}`);
      const searchEl = block.querySelector(`#mssearch-${q.id}`);
      const listEl   = block.querySelector(`#mslist-${q.id}`);
      const noResEl  = block.querySelector(`#msnr-${q.id}`);
      const phEl     = block.querySelector(`#msp-${q.id}`);
      const msMax    = q.multiselectMax || 0;
      const selected = new Set();

      function updateTrigger() {
        const tags = [...selected].map(v =>
          `<span class="ms-tag">${esc(v)}<button type="button" class="ms-tag-rm" data-val="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`
        ).join("");
        if (selected.size === 0) {
          trigger.innerHTML = `<span class="ms-placeholder">${esc(q.multiselectPlaceholder||"Select options…")}</span>`;
        } else {
          trigger.innerHTML = tags;
          trigger.querySelectorAll(".ms-tag-rm").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              selected.delete(btn.dataset.val);
              listEl.querySelectorAll(".ms-opt").forEach(o => {
                if (o.dataset.val === btn.dataset.val) o.classList.remove("selected");
              });
              updateTrigger();

          updateCalcFields();
              updateCalcFields();

      function filterMs(q2) {
        let shown = 0;
        listEl.querySelectorAll(".ms-opt").forEach(o => {
          const match = o.dataset.val.toLowerCase().includes(q2.toLowerCase());

            selected.add(val); opt.classList.add("selected");

      block.querySelectorAll(`.likert-radio`).forEach(inp => {

          rowAnswers[inp.dataset.row] = inp.dataset.val;

          answers[q.id] = parts.join(",");

    // Bind matrix
    if (q.type === "matrix") {
      const mType = q.matrixType || "radio";

      // Base rule from selection type: "radio" behaves as one answer per row by default.
      // matrixAllowMultiple=true → free multi-select regardless of type.
      // Otherwise fall back to radio default (one answer per row).
      const onePerRow = q.matrixAllowMultiple ? false : (mType === "radio");
      const onePerCol = false;
      const selected = new Set(); // "ri,ci" keys

      function cellKey(ri, ci) { return `${ri},${ci}`; }

      function rebuildMatrixAnswer() {
        const parts = mRows.map((r, ri) => {
          const cols = [];
          block.querySelectorAll(`.matrix-cell[data-row="${ri}"]`).forEach(btn => {
            if (selected.has(cellKey(ri, Number(btn.dataset.col)))) cols.push(btn.dataset.colname);
          });
          return cols.length ? cols.map(c => `${r}-${c}`).join(",") : null;
        }).filter(Boolean);
        answers[q.id] = parts.join(",");
      }

      block.querySelectorAll(".matrix-cell").forEach(btn => {
        btn.addEventListener("click", () => {
          const ri = Number(btn.dataset.row);
          const ci = Number(btn.dataset.col);
          const key = cellKey(ri, ci);

          if (selected.has(key)) {
            // Click again on an already-selected cell → deselect it.
            selected.delete(key);
            btn.classList.remove("selected");
            btn.setAttribute("aria-pressed", "false");
          } else {
            if (onePerRow) {
              block.querySelectorAll(`.matrix-cell[data-row="${ri}"]`).forEach(other => {
                const otherKey = cellKey(ri, Number(other.dataset.col));
                if (selected.has(otherKey)) {
                  selected.delete(otherKey);
                  other.classList.remove("selected");
                  other.setAttribute("aria-pressed", "false");
                }
              });
            }
            if (onePerCol) {
              block.querySelectorAll(`.matrix-cell[data-col="${ci}"]`).forEach(other => {
                const otherKey = cellKey(Number(other.dataset.row), ci);
                if (selected.has(otherKey)) {
                  selected.delete(otherKey);
                  other.classList.remove("selected");
                  other.setAttribute("aria-pressed", "false");
                }

            selected.add(key);

    // Bind data_table
    if (q.type === "data_table") {

      const dtCols  = q.tableColumns || [];
      const dtCells = q.tableCells   || dtRows.map(() => dtCols.map(() => ""));
      const allowMultiple = q.tableAllowMultiple !== false; // default true
      const userVals = {};
      function rebuildDtAnswer() {
        const parts = [];
        // Use index-suffixed names as fallback so output is always unambiguous
        const rowLabels = dtRows.map((r, ri) => r || `Row ${ri + 1}`);
        const colLabels = dtCols.map((c, ci) => c || `Column ${ci + 1}`);
        rowLabels.forEach((r, ri) => {
          colLabels.forEach((c, ci) => {
            const ownerV = (dtCells[ri]||[])[ci] ?? "";
            const userV  = userVals[`${ri},${ci}`] || "";
            const val    = ownerV !== "" ? ownerV : userV;
            if (val) parts.push(`${r}-${c}=${val}`);

      const allInputs = [...block.querySelectorAll(".dt-user-input")];
      function updateSingleAnswerLock() {

        allInputs.forEach(i => {

      function updateRankAnswers() {
        const items = rkList.querySelectorAll(".rank-item");

            const allItems = [...rkList.querySelectorAll(".rank-item")];
            const srcIdx = allItems.indexOf(dragSrc);
            const tgtIdx = allItems.indexOf(item);

    if (!["choice","dropdown","rating","file_upload","color","password","url_input","checkbox",

            const suf = q.numSuffix && q.numSuffix.trim() !== "" ? " " + q.numSuffix.trim() : "";
            answers[q.id] = el.value.trim() === "" ? "" : (pre + el.value.trim() + suf);

  // ── Validate a single page (for Next button) ────────────────
  function validatePage(pg) {
    let valid = true;
    const pageBlocks = pages[pg] || [];
    // Get questions that belong to this page by matching their rendered blocks
    const allBlocks = Array.from(card.querySelectorAll(".q-block"));
    // Filter questions that appear in the blocks of this page
    questions.forEach(q => {
      if (q.type === "page_break") return;
      const block = allBlocks.find(b => b.querySelector(`#q-${q.id}`) || b.querySelector(`#perr-${q.id}`));
      if (!block || !pageBlocks.includes(block)) return;
      const errEl = block?.querySelector(".q-err");

      if (q.type === "password") {
        const pwInp = block?.querySelector(`#q-${q.id}`);
        const perrEl = block?.querySelector(`#perr-${q.id}`);
        const entered = (pwInp?.value || "").trim();
        const expected = (q.passwordValue || "").trim();
        if (expected && entered !== expected) {
          if (perrEl) perrEl.style.display = "";
          if (pwInp) pwInp.style.borderColor = "var(--red)";
          valid = false;
        } else {
          if (perrEl) perrEl.style.display = "none";
          if (pwInp) pwInp.style.borderColor = "";
        }
        return;
      }

      if (["divider","spacer","button_link","title","image","video","page_break","url_input"].includes(q.type)) return;

      const ans = answers[q.id];
      let isEmpty;
      if (q.type === "map") {
        isEmpty = !ans || (!ans.lat && !ans.lng);
      } else {
        isEmpty = !ans || (typeof ans === 'string' && ans.trim() === '');
      }
      // Ranking: never required (always has a default order)
      if (q.required && isEmpty && q.type !== "ranking") {
        if (errEl) errEl.style.display = "";
        valid = false;
      } else {
        if (errEl) errEl.style.display = "none";
      }
    });
    if (!valid) {
      // Scroll to first error on this page
      const firstErr = pageBlocks.find(b => b.querySelector(".q-err:not([style*='none'])"));
      firstErr?.scrollIntoView({behavior:"smooth", block:"center"});
    }
    return valid;
  }

  // ── Validate helper ─────────────────────────────────────────
  function validateForm() {
    let valid = true;
    questions.forEach(q => {
      if (q.type === "page_break") return;
      const block = card.querySelectorAll(".q-block")[questions.filter(x => x.type !== "page_break").indexOf(q)];
      const errEl = block?.querySelector(".q-err");

      // Password gate: always validate regardless of required flag
      if (q.type === "password") {
        const pwInp = block?.querySelector(`#q-${q.id}`);
        const perrEl = block?.querySelector(`#perr-${q.id}`);
        const entered = (pwInp?.value || "").trim();
        const expected = (q.passwordValue || "").trim();
        if (expected && entered !== expected) {
          if (perrEl) perrEl.style.display = "";
          if (pwInp) pwInp.style.borderColor = "var(--red)";
          valid = false;
        } else {
          if (perrEl) perrEl.style.display = "none";
          if (pwInp) pwInp.style.borderColor = "";
        }
        return;
      }

      // Skip display-only fields
      if (["divider","spacer","button_link","page_break","url_input"].includes(q.type)) return;

      const ans = answers[q.id];
      let isEmpty;
      if (q.type === "map") {
        isEmpty = !ans || (!ans.lat && !ans.lng);
      } else {
        isEmpty = !ans || (typeof ans === 'string' && ans.trim() === '');
      }
      // Ranking: never required (always has a default order)
      if (q.required && isEmpty && q.type !== "ranking") {
        if (errEl) errEl.style.display = "";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "var(--red)";
        }
        valid = false;
      } else {
        if (errEl) errEl.style.display = "none";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "";
        }
      }
    });
    return valid;
  }

  // ── Submit ──────────────────────────────────────────────────
  let submitting = false;
  async function doSubmit(targetOverride) {
    if (submitting) return;
    // Double-guard: block submit if any payment field has not been paid
    const _unpaidPayments = questions.filter(q => q.type === "payment" && !(paymentState[q.id] && paymentState[q.id].paid));
    if (_unpaidPayments.length > 0) return;
    if (!validateForm()) return;
    submitting = true;
    // Open a blank window IMMEDIATELY (synchronously, before any await) so mobile
    // browsers treat it as a direct user-gesture popup and don't block it.
    // We'll set its URL after the async work is done.
    // For "just submit" mode, skip opening any external window.
    const _isJust = (targetOverride || target) === "just";
    const _msgWindow = _isJust ? null : window.open("", "_blank");
    const btns = [
      document.getElementById("submit-btn-wa"),
      document.getElementById("submit-btn-wa2"),
      document.getElementById("submit-btn-tg"),
      document.getElementById("submit-btn-tg2"),
      document.getElementById("submit-btn"),
    ].filter(Boolean);
    btns.forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });

    try {
      // ── Insert response dulu (draft), lalu upload file, lalu update answers dengan link final ──
      const responseId = (crypto.randomUUID && crypto.randomUUID()) || genShortCode() + genShortCode();

      const { error: respErr } = await sb.from("responses").insert({
        id:      responseId,
        form_id: form.id,
        answers: answers,
        sent_to: targetOverride || target,
      });
      if (respErr) console.error("Failed to create response row:", respErr);

      // ── Upload file_upload fields ke Supabase Storage ──
      const fileQuestions = questions.filter(q => q.type === "file_upload" && fileMap[q.id]);
      for (const q of fileQuestions) {
        const file = fileMap[q.id];
        try {
          const storageOwner = form.storage_owner_id || form.created_by;

          // ── CEK KUOTA DULU sebelum upload (atomic: cek + increment dalam 1 RPC) ──
          const { data: quotaResult, error: quotaErr } = await sb.rpc("increment_storage_usage", {
            p_owner_id: storageOwner,
            p_bytes:    file.size,
          });

          // Jika kuota habis atau RPC error → tampilkan pesan, skip upload file ini
          if (quotaErr || !quotaResult || quotaResult.ok === false) {
            console.warn("Storage quota exceeded atau RPC error untuk owner:", storageOwner, quotaResult, quotaErr);
            const allBlocks = Array.from(card.querySelectorAll(".q-block"));
            const block = allBlocks.find(b => b.querySelector(`#fua-${q.id}`));
            if (block) {
              const errEl = block.querySelector(".q-err");
              if (errEl) {
                errEl.textContent = "The form owner has run out of storage. The file cannot be uploaded.";
                errEl.style.display = "";
              }
              const area = block.querySelector(`#fua-${q.id}`);
              if (area) area.style.borderColor = "var(--red)";
            }
            continue; // skip ke file berikutnya
          }

          // Kuota aman & sudah di-increment — lanjut upload
          const shortCode = genShortCode();
          const safeName  = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          const filePath  = `${form.id}/${shortCode}/${safeName}`;

          const { error: uploadErr } = await sb.storage
            .from("response-uploads")
            .upload(filePath, file, { contentType: file.type, upsert: false });

          if (!uploadErr) {
            const { error: fuErr } = await sb.from("form_uploads").insert({
              short_code:  shortCode,
              form_id:     form.id,
              response_id: respErr ? null : responseId,
              owner_id:    storageOwner,
              file_name:   file.name,
              file_path:   filePath,
              file_size:   file.size,
              mime_type:   file.type || "application/octet-stream",
            });
            if (fuErr) console.error("form_uploads insert failed:", fuErr);

            answers[q.id] = `${file.name}||https://wateform.my.id/storage/${shortCode}`;
          } else {
            // Upload ke storage gagal padahal kuota sudah di-increment → rollback usage
            console.error("Upload ke storage gagal, rollback storage usage:", uploadErr);
            await sb.rpc("decrement_storage_usage", {
              p_owner_id: storageOwner,
              p_bytes:    file.size,
            }).catch(e => console.error("Rollback decrement gagal:", e));
          }
        } catch (fileErr) {
          console.error("File upload failed for question", q.id, fileErr);
        }
      }

      // ── PATCH answers dengan link file final menggunakan service-role via RPC ──
      if (!respErr && fileQuestions.length > 0) {
        const { error: updErr } = await sb.rpc("update_response_answers", {
          p_response_id: responseId,
          p_answers:     answers,
        });
        if (updErr) console.error("Failed to update response answers:", updErr);
      }
    } catch (err) {
      console.error("Failed to save response:", err);
      // Non-blocking: still let the person send their answers even if the save failed.
    }

    // For "just submit": skip WA/TG redirect entirely — response is already saved above.
    if (!_isJust) {
      // Now point the pre-opened window to the real link.
      // Using location.href on the pre-opened window avoids the popup-blocker
      // issue on mobile (Chrome/Safari Android) that fires when window.open()
      // is called after an await.
      const _link = buildLink(settings, questions, answers, targetOverride, form?.title);
      if (_msgWindow && !_msgWindow.closed) {
        _msgWindow.location.href = _link;
      } else {
        // Fallback: try window.open again, or redirect current tab
        try { window.open(_link, "_blank"); } catch(e) { window.location.href = _link; }
      }
    }
    showSuccess(settings, targetOverride);
    // Re-enable submit only if no unpaid payment fields remain
    updateSubmitBtnState();
    submitting = false;
  }

  // Enter key on single-line inputs: go next or submit
  root.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const tag = e.target?.tagName?.toLowerCase();
      if (tag === "textarea") return;
      if (tag === "input" || tag === "select") {
        e.preventDefault();
        const isLast = currentPage === totalPages - 1;
        if (!isLast) {
          navDiv.querySelector("#nav-next")?.click();
        } else if (target === "both" || target === "wa2" || target === "tg2") {
          // For multi-button targets, Enter triggers the first button
          navDiv.querySelector("#submit-btn-wa")?.click() ||
          navDiv.querySelector("#submit-btn-tg")?.click();
        } else {
          navDiv.querySelector("#submit-btn")?.click();
        }
      }
    }
  });

  // Bind payment QRIS buttons
  questions.forEach(function(q) {
    if (q.type !== "payment") return;
    const btn = document.getElementById("btn-pay-" + q.id);
    if (btn) {
      btn.addEventListener("click", function() {
        // Validate all required fields before opening QRIS modal
        const unfilled = [];
        questions.forEach(function(fq) {
          if (fq.type === "page_break" || fq.type === "payment") return;
          if (["divider","spacer","button_link","url_input","title","image","video","calculation","ranking"].includes(fq.type)) return;
          if (!fq.required) return;
          const ans = answers[fq.id];
          let isEmpty;
          if (fq.type === "map") {
            isEmpty = !ans || (!ans.lat && !ans.lng);
          } else {
            isEmpty = !ans || (typeof ans === "string" && ans.trim() === "");
          }
          if (isEmpty) unfilled.push(fq);
        });

        if (unfilled.length > 0) {
          // Show alert
          alert("Please fill in all required fields before proceeding with payment.\n\n" +
            unfilled.map(function(fq, i) { return (i + 1) + ". " + (fq.label || ("Field #" + (i + 1))); }).join("\n"));
          // Highlight and scroll to first unfilled required field
          const allBlocks = Array.from(card.querySelectorAll(".q-block"));
          let firstErrBlock = null;
          unfilled.forEach(function(fq) {
            const block = allBlocks.find(function(b) { return b.querySelector("#q-" + fq.id) || b.querySelector("#fua-" + fq.id); });
            if (block) {
              const errEl = block.querySelector(".q-err");
              if (errEl) errEl.style.display = "";
              if (!firstErrBlock) firstErrBlock = block;
            }
          });
          if (firstErrBlock) firstErrBlock.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        openQrisModal(q.id);
      });
    }
  });

  // Initialize: show first page
  showPage(0);

  // Initial payment field state
  updatePaymentFields();
  updateSubmitBtnState();
}

// ── Main: fetch form ──────────────────────────────────────────
(async function() {
  let form = null;

  if (customSlug) {
    // ── Custom single-segment URL: wateform.my.id/{slug} ──────
    const { data, error } = await sb
      .from("forms")
      .select("*")
      .eq("slug", customSlug)
      .maybeSingle();

    if (error || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else if (wsShort && formShort) {
    // ── Auto-generated two-segment URL: /ws_short/form_short ──
    const { data: wsData, error: wsErr } = await sb
      .from("workspaces")
      .select("id")
      .eq("short_id", wsShort)
      .single();

    if (wsErr || !wsData) {
      showError("This form link is invalid or has been deleted.");
      return;
    }

    const { data, error: formErr } = await sb
      .from("forms")
      .select("*")
      .eq("short_id", formShort)
      .eq("workspace_id", wsData.id)
      .single();

    if (formErr || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else {
    showError("No form ID found in the URL.");
    return;
  }

  if (!form.is_published) {
    showError("This form is not published yet.");
    return;
  }

  // ── Check premium_status ─────────────────────────────────────────────────
  // frozen (30–60 hari): pemilik tidak bisa edit, tapi form TETAP bisa diakses responden.
  // locked (60+ hari)  : pemilik tidak bisa edit DAN form tertutup untuk responden.
  if (form.premium_status === "locked") {
    showLocked("locked");
    return;
  }

  const s   = form.settings || {};
  const now = new Date();

  // Check Active toggle first — an inactive form always shows the inactive page
  if (s.isActive === false) {
    showInactive();
    return;
  }

  // Check open schedule
  if (s.openAt) {
    const openTime = new Date(s.openAt);
    if (now < openTime) {
      showScheduled("not-open", openTime, s.closeAt ? new Date(s.closeAt) : null, null);
      return;
    }
  }

  
  // Check close schedule
  if (s.closeAt) {
    const closeTime = new Date(s.closeAt);
    if (now >= closeTime) {
      showScheduled("closed", null, closeTime, s.closedMessage || null);
      return;
    }
  }

  // Expose form owner id globally so payment functions can reference it
  window.formOwnerId = form.created_by || null;
  window.form = form;
  renderForm(form);
})();
</script>
