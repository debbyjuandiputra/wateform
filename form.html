<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { overflow-x: hidden; }
body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

.form-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
}
.form-topbar .brand img { height: 24px; }
.form-topbar .brand-word { font-size: 17px; }
.form-topbar.hidden { display: none; }

.form-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 48px 20px 80px;
}
.form-card {
  width: 100%; max-width: 560px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px;
  display: flex; flex-direction: column; gap: 24px;
}
.form-header { display: flex; flex-direction: column; gap: 8px; }
.form-title { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.25; }
.form-desc  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.6; }

.q-block { display: flex; flex-direction: column; gap: 8px; }
.q-label {
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: baseline; gap: 4px;
}
.q-label .req { color: var(--red); font-size: 13px; }
.q-subtitle { font-size: 13px; color: var(--text-soft); line-height: 1.55; }

/* Choice / radio */
.choice-list { display: flex; flex-direction: column; gap: 6px; }
.choice-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
  min-width: 0; box-sizing: border-box;
}
.choice-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.choice-opt.selected { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.choice-marker {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.choice-opt.selected .choice-marker { border-color: var(--teal); background: var(--teal); }
.choice-opt.selected .choice-marker::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
}

/* Checkbox multi-select */
.check-list { display: flex; flex-direction: column; gap: 6px; }
.check-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
  min-width: 0; box-sizing: border-box;
}
.check-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.check-opt.checked { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.check-marker {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.check-opt.checked .check-marker {
  border-color: var(--teal); background: var(--teal);
}
.check-opt.checked .check-marker::after {
  content: ''; width: 9px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.check-opt > span, .choice-opt > span {
  min-width: 0; overflow-wrap: break-word; word-break: break-word; flex: 1;
}

/* Quantity stepper (for options with pricing + quantity enabled) */
.opt-qty-stepper {
  display: flex; align-items: center;
  margin-left: auto; flex-shrink: 0;
  border: 1.5px solid var(--border); border-radius: 8px;
  overflow: hidden; background: var(--bg-raised);
  transition: border-color .15s;
  min-width: 64px; max-width: 64px;
}
.opt-qty-stepper:focus-within { border-color: var(--teal); }
.opt-qty-btn { display: none; }
.opt-qty-val {
  flex: 1; min-width: 0; width: 100%; text-align: center; font-size: 13px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace; color: var(--text);
  border: none; background: transparent; padding: 4px 8px; outline: none;
  -moz-appearance: textfield; appearance: textfield; cursor: text;
}
.opt-qty-val::-webkit-outer-spin-button,
.opt-qty-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.opt-price-tag {
  font-size: 11px; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
}

/* Star rating */
.star-row { display: flex; gap: 8px; }
.star-opt {
  background: none; border: none; font-size: 28px; cursor: pointer;
  color: var(--border); transition: color .1s; line-height: 1;
  padding: 0;
}
.star-opt.lit { color: var(--teal); }

/* Phone wrap */
.ph-wrap { display: flex; gap: 8px; width: 100%; min-width: 0; }
.ph-prefix { width: 140px; min-width: 0; flex-shrink: 1; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised); color: var(--text); font-size: 14px; outline: none; font-family: inherit; cursor: pointer; }
.ph-prefix:focus { border-color: var(--teal); }
.ph-input  { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raised); color: var(--text); font-size: 14px; outline: none; font-family: inherit; }
.ph-input:focus { border-color: var(--teal); }

/* Number prefix/suffix wrap */
.num-wrap { display: flex; gap: 0; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-raised); }
.num-affix { flex-shrink: 0; padding: 9px 10px; background: var(--bg-mid); color: var(--text); font-size: 14px; font-family: inherit; display: flex; align-items: center; white-space: nowrap; }
.num-affix.num-prefix { border-right: 1px solid var(--border); }
.num-affix.num-suffix { border-left: 1px solid var(--border); }
.num-input { flex: 1; min-width: 0; padding: 9px 12px; border: none; background: transparent; color: var(--text); font-size: 14px; outline: none; font-family: inherit; }

/* Submit */
.form-submit { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.btn-submit {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
  background: var(--teal); color: #04231C; border: none;
  border-radius: var(--radius); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s;
}
.btn-submit:hover { background: var(--teal-deep); color: #fff; }
.btn-submit-wa { background: #25D366; color: #fff; }
.btn-submit-wa:hover { background: #1da851; color: #fff; }
.btn-submit-wa2 { background: #128C7E; color: #fff; }
.btn-submit-wa2:hover { background: #0e6d62; color: #fff; }
.btn-submit-tg { background: #229ED9; color: #fff; }
.btn-submit-tg:hover { background: #1a7fad; color: #fff; }
.btn-submit-tg2 { background: #1A7FAF; color: #fff; }
.btn-submit-tg2:hover { background: #14618a; color: #fff; }
/* Payment field */
.payment-card { background:var(--bg-raised); border:1.5px solid var(--teal,#2bbda4); border-radius:10px; padding:16px; }
.payment-card-header { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin-bottom:8px; }
.payment-amount-row { display:flex; justify-content:space-between; font-weight:700; font-size:17px; padding:8px 0; border-top:1px solid var(--border); margin-bottom:12px; }
.payment-amount-val { color:var(--teal-deep,#1a9a87); }
.btn-pay-qris { width:100%; padding:11px; background:var(--teal,#2bbda4); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s; }
.btn-pay-qris:hover { background:var(--teal-deep,#1a9a87); }
.btn-pay-qris:disabled { background:var(--border); color:var(--text-muted); cursor:not-allowed; }
.btn-pay-qris.paid { background:transparent; color:#16a34a; border:2px solid #16a34a; cursor:default; }
.btn-payment-success { width:100%; padding:11px; background:var(--bg,#fff); color:#16a34a; border:2px solid #16a34a; border-radius:8px; font-size:14px; font-weight:600; cursor:default; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s; }
.payment-status-hint { font-size:12px; color:var(--text-muted); margin-top:8px; text-align:center; }
/* Form lock after payment */
.q-block.form-field-locked { position:relative; pointer-events:none; user-select:none; opacity:0.72; }
.q-block.form-field-locked::after { content:""; position:absolute; inset:0; border-radius:inherit; cursor:not-allowed; z-index:10; }
.form-locked-notice { display:flex; align-items:center; gap:8px; background:var(--bg-mid); border:1px solid #16a34a44; border-radius:10px; padding:10px 14px; margin-bottom:4px; font-size:12.5px; color:#16a34a; font-weight:500; }
.form-locked-notice svg { flex-shrink:0; }
.payment-status-paid { font-size:13px; color:#16a34a; font-weight:600; text-align:center; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
.qris-modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9999; display:flex; align-items:center; justify-content:center; }
.qris-modal { background:var(--bg); border-radius:16px; padding:24px; max-width:340px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; }
.qris-modal-title { font-size:16px; font-weight:700; margin-bottom:4px; }
.qris-modal-amount { font-size:22px; font-weight:800; color:var(--teal-deep,#1a9a87); margin-bottom:12px; }
.qris-img-wrap { background:#fff; border-radius:10px; padding:12px; display:inline-block; margin-bottom:12px; }
.qris-img-wrap img { display:block; width:220px; height:220px; object-fit:contain; }
.qris-countdown { font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.qris-countdown span { font-weight:700; color:var(--text); }
.qris-checking { font-size:12px; color:var(--text-muted); display:flex; align-items:center; justify-content:center; gap:6px; }
.qris-close-btn { margin-top:10px; font-size:13px; color:var(--text-muted); background:none; border:none; cursor:pointer; text-decoration:underline; }

/* ── Page navigation ──────────────────────────────────────── */
.form-nav { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
.page-progress {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.page-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  white-space: nowrap;
}
.page-dots { display: flex; gap: 6px; align-items: center; }
.page-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: background .2s, transform .2s;
}
.page-dot.done { background: var(--teal); opacity: .5; }
.page-dot.active {
  background: var(--teal); transform: scale(1.35);
}
.page-nav-btns {
  display: flex; align-items: stretch; gap: 8px;
}
.btn-page-prev, .btn-page-next {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; font-size: 13px; font-weight: 600;
  border-radius: var(--radius); cursor: pointer;
  border: 1.5px solid var(--border); background: var(--bg-mid);
  color: var(--text); transition: background .15s, border-color .15s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-page-prev:hover { border-color: var(--text-muted); background: var(--bg-raised); }
.btn-page-next {
  border-color: var(--teal); background: var(--teal-dim);
  color: var(--teal-deep); margin-left: auto;
}
[data-theme="dark"] .btn-page-next { color: var(--teal); }
.btn-page-next:hover { background: var(--teal); color: #04231C; }
.page-nav-btns .form-submit { margin-top: 0; flex: 1; }

/* q-block hidden between pages */
.q-block[style*="display: none"] { display: none !important; }

/* States */
.state-screen {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}
.state-box { text-align: center; max-width: 400px; }
.state-box h2 { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
.state-box p  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.65; }
.state-icon { color: var(--teal); margin-bottom: 20px; }

/* Countdown */
.cd-unit {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 62px;
}
.cd-val {
  font-size: 36px; font-weight: 800; line-height: 1;
  color: var(--teal);
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 10px 14px;
  min-width: 62px; text-align: center; font-variant-numeric: tabular-nums;
}
.cd-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.cd-sep { font-size: 32px; font-weight: 800; color: var(--text-muted); align-self: center; line-height: 1; padding-bottom: 18px; }

@media (max-width: 600px) {
  .form-card { padding: 24px 18px; }
  .form-topbar { padding: 12px 16px; }
  .cd-val { font-size: 26px; min-width: 48px; padding: 8px 10px; }
  .cd-unit { min-width: 48px; }
  .cd-sep { font-size: 24px; }
}

/* File upload field */
.file-upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 28px 20px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s; position: relative;
}
.file-upload-area:hover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area.dragover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area input[type="file"] { display: none; }
.file-upload-icon { color: var(--teal); margin-bottom: 8px; }
.file-upload-name {
  font-size: 13px; color: var(--teal); margin-top: 8px;
  word-break: break-all; font-weight: 600;
}
.file-upload-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Color picker */
.color-picker-wrap { display: flex; flex-direction: column; gap: 10px; }
.color-picker-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.color-picker-row input[type="color"] {
  width: 56px; height: 48px; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3px; cursor: pointer;
  background: var(--bg-raised);
}
.color-codes { display: flex; gap: 8px; flex-wrap: wrap; }
.color-code-chip {
  display:inline-flex; align-items:center; gap:5px;
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; font-family: 'JetBrains Mono', monospace;
  background: var(--bg-mid); color: var(--text);
  cursor: pointer; transition: background .15s;
}
.color-code-chip:hover { background: var(--teal-dim); border-color: var(--teal); }
.color-code-chip label { font-weight:700; color:var(--text-muted); font-size:11px; flex-shrink:0; cursor:pointer; }
.color-code-input {
  background:none; border:none; outline:none; color:var(--text);
  font-family:'JetBrains Mono',monospace; font-size:12px;
  min-width:0; width:auto; cursor:text;
}
.color-copy-btn {
  background:none; border:none; cursor:pointer; color:var(--text-muted);
  padding:0 0 0 4px; font-size:11px; line-height:1; flex-shrink:0;
}
.color-copy-btn:hover { color:var(--teal); }
.color-swatch {
  width: 48px; height: 48px; border-radius: 8px;
  border: 1px solid var(--border); flex-shrink: 0;
}

/* Password field */
.password-wrap { position: relative; }
.password-wrap input { padding-right: 44px !important; }
.password-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  padding: 4px; display: flex; align-items: center;
}
.password-toggle:hover { color: var(--teal); }
.password-err {
  font-size: 12px; color: var(--red); margin-top: 4px; display: none;
}

/* URL input */
.url-input-wrap { position: relative; }
.url-input-wrap input { padding-left: 36px !important; }
.url-prefix-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}

/* Dropdown with search */
.dropdown-search-wrap { position: relative; }
.dropdown-search-input {
  width: 100%; padding: 9px 36px 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-raised); color: var(--text);
  font-size: 14px; outline: none; font-family: inherit; cursor: pointer;
}
.dropdown-search-input:focus { border-color: var(--teal); }
.dropdown-list {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); max-height: 220px; overflow-y: auto;
  box-shadow: var(--shadow);
}
.dropdown-list.open { display: block; }
.dropdown-search-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-soft);
  position: sticky; top: 0; background: var(--bg-raised);
}
.dropdown-search-box input {
  width: 100%; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-mid); color: var(--text);
  font-size: 13px; outline: none; font-family: inherit;
}
.dropdown-search-box input:focus { border-color: var(--teal); }
.dropdown-option {
  padding: 9px 14px; cursor: pointer; font-size: 14px; color: var(--text);
  transition: background .1s;
}
.dropdown-option:hover, .dropdown-option.highlighted { background: var(--teal-dim); color: var(--teal-deep); }
.dropdown-option.selected { font-weight: 600; color: var(--teal-deep); }
.dropdown-no-results { padding: 10px 14px; font-size: 13px; color: var(--text-muted); }
.dropdown-arrow {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--text-muted);
}

/* ── Toggle Switch ─────────────────────────────── */
.toggle-switch-wrap { display:flex; align-items:center; gap:14px; }
.toggle-track {
  width:52px; height:28px; border-radius:14px; background:var(--border);
  position:relative; cursor:pointer; transition:background .2s; flex-shrink:0;
  border:none; padding:0;
}
.toggle-track.on { background:var(--teal); }
/* Override global .toggle-track::after for form toggle */
.toggle-switch-wrap .toggle-track::after {
  content:''; position:absolute;
  width:20px; height:20px; border-radius:50%; background:#fff;
  top:4px; left:4px;
  box-shadow:0 1px 4px rgba(0,0,0,.22);
  transition:transform .2s;
  transform:translateX(0);
}
.toggle-switch-wrap .toggle-track.on::after {
  transform:translateX(24px);
}
.toggle-label-text { font-size:14px; color:var(--text); min-width:32px; }

/* ── Multi-select Dropdown ─────────────────────── */
.ms-wrap { position:relative; }
.ms-trigger {
  width:100%; min-height:44px; padding:6px 36px 6px 10px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-raised); cursor:pointer;
  display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  font-size:14px; color:var(--text-muted); font-family:inherit;
}
.ms-trigger:focus { outline:none; border-color:var(--teal); }
.ms-tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; background:var(--teal-dim);
  border:1px solid var(--teal); border-radius:20px;
  font-size:12px; color:var(--teal-deep); font-weight:600;
}
.ms-tag-rm {
  background:none; border:none; cursor:pointer;
  color:var(--teal-deep); padding:0 0 0 2px; font-size:14px; line-height:1;
}
.ms-tag-rm:hover { color:var(--red); }
.ms-arrow { position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--text-muted); }
.ms-panel {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
  background:var(--bg-raised); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.ms-panel.open { display:block; }
.ms-search-box { padding:8px 10px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--bg-raised); }
.ms-search-box input { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-mid); color:var(--text); font-size:13px; outline:none; font-family:inherit; }
.ms-options { max-height:200px; overflow-y:auto; }
.ms-opt {
  padding:9px 14px; cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; gap:8px; transition:background .1s;
}
.ms-opt:hover { background:var(--teal-dim); }
.ms-opt.selected { font-weight:600; color:var(--teal-deep); background:var(--teal-dim); }
.ms-opt-check { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ms-opt.selected .ms-opt-check { background:var(--teal); border-color:var(--teal); }
.ms-opt.selected .ms-opt-check::after { content:""; width:9px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }

function normOpt(o) {
  return typeof o === "string" ? { label: o, value: "" } : { label: String(o.label ?? o), value: o.value ?? "" };
}
function normOpts(arr) { return (arr || []).map(normOpt); }

function evalCalcOps(subtotal, ops) {
  let total = subtotal;
  (ops || []).forEach(function(op) {
    var v = Number(op.value) || 0;
    if      (op.op === "add")      total += v;
    else if (op.op === "subtract") total -= v;
    else if (op.op === "multiply") total *= v;
    else if (op.op === "percent")  total += subtotal * v / 100;
  });
  return total;
}

function fmtCalc(n, q) {
  var pfx = q.calcPrefix !== undefined ? q.calcPrefix : "";
  var sfx = q.calcSuffix !== undefined ? q.calcSuffix : "";
  var dec = q.calcDecimals || 0;
  return pfx + Number(n).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + sfx;
}

function updateCalcFields() {
  if (typeof questions === "undefined" || typeof answers === "undefined") return;
  questions.forEach(function(cq) {
    if (cq.type !== "calculation") return;
    var el = document.getElementById("calc-" + cq.id);
    if (!el) return;

    var subtotal = 0;
    var itemLines = [];

    questions.forEach(function(pq) {
      if (!pq.optionWithValue) return;
      var rawOpts = pq.type === "checkbox"
        ? (pq.checkboxOptions || pq.options || [])
        : (pq.options || pq.multiselectOptions || []);
      var opts = normOpts(rawOpts);
      var ans = answers[pq.id] || "";
      var withQty = pq.optionWithQuantity;

      // Helper: read live qty from DOM for an option label in a given field
      function getLiveQty(optLabel) {
        if (!withQty) return 1;
        // Find the rendered opt element by data-val
        var selector = "[data-qid='" + CSS.escape(pq.id) + "'][data-val='" + CSS.escape(optLabel) + "']";
        var optEl = document.querySelector(selector);
        if (!optEl) return 1;
        var qtyStr = optEl.dataset.qty;
        var qty = parseInt(qtyStr);
        return (isNaN(qty) || qty < 1) ? 1 : qty;
      }

      if (pq.type === "choice" || pq.type === "dropdown") {
        opts.forEach(function(o) {
          if (o.label === ans && o.value !== "") {
            var price = Number(o.value);
            var qty   = getLiveQty(o.label);
            var v     = price * qty;
            subtotal += v;
            itemLines.push({ label: pq.title || pq.type, opt: o.label, value: v, price: price, qty: qty, withQty: withQty });
          }
        });
      } else if (pq.type === "checkbox" || pq.type === "multiselect") {
        var selected = ans ? ans.split(",").map(function(s){ return s.trim(); }) : [];
        opts.forEach(function(o) {
          if (selected.indexOf(o.label) !== -1 && o.value !== "") {
            var price = Number(o.value);
            var qty   = getLiveQty(o.label);
            var v     = price * qty;
            subtotal += v;
            itemLines.push({ label: pq.title || pq.type, opt: o.label, value: v, price: price, qty: qty, withQty: withQty });
          }
        });
      }
    });

    var total = evalCalcOps(subtotal, cq.calcOps || []);
    var showBreakdown = cq.calcShowBreakdown !== false;
    var html = "";

    html += "<div class=\"calc-summary-label\">" + esc(cq.calcLabel || "Order Summary") + "</div>";

    if (showBreakdown && itemLines.length) {
      itemLines.forEach(function(it) {
        var qtyTag = (it.withQty && it.qty > 1)
          ? "<span class=\"calc-row-opt\"> ×" + it.qty + "</span>"
          : "";
        html += "<div class=\"calc-row\"><span class=\"calc-row-name\">" + esc(it.label)
          + "<span class=\"calc-row-opt\"> — " + esc(it.opt) + "</span>" + qtyTag
          + "</span><span class=\"calc-row-val\">" + fmtCalc(it.value, cq) + "</span></div>";
      });
    }

    if (showBreakdown && subtotal > 0 && (cq.calcOps || []).length) {
      html += "<div class=\"calc-divider\"></div>";
      var running = subtotal;
      (cq.calcOps || []).forEach(function(op) {
        var v = Number(op.value) || 0;
        var amount = 0;
        if      (op.op === "add")      { amount =  v; running += v; }
        else if (op.op === "subtract") { amount = -v; running -= v; }
        else if (op.op === "multiply") { amount = running * (v - 1); running *= v; }
        else if (op.op === "percent")  { amount = subtotal * v / 100; running += amount; }
        var opLabel = op.label || "";
        html += "<div class=\"calc-row\"><span class=\"calc-row-name\">" + esc(opLabel) + "</span><span class=\"calc-row-val\">" + (amount >= 0 ? "+" : "") + fmtCalc(amount, cq) + "</span></div>";
      });
    }

    html += "<div class=\"calc-total-row\"><span class=\"calc-total-lbl\">Total</span><span class=\"calc-total-val\">" + fmtCalc(total, cq) + "</span></div>";
    el.innerHTML = html;

    // Store for WA/Tele message
    answers[cq.id] = cq.calcSendOnlyTotal !== false
      ? fmtCalc(total, cq)
      : itemLines.map(function(i){
          var qtyPart = (i.withQty && i.qty > 1) ? " ×" + i.qty : "";
          return i.opt + qtyPart + ": " + fmtCalc(i.value, cq);
        }).join(", ") + " | " + fmtCalc(total, cq);
  });
}


// ── Payment field state ──────────────────────────────────────────────────────────────────────────────────
// Maps payment field id => { paid: bool, refNo: str, amount: num, isStatic: bool, bgPollSince: number }
var paymentState = {};
// Total from linked calculation per payment field id
var paymentTotals = {};

function getSubmitBtns() {
  return [
    document.getElementById("submit-btn-wa"),
    document.getElementById("submit-btn-wa2"),
    document.getElementById("submit-btn-tg"),
    document.getElementById("submit-btn-tg2"),
    document.getElementById("submit-btn"),
  ].filter(Boolean);
}

function updateSubmitBtnState() {
  var paymentFields = (typeof questions !== "undefined") ? questions.filter(function(q){ return q.type === "payment"; }) : [];
  var allPaid = paymentFields.length === 0 || paymentFields.every(function(q){ return paymentState[q.id] && paymentState[q.id].paid; });
  getSubmitBtns().forEach(function(btn){
    btn.disabled = !allPaid;
    btn.title = allPaid ? "" : "Complete QRIS payment first";
    btn.style.opacity = allPaid ? "" : "0.5";
    btn.style.cursor = allPaid ? "" : "not-allowed";
  });
}

function updatePaymentFields() {
  if (typeof questions === "undefined" || typeof answers === "undefined") return;
  questions.forEach(function(pq) {
    if (pq.type !== "payment") return;

    var src = pq.paymentSource || "fixed";
    var total = 0;

    if (src === "fixed") {
      // Mode harga tetap: jumlahkan semua item dari paymentItems
      var items = Array.isArray(pq.paymentItems) ? pq.paymentItems : [];
      items.forEach(function(it) {
        var v = parseFloat(it.value);
        if (!isNaN(v) && v > 0) total += v;
      });
    } else {
      // Mode calculation: ambil total dari field Calculation
      var calcQ = questions.find(function(q){ return q.type === "calculation"; });
      if (!calcQ) { paymentTotals[pq.id] = 0; return; }

      var subtotal = 0;
      questions.forEach(function(src) {
        if (!src.optionWithValue) return;
        var rawOpts = src.type === "checkbox"
          ? (src.checkboxOptions || src.options || [])
          : (src.options || src.multiselectOptions || []);
        var opts = normOpts(rawOpts);
        var ans = answers[src.id] || "";
        function getLiveQtyPayment(optLabel) {
          if (!src.optionWithQuantity) return 1;
          var selector = "[data-qid='" + CSS.escape(src.id) + "'][data-val='" + CSS.escape(optLabel) + "']";
          var optEl = document.querySelector(selector);
          if (!optEl) return 1;
          var qty = parseInt(optEl.dataset.qty);
          return (isNaN(qty) || qty < 1) ? 1 : qty;
        }
        if (src.type === "choice" || src.type === "dropdown") {
          opts.forEach(function(o){ if (o.label === ans && o.value !== "") { subtotal += Number(o.value) * getLiveQtyPayment(o.label); } });
        } else if (src.type === "checkbox" || src.type === "multiselect") {
          var sel = ans ? ans.split(",").map(function(s){ return s.trim(); }) : [];
          opts.forEach(function(o){ if (sel.indexOf(o.label) !== -1 && o.value !== "") { subtotal += Number(o.value) * getLiveQtyPayment(o.label); } });
        }
      });
      total = evalCalcOps(subtotal, calcQ.calcOps || []);
    }

    paymentTotals[pq.id] = total;

    var totalEl = document.getElementById("payment-total-" + pq.id);
    var payBtn  = document.getElementById("btn-pay-" + pq.id);
    var hintEl  = document.getElementById("payment-hint-" + pq.id);
    if (!totalEl) return;

    // Format angka tampilan — gunakan format Calculation jika mode calculation, atau Rp default
    var calcQ2 = questions.find(function(q){ return q.type === "calculation"; });
    var fmtTotal = (src === "calculation" && calcQ2)
      ? fmtCalc(total, calcQ2)
      : ("Rp" + total.toLocaleString("en-US"));
    totalEl.textContent = fmtTotal;

    var paid = paymentState[pq.id] && paymentState[pq.id].paid;
    if (paid) {
      var paidAmount = paymentState[pq.id].amount;
      var calcQPaid = (typeof questions !== "undefined") ? questions.find(function(q){ return q.type === "calculation"; }) : null;
      var fmtPaid = (src === "calculation" && calcQPaid)
        ? fmtCalc(paidAmount, calcQPaid)
        : ("Rp" + paidAmount.toLocaleString("en-US"));
      if (totalEl) totalEl.textContent = fmtPaid;
      if (payBtn) {
        payBtn.style.display = "";
        payBtn.disabled = true;
        payBtn.className = "btn-payment-success";
        payBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg> Payment Successful';
      }
      if (hintEl) { hintEl.className = ""; hintEl.innerHTML = ""; }
      // Bersihkan bar dan tombol yang tidak perlu setelah paid
      var _apBarDone = document.getElementById("card-already-paid-" + pq.id);
      if (_apBarDone) _apBarDone.remove();
      var _showAgainDone = document.getElementById("card-show-qris-" + pq.id);
      if (_showAgainDone) _showAgainDone.remove();
      if (window._alreadyPaidBarTimer) { clearTimeout(window._alreadyPaidBarTimer); window._alreadyPaidBarTimer = null; }
    } else {
      var hasPendingRef = paymentState[pq.id] && paymentState[pq.id].refNo && !paymentState[pq.id].paid;
      if (payBtn) {
        payBtn.style.display = "";
        payBtn.disabled = hasPendingRef || (total <= 0);
        payBtn.innerHTML = hasPendingRef
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Waiting for payment...'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> Pay with QRIS';
        payBtn.style.background = hasPendingRef ? "var(--border)" : "";
        payBtn.style.color = hasPendingRef ? "var(--text-muted)" : "";
        payBtn.style.cursor = hasPendingRef ? "not-allowed" : "";
        payBtn.className = "btn-pay-qris";
        payBtn.classList.remove("paid");
      }
      if (hintEl) {
        var bgPollSince = paymentState[pq.id] && paymentState[pq.id].bgPollSince;
        var bgElapsed   = bgPollSince ? (Date.now() - bgPollSince) : 0;
        var showCardReport = hasPendingRef && bgElapsed >= 50000;
        var cardReportId   = "card-report-" + pq.id;
        var existingReport = document.getElementById(cardReportId);
        var showQrisAgainId = "card-show-qris-" + pq.id;
        var existingShowAgain = document.getElementById(showQrisAgainId);

        if (hasPendingRef) {
          hintEl.className = "payment-status-hint";
          hintEl.textContent = "Verifying payment... Submit button will activate automatically.";

          // Tombol "Show QRIS again" — selalu tampilkan saat ada pending transaction
          if (!existingShowAgain) {
            var showAgainEl = document.createElement("div");
            showAgainEl.id = showQrisAgainId;
            showAgainEl.style.cssText = "text-align:center;margin-top:6px";
            var showAgainBtn = document.createElement("button");
            showAgainBtn.type = "button";
            showAgainBtn.style.cssText = "font-size:12px;color:var(--teal-deep,#1a9a87);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0";
            showAgainBtn.textContent = "Show QRIS again";
            showAgainBtn.addEventListener("click", function() { reopenQrisModal(pq.id); });
            showAgainEl.appendChild(showAgainBtn);
            hintEl.parentNode.insertBefore(showAgainEl, hintEl.nextSibling);
          }
          if (showCardReport && !existingReport) {
            var reportEl = document.createElement("div");
            reportEl.id = cardReportId;
            reportEl.style.cssText = "text-align:center;margin-top:8px";
            var reportA = document.createElement("a");
            reportA.href = "#";
            reportA.style.cssText = "font-size:12px;color:#ef4444;text-decoration:underline;cursor:pointer";
            reportA.textContent = "Already paid but not detected?";
            reportA.addEventListener("click", function(e) {
              e.preventDefault();
              var sessionData = typeof sb !== "undefined" ? sb.auth.getSession() : Promise.resolve({ data: { session: null } });
              sessionData.then(function(sd) {
                var userEmail = (sd && sd.data && sd.data.session && sd.data.session.user) ? sd.data.session.user.email : "";
                var now = new Date();
                var timeStr = now.toLocaleString("en-GB", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
                var subject = encodeURIComponent("Payment not detected");
                var body = encodeURIComponent(
                  "Email: " + userEmail + "\n" +
                  "Ref No: " + (paymentState[pq.id] ? paymentState[pq.id].refNo : "") + "\n" +
                  "Time: " + timeStr + "\n" +
                  "Message: "
                );
                window.location.href = "mailto:wateform@gmail.com?subject=" + subject + "&body=" + body;
              });
            });
            reportEl.appendChild(reportA);
            hintEl.parentNode.insertBefore(reportEl, hintEl.nextSibling);
          } else if (!showCardReport && existingReport) {
            existingReport.remove();
          }
        } else {
          if (existingReport) existingReport.remove();
          var _showAgainClean = document.getElementById("card-show-qris-" + pq.id);
          if (_showAgainClean) _showAgainClean.remove();
          hintEl.className = "payment-status-hint";
          hintEl.textContent = total > 0
            ? "Submit button will activate after payment is confirmed"
            : (src === "fixed" ? "No price set" : "Calculating total...");
        }
      }
    }
  });
  updateSubmitBtnState();
  lockFormForPayment();
}

// ── Lock / unlock form fields setelah payment berhasil ─────────────────────
function lockFormForPayment() {
  if (typeof questions === "undefined") return;
  var anyPaid = questions.some(function(q) {
    return q.type === "payment" && paymentState[q.id] && paymentState[q.id].paid;
  });

  // Tampilkan/sembunyikan notice banner
  var existingNotice = document.getElementById("form-locked-notice");
  if (anyPaid && !existingNotice) {
    var notice = document.createElement("div");
    notice.id = "form-locked-notice";
    notice.className = "form-locked-notice";
    notice.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Your data cannot be changed after a successful payment.';
    var formCard = document.querySelector(".form-card");
    if (formCard) {
      var header = formCard.querySelector(".form-header");
      if (header && header.nextSibling) {
        formCard.insertBefore(notice, header.nextSibling);
      } else {
        formCard.insertBefore(notice, formCard.firstChild);
      }
    }
  } else if (!anyPaid && existingNotice) {
    existingNotice.remove();
  }

  // Lock/unlock setiap q-block kecuali payment field itu sendiri
  var allBlocks = document.querySelectorAll(".q-block[data-qid]");
  allBlocks.forEach(function(block) {
    var qtype = block.dataset.qtype;
    // Payment block tidak dikunci (masih perlu ditampilkan info)
    if (qtype === "payment") return;
    if (anyPaid) {
      block.classList.add("form-field-locked");
    } else {
      block.classList.remove("form-field-locked");
    }
  });
}

// QRIS Modal

  modal.id = "qris-modal-" + paymentFieldId;
  var calcQ = (typeof questions !== "undefined") ? questions.find(function(q){ return q.type === "calculation"; }) : null;
  var fmtTotal = calcQ ? fmtCalc(total, calcQ) : ("Rp " + total.toLocaleString("id-ID"));
  modal.innerHTML = '<div class="qris-modal">' +
    '<div class="qris-modal-title">Scan QRIS to Pay</div>' +
    '<div class="qris-modal-amount">' + fmtTotal + '</div>' +
    '<div id="qris-static-warn-' + paymentFieldId + '" style="display:none;font-size:12px;color:#ef4444;font-weight:600;text-align:center;margin-top:4px"><strong>Transfer the exact amount shown above!<br>No less, no more.</strong></div>' +
    '<div id="qris-body-' + paymentFieldId + '">' +
      '<div style="color:var(--text-muted);font-size:13px;padding:20px 0">Loading QRIS...</div>' +
    '</div>' +
    '<div class="qris-countdown" id="qris-countdown-' + paymentFieldId + '"></div>' +
    '<div class="qris-checking" id="qris-checking-' + paymentFieldId + '" style="display:none"></div>' +
    '<button class="qris-confirm-btn" id="qris-confirm-' + paymentFieldId + '" disabled style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:not-allowed;background:var(--border);color:var(--text-muted)">Confirm Payment</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:4px">Available in <span id="qris-confirm-cd-' + paymentFieldId + '">20</span>s</div>' +
    '<div id="qris-report-' + paymentFieldId + '" style="display:none;text-align:center;margin-top:4px">' +
      '<a id="qris-report-link-' + paymentFieldId + '" href="#" style="font-size:12px;color:#ef4444;text-decoration:underline;cursor:pointer">Already paid but not detected?</a>' +
    '</div>' +

    '<button class="qris-close-btn" id="qris-close-' + paymentFieldId + '">Close</button>' +
  '</div>';
  document.body.appendChild(modal);

  // Fix: declare these from DOM after appending — previously they were undefined
  var _confirmBtn = document.getElementById("qris-confirm-" + paymentFieldId);
  var _reportLink = document.getElementById("qris-report-link-" + paymentFieldId);
  var _reportDiv  = document.getElementById("qris-report-" + paymentFieldId);
  var _failCount  = 0;

  document.getElementById("qris-close-" + paymentFieldId).addEventListener("click", function() {
    closeQrisModal(paymentFieldId);
  });

  function onFailedAttempt() {
    _failCount++;
    if (_failCount >= 3 && _reportDiv) _reportDiv.style.display = "block";

  if (_confirmBtn) {
    _confirmBtn.addEventListener("click", function() {
      _confirmBtn.disabled = true;
      _confirmBtn.style.background = "var(--border)";
      _confirmBtn.style.color = "var(--text-muted)";
      _confirmBtn.textContent = "Checking...";
      if (window._qrisPollNow) window._qrisPollNow(onFailedAttempt, _confirmBtn);
    });
  }

  if (_reportLink) {
    _reportLink.addEventListener("click", function(e) {
      e.preventDefault();
      var sessionData = typeof sb !== "undefined" ? sb.auth.getSession() : Promise.resolve({ data: { session: null } });
      sessionData.then(function(sd) {
        var userEmail = (sd && sd.data && sd.data.session && sd.data.session.user) ? sd.data.session.user.email : "";
        var now = new Date();

        var body = encodeURIComponent(
          "Email: " + userEmail + "\n" +
          "Total: " + fmtTotal + "\n" +
          "Time: " + timeStr + "\n" +
          "Message: "
        );
        window.location.href = "mailto:wateform@gmail.com?subject=" + subject + "&body=" + body;
      });
    });
  }

  generateFormPaymentQris(paymentFieldId, total, fmtTotal, _reportDiv, onFailedAttempt);
}

// ── Reopen QRIS modal menggunakan qris_data yang tersimpan (tanpa generate ulang) ──
function reopenQrisModal(paymentFieldId) {
  var state = paymentState[paymentFieldId];
  if (!state || !state.qrisData || !state.refNo || state.paid) return;

  // Jika modal sudah terbuka, jangan buka lagi
  if (document.getElementById("qris-modal-" + paymentFieldId)) return;

  var calcQ = (typeof questions !== "undefined") ? questions.find(function(q){ return q.type === "calculation"; }) : null;
  var fmtAmt = state.fmtTotal || (calcQ ? fmtCalc(state.amount, calcQ) : ("Rp " + state.amount.toLocaleString("id-ID")));

  var modal = document.createElement("div");
  modal.className = "qris-modal-backdrop";
  modal.id = "qris-modal-" + paymentFieldId;
  var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(state.qrisData);
  modal.innerHTML = '<div class="qris-modal">' +
    '<div class="qris-modal-title">Scan QRIS to Pay</div>' +
    '<div class="qris-modal-amount">' + fmtAmt + '</div>' +
    (state.isStatic ? '<div style="font-size:12px;color:#ef4444;font-weight:600;text-align:center;margin-top:4px"><strong>Transfer the exact amount shown above!<br>No less, no more.</strong></div>' : '') +
    '<div class="qris-img-wrap"><img src="' + qrUrl + '" alt="QRIS" width="220" height="220"></div>' +
    '<div class="qris-checking" style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px">Verifying payment in background...</div>' +
    '<button class="qris-confirm-btn" id="qris-reopen-confirm-' + paymentFieldId + '" style="width:100%;margin-top:8px;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:var(--teal,#2bbda4);color:#fff">Confirm Payment</button>' +

    '<button class="qris-close-btn" id="qris-reopen-close-' + paymentFieldId + '">Close</button>' +
  '</div>';
  document.body.appendChild(modal);

  // Close button — langsung tutup karena ini reopen, polling tetap berjalan di background
  document.getElementById("qris-reopen-close-" + paymentFieldId).addEventListener("click", function() {
    modal.remove();
    updatePaymentFields();
  });

  // Confirm button — pakai pollNow yang sudah ada
  document.getElementById("qris-reopen-confirm-" + paymentFieldId).addEventListener("click", function() {
    var btn = document.getElementById("qris-reopen-confirm-" + paymentFieldId);
    if (btn) { btn.disabled = true; btn.textContent = "Checking..."; btn.style.background = "var(--border)"; btn.style.color = "var(--text-muted)"; }
    if (window._qrisPollNow) {
      window._qrisPollNow(function() {}, btn);
    }
  });
}

function closeQrisModal(paymentFieldId) {
  var modal = document.getElementById("qris-modal-" + paymentFieldId);
  if (modal) modal.remove();

  // Only kill the poll timer if there is no pending transaction to track.
  // If the user closed the modal after scanning but before the server confirmed,
  // keep polling in the background so the submit button activates automatically.
  var state = paymentState[paymentFieldId];
  var hasPendingTransaction = state && state.refNo && !state.paid;
  if (!hasPendingTransaction) {
    if (window._qrisTimer) { clearInterval(window._qrisTimer); window._qrisTimer = null; }
  } else {
    // Record when background polling started so the card can show the
    // "Already paid but not detected?" link after 50 seconds.
    if (!state.bgPollSince) state.bgPollSince = Date.now();
    // Refresh the card UI to show "Verifying payment..." immediately.
    updatePaymentFields();
    // Schedule periodic card refreshes so the "already paid" link appears on time.
    if (!window._qrisBgUiInterval) {
      window._qrisBgUiInterval = setInterval(function() {
        updatePaymentFields();
      }, 5000);
    }
  }

  // Always stop the UI-only timers (countdown display, confirm-button countdown).
  if (window._qrisCountdown) { clearInterval(window._qrisCountdown); window._qrisCountdown = null; }
  if (window._qrisConfirmCdInterval) { clearInterval(window._qrisConfirmCdInterval); window._qrisConfirmCdInterval = null; }
}

async function generateFormPaymentQris(paymentFieldId, amount, fmtTotal, reportDiv, onFailedAttempt) {
  var bodyEl  = document.getElementById("qris-body-" + paymentFieldId);
  var countEl = document.getElementById("qris-countdown-" + paymentFieldId);
  var checkEl = document.getElementById("qris-checking-" + paymentFieldId);
  try {
    var sessionData = await sb.auth.getSession();
    var token = sessionData && sessionData.data && sessionData.data.session ? sessionData.data.session.access_token : null;
    var res = await fetch(SUPABASE_URL + "/functions/v1/create-form-payment-qris", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + (token || SUPABASE_ANON_KEY),
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        form_id:       (typeof form !== "undefined" ? form.id : null),
        form_owner_id: (typeof formOwnerId !== "undefined" ? formOwnerId : null),
        amount:        amount,
      }),
    });
    var data = await res.json();
    if (!data.ref_no || !data.qris_data) {
      if (bodyEl) bodyEl.innerHTML = '<div style="color:var(--red,#ef4444);font-size:13px;padding:16px 0">Failed to create QRIS: ' + (data.error || "Unknown error") + '</div>';
      return;
    }
    if (bodyEl) {
      var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(data.qris_data);
      bodyEl.innerHTML = '<div class="qris-img-wrap"><img src="' + qrUrl + '" alt="QRIS" width="220" height="220"></div>';
    }
    var _staticWarnEl = document.getElementById("qris-static-warn-" + paymentFieldId);
    if (_staticWarnEl) _staticWarnEl.style.display = data.is_static ? "block" : "none";

    // ── Mulai countdown confirm setelah QRIS berhasil di-generate ──────────
    var _confirmCdEl = document.getElementById("qris-confirm-cd-" + paymentFieldId);
    var _confirmBtn  = document.getElementById("qris-confirm-" + paymentFieldId);
    var _reportDiv   = document.getElementById("qris-report-" + paymentFieldId);
    var _cdElapsed = 0, _cdSec = 20, _reportSec = 50;
    var _qrisStartTime = Date.now();
    window._qrisStartTime = _qrisStartTime;
    var _cdInterval = setInterval(function() {
      _cdElapsed++;
      var left = Math.max(0, _cdSec - _cdElapsed);
      if (_cdElapsed >= _cdSec && _confirmBtn && _confirmBtn.disabled) {
        _confirmBtn.disabled = false;
        _confirmBtn.style.background = "var(--teal,#2bbda4)";
        _confirmBtn.style.color = "#fff";
        _confirmBtn.style.cursor = "pointer";
        if (_confirmCdEl) _confirmCdEl.parentElement.style.display = "none";
      } else {
        if (_confirmCdEl) _confirmCdEl.textContent = left;
      }
      if (_cdElapsed >= _reportSec && _reportDiv) {
        _reportDiv.style.display = "block";
      }
      if (_cdElapsed >= Math.max(_cdSec, _reportSec)) clearInterval(_cdInterval);
    }, 1000);
    window._qrisConfirmCdInterval = _cdInterval;
    var expiresIn = data.expires_in || 300;
    var endTime = Date.now() + expiresIn * 1000;
    if (window._qrisCountdown) clearInterval(window._qrisCountdown);
    window._qrisCountdown = setInterval(function() {
      var remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      var m = Math.floor(remaining / 60), s = remaining % 60;
      if (countEl) countEl.innerHTML = "Valid: <span>" + m + ":" + (s < 10 ? "0" : "") + s + "</span>";
      if (remaining <= 0) {
        clearInterval(window._qrisCountdown);
        if (countEl) countEl.textContent = "QRIS has expired.";
        if (checkEl) checkEl.textContent = "Time is up. Close and try again.";
        if (window._qrisTimer) clearInterval(window._qrisTimer);
      }
    }, 1000);
    var refNo = data.ref_no;

    // Fix 1: Persist the transaction reference immediately so that if the user
    // closes the modal before the server confirms, the background poll can still
    // resolve the payment and the card UI knows a transaction is in flight.
    paymentState[paymentFieldId] = paymentState[paymentFieldId] || {};
    paymentState[paymentFieldId].refNo    = refNo;
    paymentState[paymentFieldId].amount   = amount;
    paymentState[paymentFieldId].paid     = false;
    paymentState[paymentFieldId].isStatic = data.is_static || false;
    paymentState[paymentFieldId].qrisData = data.qris_data;
    paymentState[paymentFieldId].fmtTotal = fmtTotal;
    delete paymentState[paymentFieldId].bgPollSince; // reset if re-opening

    if (window._qrisTimer) clearInterval(window._qrisTimer);

    async function doPoll() {
      try {
        var checkRes = await fetch(SUPABASE_URL + "/functions/v1/check-form-payment-qris", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + (token || SUPABASE_ANON_KEY),
            "apikey": SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ ref_no: refNo }),
        });
        var checkData = await checkRes.json();
        if (checkData.status === "success") {
          clearInterval(window._qrisTimer);   window._qrisTimer = null;
          clearInterval(window._qrisCountdown); window._qrisCountdown = null;
          if (window._qrisBgUiInterval) { clearInterval(window._qrisBgUiInterval); window._qrisBgUiInterval = null; }
          paymentState[paymentFieldId] = { paid: true, refNo: refNo, amount: amount };
          closeQrisModal(paymentFieldId);
          updatePaymentFields();
        } else if (checkData.status === "expired") {
          clearInterval(window._qrisTimer);   window._qrisTimer = null;
          if (window._qrisBgUiInterval) { clearInterval(window._qrisBgUiInterval); window._qrisBgUiInterval = null; }
          // Reset pending state so the user can start a new QRIS
          if (paymentState[paymentFieldId]) {
            paymentState[paymentFieldId].refNo = null;
            paymentState[paymentFieldId].bgPollSince = null;
          }
          updatePaymentFields();
          if (checkEl) checkEl.textContent = "QRIS has expired. Close and try again.";
        } else {
          // Payment not found - only show report link / re-enable button if countdown already elapsed.
          var _elapsed = window._qrisStartTime ? (Date.now() - window._qrisStartTime) : Infinity;
          if (_elapsed >= 50000 && typeof onFailedAttempt === "function") onFailedAttempt();
          // Re-enable confirm button only after the 20s countdown has passed.
          // Skip when a manual check is in flight; its .finally() handles re-enable.
          if (_elapsed >= 20000 && !_manualCheckInFlight) {
            var _cb = document.getElementById("qris-confirm-" + paymentFieldId);
            // 4-7 second delay so the user sees the result before the button reactivates.
            var _jeda = 4000 + Math.random() * 3000;
            setTimeout(function() {
              // Only re-enable if no manual check is running and payment is still pending.
              if (_cb && !_manualCheckInFlight && !(paymentState[paymentFieldId] && paymentState[paymentFieldId].paid)) {
                _cb.disabled = false;
                _cb.style.background = "var(--teal,#2bbda4)";
                _cb.style.color = "#fff";
                _cb.style.cursor = "pointer";
                _cb.textContent = "Confirm Payment";
              }
            }, _jeda);
          }
        }
      } catch(pollErr) { /* ignore poll errors, keep trying */ }
    }

    // True while a manual "Confirm Payment" check is in flight.
    // The interval doPoll skips re-enabling the button while this is set.
    var _manualCheckInFlight = false;

    window._qrisPollNow = function(onFail, btn) {
      if (_manualCheckInFlight) return; // prevent double-trigger
      _manualCheckInFlight = true;

      // Pause the auto-poll interval for the duration of the manual check
      // so there is only ever one in-flight request at a time.
      if (window._qrisTimer) { clearInterval(window._qrisTimer); window._qrisTimer = null; }

      var _savedOnFail = typeof onFail === "function" ? onFail : onFailedAttempt;
      var _origOnFail = onFailedAttempt;
      onFailedAttempt = _savedOnFail;

      doPoll().finally(function() {
        onFailedAttempt = _origOnFail;
        _manualCheckInFlight = false;
        // If payment is still pending, re-enable the confirm button after
        // a 5-7 second delay so the user sees "Checking..." for a moment.
        var state = paymentState[paymentFieldId];
        if (state && state.refNo && !state.paid) {
          var _cb2 = document.getElementById("qris-confirm-" + paymentFieldId);
          var _checkEl2 = document.getElementById("qris-checking-" + paymentFieldId);
          var _jeda2 = 5000 + Math.random() * 2000;
          // Tampilkan status sementara di dalam modal
          if (_checkEl2) _checkEl2.textContent = "Payment not detected yet. Please wait\u2026";
          setTimeout(function() {
            if (_cb2 && !_manualCheckInFlight && !(paymentState[paymentFieldId] && paymentState[paymentFieldId].paid)) {
              _cb2.disabled = false;
              _cb2.style.background = "var(--teal,#2bbda4)";
              _cb2.style.color = "#fff";
              _cb2.style.cursor = "pointer";
              _cb2.textContent = "Confirm Payment";
            }
            // Reset status text
            if (_checkEl2 && !(paymentState[paymentFieldId] && paymentState[paymentFieldId].paid)) {
              _checkEl2.textContent = "";
            }
            // Toast muncul setelah checking selesai
            if (typeof showToast === "function") {
              showToast("Payment not detected yet. Please wait a moment and try again.", "error");
            }
          }, _jeda2);
          // Resume auto-poll interval.
          if (!window._qrisTimer) window._qrisTimer = setInterval(doPoll, 4000);
        }
      });
    };
    window._qrisTimer = setInterval(doPoll, 4000);
  } catch (e) {
    if (bodyEl) bodyEl.innerHTML = '<div style="color:var(--red,#ef4444);font-size:13px;padding:16px 0">Error: ' + e.message + '</div>';
  }
}


// ── Build WhatsApp / Telegram link ────────────────────────────
// NOTE: WhatsApp applies *bold*/_italic_ formatting to text sent via wa.me
// links. Telegram does NOT parse Markdown for text pre-filled via t.me
// deep links (that only works with the Bot API's parse_mode) — so for
// Telegram we send plain text without markdown syntax, otherwise the
// literal asterisks/underscores show up in the message.
function buildLink(settings, questions, answers, targetOverride, formTitle) {
  const target = targetOverride || settings.target || "wa";
  const isTg = target === "tg";
  const bold   = (s) => isTg ? s : `*${s}*`;
  const italic = (s) => isTg ? s : `_${s}_`;

  const lines = [];
  lines.push(bold(formTitle || "Form"));
  lines.push("");

  const line = (text) => lines.push(isTg ? text : `> ${text}`);

  questions.forEach(q => {
    if (["divider","spacer","button_link","title","image","video","page_break"].includes(q.type)) return;
    const ans = answers[q.id];
    if (ans === undefined || ans === null || ans === "") return;

    // Map: format as readable text
    if (q.type === "map" && typeof ans === "object") {
      const parts = [];
      if (ans.address) parts.push(ans.address);
      if (ans.lat != null && ans.lng != null) parts.push(`${Number(ans.lat).toFixed(6)}, ${Number(ans.lng).toFixed(6)}`);
      if (parts.length) line(`${q.title}: ${parts.join(", ")}`);
      return;
    }
    // File upload: format "Pertanyaan: namaFile,link" (ans = "namaFile||url")
    if (q.type === "file_upload" && typeof ans === "string" && ans.includes("||")) {
      const sep      = ans.indexOf("||");
      const fileName = ans.slice(0, sep);
      const fileUrl  = ans.slice(sep + 2);
      line(`${q.title}: ${fileName},${fileUrl}`);
      return;
    }
    // data_table: ans is already a pre-formatted string "Row1-Col1=val,Row2-Col2=val"
    // built by rebuildDtAnswer(). If somehow it's still a 2-D array, reconstruct it.
    if (q.type === "data_table") {
      if (typeof ans === "string" && ans) {
        line(`${q.title}: ${ans}`);
      } else if (Array.isArray(ans)) {
        const rows = q.tableRows    || [];
        const cols = q.tableColumns || [];
        const parts = [];
        rows.forEach((r, ri) => {
          cols.forEach((c, ci) => {
            const cell = ans[ri]?.[ci];
            if (cell) parts.push(`${r}-${c}=${cell}`);
          });
        });
        if (parts.length) line(`${q.title}: ${parts.join(",")}`);
      }
      return;
    }
    line(`${q.title}: ${ans}`);
  });

  lines.push("");
  lines.push(italic("Created by wateform.my.id"));

  const body = lines.join("\n");

  if (target === "tg" || target === "tg2") {
    const user = settings.tgUsername || "";
    return `https://t.me/${user}?text=${encodeURIComponent(body)}`;
  } else if (target === "tg2-2") {
    const user = settings.tgUsername2 || "";
    return `https://t.me/${user}?text=${encodeURIComponent(body)}`;
  } else if (target === "wa2-2") {
    const number = (settings.waPrefix2 || "+62").replace("+","") + (settings.waNumber2 || "").replace(/\D/g,"");
    return `https://wa.me/${number}?text=${encodeURIComponent(body)}`;
  } else {
    const number = (settings.waPrefix || "+62").replace("+","") + (settings.waNumber || "").replace(/\D/g,"");
    return `https://wa.me/${number}?text=${encodeURIComponent(body)}`;
  }
}

// ── Schedule state screen ────────────────────────────────────
let _countdownInterval = null;

function showScheduled(state, openTime, closeTime, closedMessage) {
  const fmt = dt => dt ? dt.toLocaleString(undefined, { weekday:"short", year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : null;
  root.className = "state-screen";

  if (state === "not-open") {
    // Build countdown display
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--teal);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <h2>Form not open yet</h2>
        <p style="margin-bottom:20px">Form akan dibuka pada<br><strong>${fmt(openTime)}</strong></p>
        <div id="countdown-wrap" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
          <div class="cd-unit"><div class="cd-val" id="cd-d">--</div><div class="cd-lbl">Hari</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-h">--</div><div class="cd-lbl">Jam</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-m">--</div><div class="cd-lbl">Menit</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-s">--</div><div class="cd-lbl">Detik</div></div>
        </div>
        ${closeTime ? `<p style="font-size:13px;color:var(--text-muted)">Dan akan ditutup pada <strong>${fmt(closeTime)}</strong></p>` : ""}
      </div>`;

    // Start live countdown
    if (_countdownInterval) clearInterval(_countdownInterval);
    function tick() {
      const diff = openTime - new Date();
      if (diff <= 0) { clearInterval(_countdownInterval); location.reload(); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const pad = n => String(n).padStart(2,"0");
      const el = id => document.getElementById(id);
      if (el("cd-d")) el("cd-d").textContent = pad(d);
      if (el("cd-h")) el("cd-h").textContent = pad(h);
      if (el("cd-m")) el("cd-m").textContent = pad(m);
      if (el("cd-s")) el("cd-s").textContent = pad(s);
    }
    tick();
    _countdownInterval = setInterval(tick, 1000);

  } else {
    // Closed state — show custom message if set
    const msg = closedMessage || "This form is no longer accepting responses.";
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
        </svg>
        <h2 style="color:var(--text-muted)">Form ditutup</h2>
        <p>${esc(msg)}</p>
        ${closeTime ? `<p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Ditutup pada ${fmt(closeTime)}</p>` : ""}
      </div>`;
  }
}

// ── Generate short code for file viewer links ─────────────────
function genShortCode(len = 8) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => chars[b % chars.length]).join("");
}

// ── Render form ───────────────────────────────────────────────
function renderForm(form) {
  const questions = Array.isArray(form.questions) ? form.questions : [];
  window.questions = questions; // expose globally for updateCalcFields()
  const settings  = form.settings || {};
  const answers   = {};
  window.answers = answers;     // expose globally for updateCalcFields()
  const fileMap   = {};   // qId → File object (for Supabase Storage upload)
  const starState = {};

  document.title = `${form.title} — WateForm`;

  root.className = "";
  root.innerHTML = "";
  root.classList.add("form-wrap");

  const card = document.createElement("div");
  card.className = "form-card";

  // Header
  card.innerHTML = `
    <div class="form-header">
      <h1 class="form-title">${esc(form.title)}</h1>
      ${form.description ? `<p class="form-desc">${esc(form.description)}</p>` : ""}
    </div>`;

  // Questions
  questions.forEach(q => {
    // Page break: insert a sentinel marker div (hidden) to let pagination logic split by page
    if (q.type === "page_break") {
      const pb = document.createElement("div");
      pb.className = "q-page-break-marker";
      pb.style.display = "none";
      card.appendChild(pb);
      return;
    }

    const block = document.createElement("div");
    block.className = "q-block";
    block.dataset.qid  = q.id;
    block.dataset.qtype = q.type;
    const req = q.required ? `<span class="req">*</span>` : "";

    // Title type: render as heading
    if (q.type === "title") {
      const titleBlock = document.createElement("div");
      titleBlock.className = "q-block";
      titleBlock.innerHTML = `
        <div style="padding:4px 0 2px">
          <div style="font-size:18px;font-weight:800;color:var(--text);line-height:1.25">${esc(q.title)}</div>
          ${q.subtitle ? `<div style="font-size:13.5px;color:var(--text-soft);margin-top:4px;line-height:1.55">${q.subtitle}</div>` : ""}
        </div>`;
      card.appendChild(titleBlock);
      return;
    }

    // Image type
    if (q.type === "image") {
      const imgBlock = document.createElement("div");
      imgBlock.className = "q-block";
      const imgSrc = q.mediaUrl || q.imageUploadUrl || "";
      imgBlock.innerHTML = imgSrc
        ? `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
           ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
           <img src="${esc(imgSrc)}" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;display:block">`
        : `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
           <div style="background:var(--bg-mid);border:1px dashed var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text-muted);font-size:13px">No image set</div>`;
      card.appendChild(imgBlock);
      return;
    }

    // Video type
    if (q.type === "video") {
      const vidBlock = document.createElement("div");
      vidBlock.className = "q-block";
      const vidSrc = q.mediaUrl || q.imageUploadUrl || "";
      if (vidSrc) {
        const ytMatch = vidSrc.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
        const embedSrc = ytMatch ? "https://www.youtube.com/embed/" + ytMatch[1] : null;
        vidBlock.innerHTML = `
          ${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
          ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
          ${embedSrc
            ? `<div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden"><iframe src="${esc(embedSrc)}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>`
            : `<video src="${esc(vidSrc)}" controls style="width:100%;border-radius:10px;display:block"></video>`}`;
      } else {
        vidBlock.innerHTML = `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}<div style="background:var(--bg-mid);border:1px dashed var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text-muted);font-size:13px">No video set</div>`;
      }
      card.appendChild(vidBlock);
      return;
    }

    // Divider type
    if (q.type === "divider") {
      const dBlock = document.createElement("div");
      dBlock.className = "q-block";
      dBlock.style.cssText = "padding:4px 0";
      const ds = q.dividerStyle || "solid";
      dBlock.innerHTML = `<hr style="border:none;border-top:2px ${ds} var(--border);margin:0">`;
      card.appendChild(dBlock);
      return;
    }

    // Spacer type
    if (q.type === "spacer") {
      const sBlock = document.createElement("div");
      sBlock.className = "q-block";
      sBlock.style.cssText = `padding:0;height:${q.spacerHeight||32}px;min-height:${q.spacerHeight||32}px;background:transparent;box-shadow:none;border:none`;
      card.appendChild(sBlock);
      return;
    }

    // Button (link) type
    if (q.type === "button_link") {
      const bBlock = document.createElement("div");
      bBlock.className = "q-block";
      const bStyle = q.buttonStyle || "primary";
      const bLabel = esc(q.buttonLabel || "Open link");
      const bAlign = q.buttonAlign || "left";
      const alignMap = {left:"flex-start",center:"center",right:"flex-end"};
      let btnCss = "padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:opacity .15s;";
      if (bStyle === "primary")  btnCss += "background:var(--teal);color:#fff;border:2px solid var(--teal)";
      if (bStyle === "outline")  btnCss += "background:transparent;color:var(--teal);border:2px solid var(--teal)";
      if (bStyle === "ghost")    btnCss += "background:transparent;color:var(--teal);border:2px solid transparent";
      bBlock.innerHTML = `
        ${q.title ? `<div class="q-label" style="margin-bottom:8px">${esc(q.title)}</div>` : ""}
        ${q.subtitle ? `<div class="q-subtitle" style="margin-bottom:8px">${q.subtitle}</div>` : ""}
        <div style="display:flex;justify-content:${alignMap[bAlign]||"flex-start"}">
          <a href="${esc(q.buttonUrl||"#")}" target="_blank" rel="noopener noreferrer" style="${btnCss}"
             onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
            ${bLabel}
            <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' width='13' height='13'>
              <path d='M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6'/>
              <polyline points='15 3 21 3 21 9'/><line x1='10' y1='14' x2='21' y2='3'/>
            </svg>
          </a>
        </div>`;
      card.appendChild(bBlock);
      return;
    }

    // Map / Location type
    if (q.type === "map") {
      const mBlock = document.createElement("div");
      mBlock.className = "q-block";
      const mapId = "map-" + q.id;
      const mapData = { lat: q.mapLat, lng: q.mapLng };
      mBlock.innerHTML = `
        <div class="q-label">${esc(q.title)}${req}</div>
        ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
        <div id="${mapId}" style="height:220px;border-radius:10px;border:1px solid var(--border);overflow:hidden;position:relative;background:#e8f4f0;margin-bottom:8px">
          <div id="${mapId}-inner" style="width:100%;height:100%"></div>
          ${q.mapAllowGps !== false ? `
          <button type="button" id="${mapId}-gps"
            style="position:absolute;bottom:10px;right:10px;z-index:1000;background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--teal);box-shadow:0 2px 6px rgba(0,0,0,.1)">
            <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' width='14' height='14'><circle cx='12' cy='12' r='3'/><path d='M12 1v4M12 19v4M1 12h4M19 12h4'/></svg>
            Use my location
          </button>` : ""}
        </div>
        ${q.mapShowAddress !== false ? `
        <input type="text" id="${mapId}-addr" placeholder="Address…"
          style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:4px">` : ""}
        <div style="font-size:11px;color:var(--text-muted)" id="${mapId}-coords"></div>
        <div class="q-err" style="font-size:12px;color:var(--red);display:none">Please pick a location on the map.</div>`;
      card.appendChild(mBlock);

      // Init Leaflet map after DOM is ready
      setTimeout(() => {
        if (typeof L === "undefined") return;
        const defaultLat = q.mapLat || -6.2088;
        const defaultLng = q.mapLng || 106.8456;
        const zoom = q.mapZoom || 13;
        const map = L.map(mapId + "-inner").setView([defaultLat, defaultLng], zoom);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19,
        }).addTo(map);

        let marker = null;
        function setPin(lat, lng) {
          if (marker) map.removeLayer(marker);
          marker = L.marker([lat, lng]).addTo(map);
          answers[q.id] = { lat, lng, address: document.getElementById(mapId + "-addr")?.value || "" };
          const coordsEl = document.getElementById(mapId + "-coords");
          if (coordsEl) coordsEl.textContent = `(pin) ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }

        map.on("click", e => {
          setPin(e.latlng.lat, e.latlng.lng);
          // Reverse geocode
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`)
            .then(r => r.json()).then(d => {
              const addr = d.display_name || "";
              const addrEl = document.getElementById(mapId + "-addr");
              if (addrEl) addrEl.value = addr;
              if (answers[q.id]) answers[q.id].address = addr;
            }).catch(() => {});
        });

        const addrEl = document.getElementById(mapId + "-addr");
        if (addrEl) {
          addrEl.addEventListener("change", () => {
