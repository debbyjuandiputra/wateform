<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WateForm</title>
<script>
// GitHub Pages serves this file for any path that doesn't exist.
// Handles two URL shapes:
//   /{ws_short}/{form_short}  →  form.html?ws=X&f=Y      (auto-generated links)
//   /{custom_slug}            →  form.html?slug=X         (custom single-segment links)

(function() {
  var path  = window.location.pathname;
  var parts = path.replace(/^\//, "").split("/").filter(Boolean);

  // Compute the root path (handles GitHub Pages subdirectory deployments)
  // For a custom domain at root, rootPath = "/"
  // For github.io/repo/... the repo segment is stripped automatically by GH Pages 404 routing

  var rootPath = "/";

  // ── Storage viewer: /storage/{code} ───────────────────────
  if (parts.length >= 2 && parts[parts.length - 2] === "storage") {
    var fileCode = parts[parts.length - 1];
    if (/^[A-Za-z0-9]{6,16}$/.test(fileCode)) {
      rootPath = "/" + parts.slice(0, parts.length - 2).join("/");
      if (rootPath !== "/") rootPath += "/";
      window.location.replace(rootPath + "storage.html?code=" + encodeURIComponent(fileCode));
      return;
    }
  }

  // ── Two-segment: /{ws_short}/{form_short} ──────────────────
  // Both segments are 4-12 alphanumeric chars (auto-generated short_ids look like "AbCd12")
  var wsShort, formShort;
  for (var i = parts.length - 1; i >= 1; i--) {
    if (/^[A-Za-z0-9]{4,12}$/.test(parts[i]) && /^[A-Za-z0-9]{4,12}$/.test(parts[i-1])) {
      wsShort   = parts[i-1];
      formShort = parts[i];
      // Recalculate rootPath: strip the two matched segments
      rootPath  = "/" + parts.slice(0, i - 1).join("/");
      if (rootPath !== "/") rootPath += "/";
      break;
    }
  }

  if (wsShort && formShort) {
    window.location.replace(
      rootPath + "form.html?ws=" + encodeURIComponent(wsShort) + "&f=" + encodeURIComponent(formShort)
    );
    return;
  }

  // ── Single-segment: /{custom_slug} ────────────────────────
  // A single segment that is 4–40 chars (URL-safe: letters, digits, hyphens, underscores)
  var lastPart = parts[parts.length - 1] || "";
  if (parts.length >= 1 && /^[A-Za-z0-9_-]{4,40}$/.test(lastPart)) {
    // Could be a custom slug — pass to form.html which will query the DB
    rootPath = "/" + parts.slice(0, parts.length - 1).join("/");
    if (rootPath !== "/") rootPath += "/";
    window.location.replace(
      rootPath + "form.html?slug=" + encodeURIComponent(lastPart)
    );
    return;
  }

  // ── Not a form URL — proper 404 ───────────────────────────
  document.title = "Page not found — WateForm";
  document.body.innerHTML =
    '<div style="font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;text-align:center;padding:24px">'
    + '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7A9490" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
    + '<h1 style="font-size:20px;font-weight:800;margin:0">Page not found</h1>'
    + '<p style="color:#7A9490;margin:0">The link you followed doesn\'t exist.</p>'
    + '<a href="/" style="color:#2BBDA4;font-weight:600;margin-top:8px">Go to WateForm</a>'
    + '</div>';
})();
</script>
</head>
<body></body>
</html>
