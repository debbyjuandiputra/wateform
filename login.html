<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Log in — WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="auth-page">

  <!-- Top bar -->
  <div class="auth-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.webp" alt="WateForm" style="height:28px">
      <span class="brand-word" translate="no"><span class="w1">Wate</span><span class="w2">Form</span></span>
    </a>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </div>

  <!-- Auth card -->
  <div class="auth-main">
    <div class="auth-card">

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" translate="yes">Log in</button>
        <button class="auth-tab" data-tab="register">Create account</button>
      </div>

      <!-- ── LOGIN ────────────────────────────────── -->
      <div data-panel="login">
        <h1>Welcome back</h1>
        <p class="sub"></p>

        <div id="login-general-error" class="error-banner"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-solid auth-submit">Log in</button>
        </form>

        <p class="auth-foot">
          No account?
          <a href="#register" onclick="document.querySelector('[data-tab=register]').click();return false;">Create one</a>
        </p>
      </div>

      <!-- ── REGISTER ──────────────────────────────── -->
      <div data-panel="register" style="display:none">
        <h1>Create your account</h1>
        <p class="sub"></p>

        <div id="register-general-error" class="error-banner"></div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="field">
            <label for="reg-fullname">Full name</label>
            <input type="text" id="reg-fullname" autocomplete="name">
            <div class="error-text"></div>
          </div>
          <div class="field">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" autocomplete="username">
            <!-- <div class="hint">Teammates use this to invite you to a workspace.</div> -->
            <div class="error-text"></div>
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" autocomplete="email">
            <div class="error-text">Please use a @gmail.com address.</div>
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="reg-password-confirm">Confirm password</label>
            <input type="password" id="reg-password-confirm" placeholder="Repeat password" autocomplete="new-password">
            <div class="error-text">Passwords don't match.</div>
          </div>
          <button type="submit" class="btn btn-solid auth-submit">Create account</button>
        </form>

        <p class="auth-foot">
          Already have an account?
          <a href="#login" onclick="document.querySelector('[data-tab=login]').click();return false;">Log in</a>
        </p>
      </div>

    </div>
  </div>
</div>

<script src="assets/auth.js"></script>
</body>
</html>
