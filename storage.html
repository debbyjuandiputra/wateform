<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>File Viewer — WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
}

.viewer-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 48px 20px 80px;
}

.viewer-card {
  width: 100%; max-width: 600px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow);
}

.viewer-header {
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border-soft);
}

.viewer-file-icon {
  width: 48px; height: 48px; border-radius: var(--radius);
  background: var(--teal-dim); display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.viewer-file-icon svg { width: 24px; height: 24px; color: var(--teal); }

.viewer-filename {
  font-size: 18px; font-weight: 700; color: var(--text);
  word-break: break-all; margin: 0 0 8px;
}

.viewer-meta {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-muted);
}

.viewer-meta-item {
  display: flex; align-items: center; gap: 5px;
}

.viewer-preview {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; justify-content: center; align-items: center;
  min-height: 120px; background: var(--bg-mid);
}

.viewer-preview img {
  max-width: 100%; max-height: 400px;
  border-radius: var(--radius); object-fit: contain;
}

.viewer-preview video {
  max-width: 100%; max-height: 360px;
  border-radius: var(--radius);
}

.viewer-preview audio {
  width: 100%;
}

.viewer-preview .no-preview {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; color: var(--text-muted); font-size: 13px;
}

.viewer-actions {
  padding: 20px 28px;
  display: flex; gap: 10px; align-items: center;
}

.loading-wrap, .error-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  padding: 60px 24px; text-align: center;
}

.loading-wrap svg { animation: spin 1s linear infinite; color: var(--teal); }
@keyframes spin { to { transform: rotate(360deg); } }

.error-icon { color: var(--text-muted); }
.error-title { font-size: 18px; font-weight: 700; margin: 0; }
.error-desc  { color: var(--text-muted); margin: 0; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font-size: 11px; font-weight: 600; background: var(--teal-dim);
  color: var(--teal); text-transform: uppercase; letter-spacing: .04em;
}

.wateform-credit {
  margin-top: 28px; font-size: 12px; color: var(--text-muted); text-align: center;
}
.wateform-credit a { color: var(--teal); }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="https://wateform.my.id">
    <img src="assets/logo.webp" alt="WateForm">
    <span class="brand-word"><span class="w1">Wate</span><span class="w2">Form</span></span>
  </a>
</div>

<div class="viewer-wrap">
  <div class="viewer-card" id="viewer-card">
    <!-- Loading state -->
    <div class="loading-wrap" id="state-loading">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span style="color:var(--text-muted);font-size:14px">Loading file…</span>
    </div>
    <!-- Error state -->
    <div class="loading-wrap" id="state-error" style="display:none">
      <svg class="error-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <h2 class="error-title">File not found</h2>
      <p class="error-desc" id="error-msg">This link may be invalid or the file has been deleted.</p>
    </div>
    <!-- Content state (hidden until loaded) -->
    <div id="state-content" style="display:none">
      <div class="viewer-header">
        <div class="viewer-file-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="file-icon-svg">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <h1 class="viewer-filename" id="file-name">filename.ext</h1>
        <div class="viewer-meta">
          <span class="viewer-meta-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span id="file-size">—</span>
          </span>
          <span class="viewer-meta-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="file-date">—</span>
          </span>
          <span class="badge" id="file-type-badge">file</span>
        </div>
      </div>
      <div class="viewer-preview" id="viewer-preview"></div>
      <div class="viewer-actions">
        <a id="download-btn" class="btn btn-solid" href="#" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Download File
        </a>
        <button class="btn btn-ghost" id="copy-btn" onclick="copyLink()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy Link
        </button>
      </div>
    </div>
  </div>

  <p class="wateform-credit" style="font-style: bold;">
    Shared via <a style="color: #2bbda4; text-decoration: underline;" href="https://wateform.my.id" target="_blank">WateForm</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = "https://zaaqlfxtymuafalkeftd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphYXFsZnh0eW11YWZhbGtlZnRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg2NjMsImV4cCI6MjEwMTQ1NDY2M30.NKBBX7Qcb4T22tvAjjAzh4Scmbt-bJN1kb1ADBr6Bro";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return "0 B";
  if (bytes < 1024)         return bytes + " B";
  if (bytes < 1024 ** 2)    return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 ** 3)    return (bytes / 1024 ** 2).toFixed(2) + " MB";
  return (bytes / 1024 ** 3).toFixed(2) + " GB";
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
}

function getShortCode() {
  // URL shape: /storage/CODE or storage.html?code=CODE
  const params = new URLSearchParams(window.location.search);
  if (params.get("code")) return params.get("code");
  // Routed via 404.html: /storage/CODE → storage.html?code=CODE
  return null;
}

function showError(msg) {
  document.getElementById("state-loading").style.display = "none";
  document.getElementById("state-error").style.display   = "";
  if (msg) document.getElementById("error-msg").textContent = msg;
}

function renderPreview(mimeType, publicUrl, fileName) {
  const preview = document.getElementById("viewer-preview");
  if (!mimeType) { preview.style.display = "none"; return; }

  if (mimeType.startsWith("image/")) {
    const img = document.createElement("img");
    img.src = publicUrl; img.alt = fileName;
    preview.appendChild(img);
  } else if (mimeType.startsWith("video/")) {
    const vid = document.createElement("video");
    vid.src = publicUrl; vid.controls = true; vid.preload = "metadata";
    vid.className = ""; preview.appendChild(vid);
  } else if (mimeType.startsWith("audio/")) {
    const aud = document.createElement("audio");
    aud.src = publicUrl; aud.controls = true;
    preview.appendChild(aud);
  } else if (mimeType === "application/pdf") {
    const wrap = document.createElement("div");
    wrap.className = "no-preview";
    wrap.innerHTML = `
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
      </svg>
      <span>PDF — open or download to view</span>`;
    preview.appendChild(wrap);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "no-preview";
    wrap.innerHTML = `
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span>No preview available — download to open</span>`;
    preview.appendChild(wrap);
    preview.style.minHeight = "100px";
  }
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById("copy-btn");
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    btn.style.color = "var(--teal)";
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ""; }, 2000);
  });
}

(async function() {
  const code = getShortCode();
  if (!code) { showError("No file code found in the URL."); return; }

  const { data, error } = await sb
    .from("form_uploads")
    .select("file_name, file_path, file_size, mime_type, created_at")
    .eq("short_code", code)
    .maybeSingle();

  if (error || !data) {
    showError("File not found. The link may be invalid or the file has been deleted.");
    return;
  }

  const { data: { publicUrl } } = sb.storage
    .from("response-uploads")
    .getPublicUrl(data.file_path);

  // Update page title
  document.title = data.file_name + " — WateForm";

  // Populate UI
  document.getElementById("file-name").textContent        = data.file_name;
  document.getElementById("file-size").textContent        = formatBytes(data.file_size);
  document.getElementById("file-date").textContent        = formatDate(data.created_at);
  document.getElementById("file-type-badge").textContent  = data.mime_type
    ? data.mime_type.split("/")[1]?.toUpperCase() || data.mime_type
    : "FILE";

  // Download button
  const dlBtn = document.getElementById("download-btn");
  dlBtn.href     = publicUrl;
  dlBtn.download = data.file_name;

  // Preview
  renderPreview(data.mime_type, publicUrl, data.file_name);

  // Show content
  document.getElementById("state-loading").style.display  = "none";
  document.getElementById("state-content").style.display  = "";
})();
</script>
</body>
</html>
