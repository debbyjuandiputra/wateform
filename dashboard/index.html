<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Dashboard — WateForm</title>
<link rel="icon" href="../assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="../assets/style.css">
</head>

<body>
<div class="app-shell" id="app"> 

  <!-- Top bar -->
  <header class="app-topbar">
    <a href="./" class="brand topbar-brand">
      <img src="../assets/logo.webp" alt="WateForm">
      <span class="brand-word" translate="no"><span class="w1">Wate</span><span class="w2">Form</span></span>
    </a>
    <div class="topbar-sep"></div>
    <span class="topbar-title" id="topbar-ws-name">Dashboard</span>
    <div class="topbar-right">
      <!-- Wallet button — hanya di dashboard -->
      <button class="topbar-wallet" id="wallet-btn" title="My wallet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" flex-shrink="0"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h2"/><circle cx="17" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        <span id="wallet-balance-label">IDR 0</span>
      </button>
      <div class="dropdown">
        <button class="topbar-user" id="user-btn">
          <div class="avatar-wrap" id="user-avatar-wrap" style="width:36px;height:36px;flex-shrink:0">
            <div class="avatar" id="user-avatar" style="width:36px;height:36px;font-size:13px">?</div>
            <div class="avatar-frame-ring" id="user-avatar-frame"></div>
          </div>
          <div>
            <div class="name" id="user-name">…</div>
            <div class="username" id="user-handle">@…</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown-menu" id="user-menu">
          <a href="./profile.html" class="dropdown-item" id="view-profile-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            View profile
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="logout-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Log out
          </button>
        </div>
      </div>
      <!-- Hamburger menu — far right -->
      <div class="dropdown ham-wrap">
        <button class="ham-btn" id="ham-btn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu ham-menu" id="ham-menu">
          <button class="dropdown-item" id="ham-subscription">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Subscription
          </button>
          <button class="dropdown-item" id="ham-leaderboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></svg>
            Leaderboard
          </button>
          <button class="dropdown-item" id="ham-notification">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Notification
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="ham-theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span id="ham-theme-label">Dark mode</span>
          </button>
          <a class="dropdown-item" id="ham-support" href="mailto:wateform@gmail.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Support
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="ham-storage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4.03 3-9 3S3 13.66 3 12"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></svg>
            Storage
            <span id="ham-storage-label" style="margin-left:auto;color:var(--text-muted);font-size:12px">—</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="app-body">



    <!-- Main -->
    <main class="app-main" id="main-content">
      <!-- Injected by JS -->
    </main>
  </div>
</div>

<!-- ── Modals ─────────────────────────────────────────────── -->

<!-- Create / Edit Workspace -->
<div class="modal-backdrop" id="ws-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="ws-modal-title">New workspace</h3>
      <button class="modal-close" data-close="ws-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="ws-modal-error" class="error-banner"></div>
      <div class="field">
        <label for="ws-name">Workspace name <span style="color:var(--red)">*</span></label>
        <input type="text" id="ws-name" maxlength="80">
        <div class="error-text"></div>
      </div>
      <div class="field">
        <label for="ws-desc">Description <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
        <textarea id="ws-desc" rows="2" maxlength="300"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" data-close="ws-modal">Cancel</button>
      <button class="btn btn-solid btn-sm" id="ws-save-btn">Create workspace</button>
    </div>
  </div>
</div>

<!-- Invite member -->
<div class="modal-backdrop" id="invite-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add member</h3>
      <button class="modal-close" data-close="invite-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="invite-error" class="error-banner"></div>
      <div class="field">
        <label for="invite-email">Email address</label>
        <input type="email" id="invite-email" autocomplete="off">
        <!-- <div class="hint">Enter the Gmail address (@gmail.com) of the person you want to add.</div> -->
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" data-close="invite-modal">Cancel</button>
      <button class="btn btn-solid btn-sm" id="invite-save-btn">Add member</button>
    </div>
  </div>
</div>

<!-- Create form -->
<div class="modal-backdrop" id="form-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>New form</h3>
      <button class="modal-close" data-close="form-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="form-modal-error" class="error-banner"></div>
      <div class="field">
        <label for="form-title">Form title <span style="color:var(--red)">*</span></label>
        <input type="text" id="form-title"x maxlength="120">
        <div class="error-text"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" data-close="form-modal">Cancel</button>
      <button class="btn btn-solid btn-sm" id="form-save-btn">Create form</button>
    </div>
  </div>
</div>

<!-- Rename form -->
<div class="modal-backdrop" id="rename-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Rename form</h3>
      <button class="modal-close" data-close="rename-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="rename-input">New name</label>
        <input type="text" id="rename-input" maxlength="120">
        <div class="error-text"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" data-close="rename-modal">Cancel</button>
      <button class="btn btn-solid btn-sm" id="rename-save-btn">Rename</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <h3 id="confirm-title">Delete?</h3>
      <button class="modal-close" data-close="confirm-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <p id="confirm-body" style="margin:0 0 8px;font-size:13.5px;color:var(--text-soft)"></p>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" data-close="confirm-modal">Cancel</button>
      <button class="btn btn-danger btn-sm" id="confirm-ok-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Share form -->
<div class="modal-backdrop" id="share-modal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3>Share form</h3>
      <button class="modal-close" data-close="share-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Public link</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="share-link" readonly style="flex:1;background:var(--bg-mid)">
          <button class="btn btn-ghost btn-sm" id="share-copy-btn">Copy</button>
        </div>
      </div>
      <div class="field">
        <label>Embed code</label>
        <textarea id="share-embed" readonly rows="3" style="background:var(--bg-mid);font-family:monospace;font-size:12px"></textarea>
        <button class="btn btn-ghost btn-sm" id="embed-copy-btn" style="align-self:flex-start;margin-top:4px">Copy embed</button>
      </div>
    </div>
  </div>
</div>


<!-- Wallet -->
<div class="modal-backdrop" id="wallet-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>Wallet</h3>
      <button class="modal-close" data-close="wallet-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal-body" style="gap:20px">

      <!-- Saldo -->
      <div style="background:var(--bg-mid);border-radius:var(--radius-md);padding:18px 20px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em">Balance</div>
          <div id="wallet-modal-balance" style="font-size:24px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace">IDR 0</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32" style="color:var(--teal);opacity:.6"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h2"/><circle cx="17" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
      </div>

      <!-- Info bank -->
      <div>
        <div id="wallet-pending-banner" style="display:none;margin-bottom:12px"></div>
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px">Bank account</div>
        <div id="wallet-modal-error" class="error-banner"></div>
        <div class="field">
          <label for="wallet-bank">Bank <span style="color:var(--red)">*</span></label>
          <select id="wallet-bank" style="width:100%;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13px">
            <option value="">— Select bank —</option>
            <option value="bca">BCA — Bank Central Asia</option>
            <option value="mandiri">Mandiri</option>
            <option value="bni">BNI — Bank Negara Indonesia</option>
            <option value="bri">BRI — Bank Rakyat Indonesia</option>
            <option value="cimb">CIMB Niaga</option>
            <option value="danamon">Danamon</option>
            <option value="permata">Permata</option>
            <option value="panin">Panin</option>
            <option value="maybank">Maybank Indonesia</option>
            <option value="ocbc">OCBC NISP</option>
            <option value="btn">BTN — Bank Tabungan Negara</option>
            <option value="bsi">BSI — Bank Syariah Indonesia</option>
            <option value="muamalat">Muamalat</option>
            <option value="bukopin">Bukopin</option>
            <option value="mega">Mega</option>
            <option value="sinarmas">Sinarmas</option>
            <option value="jenius">Jenius (BTPN)</option>
            <option value="jago">Jago</option>
            <option value="neo">Neo Commerce</option>
            <option value="blu">blu by BCA Digital</option>
            <option value="seabank">SeaBank</option>
            <option value="allo">Allo Bank</option>
            <option value="line">LINE Bank</option>
            <option value="dana">DANA</option>
            <option value="gopay">GoPay (Bank Jago)</option>
            <option value="ovo">OVO (withdraw to bank)</option>
            <option value="shopeepay">ShopeePay</option>
            <option value="linkaja">LinkAja</option>
          </select>
        </div>
        <div class="field">
          <label for="wallet-account-number">Account number <span style="color:var(--red)">*</span></label>
          <input type="text" id="wallet-account-number" placeholder="e.g. 1234567890" maxlength="30" inputmode="numeric">
        </div>
        <div class="field">
          <label for="wallet-account-name">Account holder name <span style="color:var(--red)">*</span></label>
          <input type="text" id="wallet-account-name" placeholder="As shown on your bank account" maxlength="80">
        </div>
        <div class="field" id="wallet-password-field" style="margin-top:4px">
          <label for="wallet-password">Confirm password <span style="color:var(--red)">*</span></label>
          <div style="position:relative">
            <input type="password" id="wallet-password" placeholder="Enter your account password" maxlength="128" autocomplete="current-password">
            <button type="button" id="wallet-password-toggle"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;display:flex;align-items:center">
              <svg id="wpt-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="wpt-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div id="wallet-password-error" style="font-size:12px;color:var(--red);margin-top:4px;display:none"></div>
        </div>
      </div>

    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <button class="btn btn-solid btn-sm" id="wallet-save-bank-btn">Save account</button>
      <button class="btn btn-sm" id="wallet-withdraw-btn"
        style="display:flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;opacity:.4;cursor:not-allowed"
        disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Withdraw
      </button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/dashboard.js"></script>
</body>
</html>
