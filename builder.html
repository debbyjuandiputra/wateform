<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Form Builder — WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell" id="app">

  <!-- Top bar -->
  <header class="app-topbar">
    <a href="dashboard.html" class="brand topbar-brand">
      <img src="assets/logo.webp" alt="">
      <span class="brand-word" translate="no"><span class="w1">Wate</span><span class="w2">Form</span></span>
    </a>
    <div class="topbar-sep"></div>

    <!-- Builder toolbar -->
    <div style="display:flex;align-items:center;gap:10px;flex:1">
      <span class="builder-toolbar-title" id="topbar-form-title">Untitled Form</span>
      <span id="save-indicator" style="font-size:12px;color:var(--text-muted)"></span>
    </div>

    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" id="preview-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
      <button class="btn btn-ghost btn-sm" id="settings-toggle-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </button>
      <button class="btn btn-solid btn-sm" id="publish-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Publish
      </button>
      <div class="topbar-sep"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <!-- Builder body -->
  <div class="app-body">
    <div class="builder-shell" style="width:100%;height:100%">

      <!-- Left: question list -->
      <aside class="builder-left">
        <div class="builder-left-head">
          <h4>Questions</h4>
          <span id="q-count" style="font-size:12px;color:var(--text-muted)">0</span>
        </div>
        <div class="q-list" id="q-list"></div>
        <div class="builder-add-q">
          <button class="add-q-btn" id="add-q-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>
            Add question
          </button>
        </div>
      </aside>

      <!-- Center: editor -->
      <main class="builder-center" id="builder-center">
        <div class="empty-state" id="center-empty" style="margin-top:60px">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
          <h4>No questions yet</h4>
          <p>Click "Add question" to start building your form.</p>
          <button class="btn btn-solid btn-sm" id="center-add-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
            Add question
          </button>
        </div>
      </main>

      <!-- Right: form settings panel -->
      <aside class="builder-right" id="settings-panel">
        <div class="settings-head">
          <h4>Form settings</h4>
          <button class="btn-icon" id="settings-close-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="settings-body" id="settings-body">
          <!-- Injected by JS -->
        </div>
      </aside>

    </div>
  </div>
</div>

<!-- Question type picker modal -->
<div class="modal-backdrop" id="qtype-modal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3>Add question</h3>
      <button class="modal-close" data-close="qtype-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="qtype-grid" id="qtype-grid"></div>
    </div>
  </div>
</div>

<!-- Preview modal -->
<div class="modal-backdrop" id="preview-modal">
  <div class="modal" style="max-width:560px;padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">
      <h3 style="margin:0;font-size:15px">Preview</h3>
      <button class="modal-close" data-close="preview-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="preview-body" style="padding:24px;overflow-y:auto;max-height:78vh"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/builder.js"></script>
</body>
</html>
