<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Form Builder — WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<style>
/* ── Compact question card ──────────────────────────────────── */

.qcard {
  display: flex; align-items: center; gap: 14px;
  width: 100%; max-width: 640px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  user-select: none;
}
.qcard:hover {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(43,189,164,.08);
}
.qcard-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--teal-dim); color: var(--teal-deep);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
[data-theme="dark"] .qcard-icon { color: var(--teal); }
.qcard-icon svg { width: 18px; height: 18px; }
.qcard-info { flex: 1; min-width: 0; }
.qcard-type { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.qcard-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qcard-actions { display: flex; gap: 4px; flex-shrink: 0; }
.qcard-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-mid);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s, border-color .12s;
}
.qcard-btn:hover { background: var(--bg-raised); color: var(--text); border-color: var(--text-muted); }
.qcard-btn svg { width: 14px; height: 14px; }
.qcard-btn-danger:hover { color: var(--red); border-color: var(--red); background: rgba(220,53,69,.06); }

/* ── Edit modal ─────────────────────────────────────────────── */
.edit-modal-wrap {
  background: var(--bg-raised);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 540px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.edit-modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.edit-modal-head h3 { margin: 0; font-size: 15px; flex: 1; }
.edit-modal-qnum { font-size: 12px; color: var(--text-muted); }
.edit-modal-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.edit-modal-foot {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}
.edit-modal-foot .btn { min-width: 90px; }

/* ── Builder layout (no left panel) ────────────────────────── */
.builder-center-full {
  flex: 1; overflow-y: auto; padding: 32px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

/* hr divider in modal */
.edit-modal-body hr {
  border: none; border-top: 1px solid var(--border); margin: 4px 0;
}

/* ── Add question button (bottom of list) ───────────────────── */
.center-add-q-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; max-width: 640px;
  padding: 12px 20px;
  margin-top: 4px;
  font-size: 14px; font-weight: 600;
  color: var(--teal-deep);
  background: var(--teal-dim);
  border: 2px dashed var(--teal);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.center-add-q-btn:hover {
  background: rgba(43,189,164,.2);
  color: var(--teal);
}
[data-theme="dark"] .center-add-q-btn {
  color: var(--teal);
}

/* ── Bottom action buttons row ──────────────────────────────── */
.center-bottom-btns {
  display: flex; gap: 8px;
  width: 100%; max-width: 640px;
  flex-wrap: wrap;
}
.center-bottom-btns .add-q-btn { flex: 1; min-width: 160px; }
.center-add-pb-btn {
  color: var(--teal-deep) !important;
  background: transparent !important;
  border-color: var(--teal) !important;
  border-style: dashed !important;
  opacity: .75;
}
.center-add-pb-btn:hover { opacity: 1 !important; }
[data-theme="dark"] .center-add-pb-btn { color: var(--teal) !important; }

/* ── Page break divider ─────────────────────────────────────── */
.page-break-card {
  width: 100%; max-width: 640px;
  display: flex; align-items: center; gap: 10px;
  padding: 4px 0;
  position: relative;
  user-select: none;
}
.page-break-line {
  flex: 1; height: 1px;
  background: repeating-linear-gradient(to right, var(--teal) 0, var(--teal) 6px, transparent 6px, transparent 12px);
  opacity: .6;
}
.page-break-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700; color: var(--teal-deep);
  text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap;
  background: var(--bg); padding: 4px 10px; border-radius: 20px;
  border: 1.5px dashed var(--teal); opacity: .85;
}
[data-theme="dark"] .page-break-label { color: var(--teal); }
.page-break-del {
  width: 26px; height: 26px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-mid);
  color: var(--text-muted); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s, border-color .12s;
}
.page-break-del:hover { color: var(--red); border-color: var(--red); background: rgba(220,53,69,.06); }

/* ── Question image small preview in modal ──────────────────── */
.img-preview {
  max-width: 120px; max-height: 80px;
  border-radius: 6px; margin-top: 6px;
  object-fit: cover; border: 1px solid var(--border);
}
</style>
  <!-- Leaflet for Map field preview -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="app-shell" id="app">

  <!-- Top bar -->
  <header class="app-topbar">
    <a href="dashboard/" class="brand topbar-brand">
      <img src="assets/logo.webp" alt="">
      <span class="brand-word" translate="no"><span class="w1">Wate</span><span class="w2">Form</span></span>
    </a>
    <div class="topbar-sep"></div>

    <div style="display:flex;align-items:center;gap:10px;flex:1">
      <span class="builder-toolbar-title" id="topbar-form-title">Untitled Form</span>
      <span id="save-indicator" style="font-size:12px;color:var(--text-muted)"></span>
    </div>

    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" id="preview-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm" id="settings-toggle-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="btn btn-solid btn-sm" id="publish-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Publish
      </button>
    </div>
  </header>

  <!-- Body: center + settings right panel -->
  <div class="app-body">
    <div class="builder-shell" style="width:100%;height:100%">

      <!-- Center: question card list -->
      <main class="builder-center-full" id="builder-center">
        <div class="empty-state" id="center-empty" style="margin-top:60px">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
          <h4>No questions yet</h4>
          <p>Click "Add question" to start building your form.</p>
          <button class="btn btn-solid btn-sm" id="center-add-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
            Add question
          </button>
        </div>
      </main>

      <!-- Right: form settings panel -->
      <aside class="builder-right" id="settings-panel">
        <div class="settings-head">
          <h4>Form settings</h4>
          <button class="btn-icon" id="settings-close-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="settings-body" id="settings-body"></div>
      </aside>

    </div>
  </div>
</div>

<!-- Question type picker modal -->
<div class="modal-backdrop" id="qtype-modal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3>Add question</h3>
      <button class="modal-close" data-close="qtype-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="qtype-sections" id="qtype-grid"></div>
    </div>
  </div>
</div>

<!-- Edit question modal -->
<div class="modal-backdrop" id="edit-modal">
  <div class="edit-modal-wrap">
    <div class="edit-modal-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" id="edit-modal-icon"></svg>
      <h3 id="edit-modal-type">Question</h3>
      <span class="edit-modal-qnum" id="edit-modal-qnum">Q1</span>
      <button class="btn-icon" data-close="edit-modal" style="margin-left:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="edit-modal-body" id="edit-modal-body"></div>
    <div class="edit-modal-foot">
      <button class="btn btn-ghost" id="edit-cancel-btn">Cancel</button>
      <button class="btn btn-solid" id="edit-save-btn">Save</button>
    </div>
  </div>
</div>

<!-- Preview modal -->
<div class="modal-backdrop" id="preview-modal">
  <div class="modal" style="max-width:560px;padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">
      <h3 style="margin:0;font-size:15px">Preview</h3>
      <button class="modal-close" data-close="preview-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="preview-body" style="padding:24px;overflow-y:auto;max-height:78vh"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/builder.js"></script>
</body>
</html>
