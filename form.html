<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>WateForm</title>
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="stylesheet" href="assets/style.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }

.form-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--bg-raised);
}
.form-topbar .brand img { height: 24px; }
.form-topbar .brand-word { font-size: 17px; }
.form-topbar.hidden { display: none; }

.form-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 48px 20px 80px;
}
.form-card {
  width: 100%; max-width: 560px;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px;
  display: flex; flex-direction: column; gap: 24px;
}
.form-header { display: flex; flex-direction: column; gap: 8px; }
.form-title { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.25; }
.form-desc  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.6; }

.q-block { display: flex; flex-direction: column; gap: 8px; }
.q-label {
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: baseline; gap: 4px;
}
.q-label .req { color: var(--red); font-size: 13px; }
.q-subtitle { font-size: 13px; color: var(--text-soft); line-height: 1.55; }

/* Choice / radio */
.choice-list { display: flex; flex-direction: column; gap: 6px; }
.choice-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
}
.choice-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.choice-opt.selected { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.choice-marker {
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.choice-opt.selected .choice-marker { border-color: var(--teal); background: var(--teal); }
.choice-opt.selected .choice-marker::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
}

/* Checkbox multi-select */
.check-list { display: flex; flex-direction: column; gap: 6px; }
.check-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--text); user-select: none;
}
.check-opt:hover { border-color: var(--teal); background: var(--teal-dim); }
.check-opt.checked { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
.check-marker {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.check-opt.checked .check-marker {
  border-color: var(--teal); background: var(--teal);
}
.check-opt.checked .check-marker::after {
  content: ''; width: 9px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

/* Star rating */
.star-row { display: flex; gap: 8px; }
.star-opt {
  background: none; border: none; font-size: 28px; cursor: pointer;
  color: var(--border); transition: color .1s; line-height: 1;
  padding: 0;
}
.star-opt.lit { color: var(--teal); }

/* Phone wrap */
.ph-wrap { display: flex; gap: 8px; max-width: 360px; }
.ph-prefix { width: 120px; flex-shrink: 0; }

/* Submit */
.form-submit { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.btn-submit {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
  background: var(--teal); color: #04231C; border: none;
  border-radius: var(--radius); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s;
}
.btn-submit:hover { background: var(--teal-deep); color: #fff; }
.btn-submit-wa { background: #25D366; color: #fff; }
.btn-submit-wa:hover { background: #1da851; color: #fff; }
.btn-submit-tg { background: #229ED9; color: #fff; }
.btn-submit-tg:hover { background: #1a7fad; color: #fff; }

/* States */
.state-screen {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 48px 20px;
}
.state-box { text-align: center; max-width: 400px; }
.state-box h2 { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
.state-box p  { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.65; }
.state-icon { color: var(--teal); margin-bottom: 20px; }

/* Countdown */
.cd-unit {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 62px;
}
.cd-val {
  font-size: 36px; font-weight: 800; line-height: 1;
  color: var(--teal);
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 10px 14px;
  min-width: 62px; text-align: center; font-variant-numeric: tabular-nums;
}
.cd-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.cd-sep { font-size: 32px; font-weight: 800; color: var(--text-muted); align-self: center; line-height: 1; padding-bottom: 18px; }

@media (max-width: 600px) {
  .form-card { padding: 24px 18px; }
  .form-topbar { padding: 12px 16px; }
  .cd-val { font-size: 26px; min-width: 48px; padding: 8px 10px; }
  .cd-unit { min-width: 48px; }
  .cd-sep { font-size: 24px; }
}

/* File upload field */
.file-upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 28px 20px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s; position: relative;
}
.file-upload-area:hover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area.dragover { border-color: var(--teal); background: var(--teal-dim); }
.file-upload-area input[type="file"] { display: none; }
.file-upload-icon { color: var(--teal); margin-bottom: 8px; }
.file-upload-name {
  font-size: 13px; color: var(--teal); margin-top: 8px;
  word-break: break-all; font-weight: 600;
}
.file-upload-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* Color picker */
.color-picker-wrap { display: flex; flex-direction: column; gap: 10px; }
.color-picker-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.color-picker-row input[type="color"] {
  width: 56px; height: 48px; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3px; cursor: pointer;
  background: var(--bg-raised);
}
.color-codes { display: flex; gap: 8px; flex-wrap: wrap; }
.color-code-chip {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; font-family: 'JetBrains Mono', monospace;
  background: var(--bg-mid); color: var(--text);
  cursor: pointer; transition: background .15s;
}
.color-code-chip:hover { background: var(--teal-dim); border-color: var(--teal); }
.color-swatch {
  width: 48px; height: 48px; border-radius: 8px;
  border: 1px solid var(--border); flex-shrink: 0;
}

/* Password field */
.password-wrap { position: relative; }
.password-wrap input { padding-right: 44px !important; }
.password-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  padding: 4px; display: flex; align-items: center;
}
.password-toggle:hover { color: var(--teal); }
.password-err {
  font-size: 12px; color: var(--red); margin-top: 4px; display: none;
}

/* URL input */
.url-input-wrap { position: relative; }
.url-input-wrap input { padding-left: 36px !important; }
.url-prefix-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}

/* Dropdown with search */
.dropdown-search-wrap { position: relative; }
.dropdown-search-input {
  width: 100%; padding: 9px 36px 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-raised); color: var(--text);
  font-size: 14px; outline: none; font-family: inherit; cursor: pointer;
}
.dropdown-search-input:focus { border-color: var(--teal); }
.dropdown-list {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); max-height: 220px; overflow-y: auto;
  box-shadow: var(--shadow);
}
.dropdown-list.open { display: block; }
.dropdown-search-box {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-soft);
  position: sticky; top: 0; background: var(--bg-raised);
}
.dropdown-search-box input {
  width: 100%; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-mid); color: var(--text);
  font-size: 13px; outline: none; font-family: inherit;
}
.dropdown-search-box input:focus { border-color: var(--teal); }
.dropdown-option {
  padding: 9px 14px; cursor: pointer; font-size: 14px; color: var(--text);
  transition: background .1s;
}
.dropdown-option:hover, .dropdown-option.highlighted { background: var(--teal-dim); color: var(--teal-deep); }
.dropdown-option.selected { font-weight: 600; color: var(--teal-deep); }
.dropdown-no-results { padding: 10px 14px; font-size: 13px; color: var(--text-muted); }
.dropdown-arrow {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--text-muted);
}

/* ── Toggle Switch ─────────────────────────────── */
.toggle-switch-wrap { display:flex; align-items:center; gap:14px; }
.toggle-track {
  width:52px; height:28px; border-radius:14px; background:var(--border);
  position:relative; cursor:pointer; transition:background .2s; flex-shrink:0;
  border:none; padding:0;
}
.toggle-track.on { background:var(--teal); }
.toggle-knob {
  width:22px; height:22px; border-radius:50%; background:#fff;
  position:absolute; top:3px; left:3px;
  box-shadow:0 1px 4px rgba(0,0,0,.22); transition:left .2s;
}
.toggle-track.on .toggle-knob { left:27px; }
.toggle-label-text { font-size:14px; color:var(--text); min-width:32px; }

/* ── Multi-select Dropdown ─────────────────────── */
.ms-wrap { position:relative; }
.ms-trigger {
  width:100%; min-height:44px; padding:6px 36px 6px 10px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg-raised); cursor:pointer;
  display:flex; flex-wrap:wrap; gap:5px; align-items:center;
  font-size:14px; color:var(--text-muted); font-family:inherit;
}
.ms-trigger:focus { outline:none; border-color:var(--teal); }
.ms-tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; background:var(--teal-dim);
  border:1px solid var(--teal); border-radius:20px;
  font-size:12px; color:var(--teal-deep); font-weight:600;
}
.ms-tag-rm {
  background:none; border:none; cursor:pointer;
  color:var(--teal-deep); padding:0 0 0 2px; font-size:14px; line-height:1;
}
.ms-tag-rm:hover { color:var(--red); }
.ms-arrow { position:absolute; right:10px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--text-muted); }
.ms-panel {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
  background:var(--bg-raised); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.ms-panel.open { display:block; }
.ms-search-box { padding:8px 10px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--bg-raised); }
.ms-search-box input { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--bg-mid); color:var(--text); font-size:13px; outline:none; font-family:inherit; }
.ms-options { max-height:200px; overflow-y:auto; }
.ms-opt {
  padding:9px 14px; cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; gap:8px; transition:background .1s;
}
.ms-opt:hover { background:var(--teal-dim); }
.ms-opt.selected { font-weight:600; color:var(--teal-deep); background:var(--teal-dim); }
.ms-opt-check { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ms-opt.selected .ms-opt-check { background:var(--teal); border-color:var(--teal); }
.ms-opt.selected .ms-opt-check::after { content:""; width:9px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
.ms-no-res { padding:10px 14px; font-size:13px; color:var(--text-muted); }
.ms-max-note { padding:6px 14px; font-size:11px; color:var(--amber); background:rgba(217,119,6,.08); border-top:1px solid var(--border-soft); }

/* ── Likert Scale ──────────────────────────────── */
.likert-table { width:100%; border-collapse:collapse; font-size:13px; }
.likert-table th { padding:6px 4px; font-size:11px; font-weight:600; color:var(--text-muted); text-align:center; }
.likert-table th.lk-label { text-align:left; font-size:12px; max-width:120px; }
.likert-table th.lk-label-r { text-align:right; font-size:12px; max-width:120px; }
.likert-table td { padding:10px 4px; text-align:center; border-top:1px solid var(--border-soft); }
.likert-table td.lk-row-label { text-align:left; padding:10px 8px; font-size:13px; color:var(--text); }
.likert-radio { width:18px; height:18px; accent-color:var(--teal); cursor:pointer; }
.likert-scroll { overflow-x:auto; }

/* ── Matrix / Grid ─────────────────────────────── */
.matrix-scroll { overflow-x:auto; }
.matrix-table { width:100%; border-collapse:collapse; font-size:13px; }
.matrix-table th { padding:9px 14px; text-align:center; font-weight:600; color:var(--text); border-bottom:2px solid var(--border); white-space:nowrap; }
.matrix-table th:first-child { text-align:left; }
.matrix-table td { padding:10px 14px; border-top:1px solid var(--border-soft); text-align:center; }
.matrix-table td:first-child { text-align:left; font-size:13px; color:var(--text); }
.matrix-table tr:hover td { background:var(--teal-dim); }
.matrix-input { width:18px; height:18px; accent-color:var(--teal); cursor:pointer; }

/* ── Multiple Inputs ───────────────────────────── */
.multi-input-grid { display:flex; flex-direction:column; gap:12px; }
.mi-field-wrap { display:flex; flex-direction:column; gap:4px; }
.mi-field-label { font-size:12px; font-weight:600; color:var(--text); }
</style>
</head>
<body>

<div class="form-topbar">
  <a href="index.html" class="brand" translate="no">
    <img src="assets/logo.webp" alt="WateForm">
    <span class="brand-word" translate="no"><span class="w1">Wate</span><span class="w2">Form</span></span>
  </a>
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
  </button>
</div>

<div id="root" class="state-screen">
  <div class="state-box">
    <svg class="state-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    <h2>Loading form…</h2>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = "https://zaaqlfxtymuafalkeftd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphYXFsZnh0eW11YWZhbGtlZnRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg2NjMsImV4cCI6MjEwMTQ1NDY2M30.NKBBX7Qcb4T22tvAjjAzh4Scmbt-bJN1kb1ADBr6Bro";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Read params from query string — set by 404.html which redirects here.
// Two shapes:
//   ?ws=X&f=Y  — auto-generated two-segment URL
//   ?slug=X    — custom single-segment URL
const params     = new URLSearchParams(window.location.search);
const wsShort    = params.get("ws");
const formShort  = params.get("f");
const customSlug = params.get("slug");

// ── Theme ─────────────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem("theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  document.querySelector("[data-theme-toggle]")?.addEventListener("click", () => {
    const cur  = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });
})();

// ── Render helpers ────────────────────────────────────────────
const root = document.getElementById("root");

function showInactive() {
  root.className = "state-screen";
  root.innerHTML = `
    <div class="state-box">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);margin-bottom:20px">
        <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
      </svg>
      <h2 style="color:var(--text-muted)">Form is inactive</h2>
      <p>This form has been turned off by its owner and is not accepting responses right now.</p>
    </div>`;
}

function showError(msg) {
  root.className = "state-screen";
  root.innerHTML = `
    <div class="state-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" style="margin-bottom:16px">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <h2 style="color:var(--red)">Form not found</h2>
      <p>${msg}</p>
    </div>`;
}

function showSuccess(settings, targetOverride) {
  const target = targetOverride || settings.target || "wa";
  root.className = "state-screen";
  root.innerHTML = `
    <div class="state-box">
      <svg class="state-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <h2>Response sent!</h2>
      <p>Check your ${target === "tg" ? "Telegram" : "WhatsApp"} for a confirmation message.</p>
    </div>`;
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Build WhatsApp / Telegram link ────────────────────────────
function buildLink(settings, questions, answers, targetOverride) {
  const lines = questions.map(q => {
    const ans = answers[q.id];
    if (ans === undefined || ans === null || ans === "") return null;
    return `*${q.title}*\n${ans}`;
  }).filter(Boolean);

  const body = lines.join("\n\n");
  const target = targetOverride || settings.target || "wa";

  if (target === "tg") {
    const user = settings.tgUsername || "";
    return `https://t.me/${user}?text=${encodeURIComponent(body)}`;
  } else {
    const number = (settings.waPrefix || "+62").replace("+","") + (settings.waNumber || "").replace(/\D/g,"");
    return `https://wa.me/${number}?text=${encodeURIComponent(body)}`;
  }
}

// ── Schedule state screen ────────────────────────────────────
let _countdownInterval = null;

function showScheduled(state, openTime, closeTime, closedMessage) {
  const fmt = dt => dt ? dt.toLocaleString(undefined, { weekday:"short", year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : null;
  root.className = "state-screen";

  if (state === "not-open") {
    // Build countdown display
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--teal);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <h2>Form belum dibuka</h2>
        <p style="margin-bottom:20px">Form akan dibuka pada<br><strong>${fmt(openTime)}</strong></p>
        <div id="countdown-wrap" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
          <div class="cd-unit"><div class="cd-val" id="cd-d">--</div><div class="cd-lbl">Hari</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-h">--</div><div class="cd-lbl">Jam</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-m">--</div><div class="cd-lbl">Menit</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-val" id="cd-s">--</div><div class="cd-lbl">Detik</div></div>
        </div>
        ${closeTime ? `<p style="font-size:13px;color:var(--text-muted)">Dan akan ditutup pada <strong>${fmt(closeTime)}</strong></p>` : ""}
      </div>`;

    // Start live countdown
    if (_countdownInterval) clearInterval(_countdownInterval);
    function tick() {
      const diff = openTime - new Date();
      if (diff <= 0) { clearInterval(_countdownInterval); location.reload(); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      const pad = n => String(n).padStart(2,"0");
      const el = id => document.getElementById(id);
      if (el("cd-d")) el("cd-d").textContent = pad(d);
      if (el("cd-h")) el("cd-h").textContent = pad(h);
      if (el("cd-m")) el("cd-m").textContent = pad(m);
      if (el("cd-s")) el("cd-s").textContent = pad(s);
    }
    tick();
    _countdownInterval = setInterval(tick, 1000);

  } else {
    // Closed state — show custom message if set
    const msg = closedMessage || "Pengiriman jawaban tidak lagi diterima.";
    root.innerHTML = `
      <div class="state-box">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);margin-bottom:20px">
          <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
        </svg>
        <h2 style="color:var(--text-muted)">Form ditutup</h2>
        <p>${esc(msg)}</p>
        ${closeTime ? `<p style="margin-top:10px;font-size:12px;color:var(--text-muted)">Ditutup pada ${fmt(closeTime)}</p>` : ""}
      </div>`;
  }
}

// ── Render form ───────────────────────────────────────────────
function renderForm(form) {
  const questions = Array.isArray(form.questions) ? form.questions : [];
  const settings  = form.settings || {};
  const answers   = {};
  const starState = {};

  document.title = `${form.title} — WateForm`;

  root.className = "";
  root.innerHTML = "";
  root.classList.add("form-wrap");

  const card = document.createElement("div");
  card.className = "form-card";

  // Header
  card.innerHTML = `
    <div class="form-header">
      <h1 class="form-title">${esc(form.title)}</h1>
      ${form.description ? `<p class="form-desc">${esc(form.description)}</p>` : ""}
    </div>`;

  // Questions
  questions.forEach(q => {
    const block = document.createElement("div");
    block.className = "q-block";
    const req = q.required ? `<span class="req">*</span>` : "";

    // Title type: render as heading
    if (q.type === "title") {
      const titleBlock = document.createElement("div");
      titleBlock.className = "q-block";
      titleBlock.innerHTML = `
        <div style="padding:4px 0 2px">
          <div style="font-size:18px;font-weight:800;color:var(--text);line-height:1.25">${esc(q.title)}</div>
          ${q.subtitle ? `<div style="font-size:13.5px;color:var(--text-soft);margin-top:4px;line-height:1.55">${q.subtitle}</div>` : ""}
        </div>`;
      card.appendChild(titleBlock);
      return;
    }

    // Image type
    if (q.type === "image") {
      const imgBlock = document.createElement("div");
      imgBlock.className = "q-block";
      const imgSrc = q.mediaUrl || q.imageUploadUrl || "";
      imgBlock.innerHTML = imgSrc
        ? `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
           ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
           <img src="${esc(imgSrc)}" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:10px;display:block">`
        : `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
           <div style="background:var(--bg-mid);border:1px dashed var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text-muted);font-size:13px">No image set</div>`;
      card.appendChild(imgBlock);
      return;
    }

    // Video type
    if (q.type === "video") {
      const vidBlock = document.createElement("div");
      vidBlock.className = "q-block";
      const vidSrc = q.mediaUrl || q.imageUploadUrl || "";
      if (vidSrc) {
        const ytMatch = vidSrc.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
        const embedSrc = ytMatch ? "https://www.youtube.com/embed/" + ytMatch[1] : null;
        vidBlock.innerHTML = `
          ${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}
          ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
          ${embedSrc
            ? `<div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden"><iframe src="${esc(embedSrc)}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>`
            : `<video src="${esc(vidSrc)}" controls style="width:100%;border-radius:10px;display:block"></video>`}`;
      } else {
        vidBlock.innerHTML = `${q.title ? `<div class="q-label">${esc(q.title)}</div>` : ""}<div style="background:var(--bg-mid);border:1px dashed var(--border);border-radius:10px;padding:48px;text-align:center;color:var(--text-muted);font-size:13px">No video set</div>`;
      }
      card.appendChild(vidBlock);
      return;
    }

        let inputHtml = "";
    switch (q.type) {
      case "short":
      case "short":
      case "text":
      case "url":
        inputHtml = `<input type="${q.type === "url" ? "url" : "text"}" id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      case "email":
        inputHtml = `<input type="email" id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      case "number":
        inputHtml = `<input type="number" id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      case "long":
      case "paragraph":
        inputHtml = `<textarea id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" rows="4" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit;resize:vertical"></textarea>`;
        break;
      case "phone": {
        const prefix = q.phonePrefix || "+62";
        inputHtml = `<div class="ph-wrap">
          <input type="text" id="q-${q.id}-prefix" value="${esc(prefix)}" class="ph-prefix q-input" style="padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">
          <input type="tel" id="q-${q.id}" class="q-input" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">
        </div>`;
        break;
      }
      case "checkbox": {
        const cbOpts = Array.isArray(q.checkboxOptions) && q.checkboxOptions.length ? q.checkboxOptions : (Array.isArray(q.options) ? q.options : []);
        inputHtml = `<div class="check-list" id="cl-${q.id}">` +
          cbOpts.map(opt => `<div class="check-opt" data-qid="${q.id}" data-val="${esc(opt)}">
            <div class="check-marker"></div><span>${esc(opt)}</span>
          </div>`).join("") +
          (q.checkboxAllowOther ? `<div class="check-opt" data-qid="${q.id}" data-val="__other__">
            <div class="check-marker"></div><span>Other…</span>
          </div>
          <input type="text" id="q-${q.id}-other" placeholder="Please specify" style="display:none;width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">` : "") +
          `</div>`;
        break;
      }
      case "choice": {
        const opts = Array.isArray(q.options) ? q.options : [];
        inputHtml = `<div class="choice-list" id="cl-${q.id}">` +
          opts.map(opt => `<div class="choice-opt" data-qid="${q.id}" data-val="${esc(opt)}">
            <div class="choice-marker"></div><span>${esc(opt)}</span>
          </div>`).join("") +
          (q.allowOther ? `<div class="choice-opt" data-qid="${q.id}" data-val="__other__">
            <div class="choice-marker"></div><span>Other…</span>
          </div>
          <input type="text" id="q-${q.id}-other" placeholder="Please specify" style="display:none;width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">` : "") +
          `</div>`;
        break;
      }
      case "dropdown": {
        const opts = Array.isArray(q.options) ? q.options : [];
        const useSearch = opts.length > 10;
        if (useSearch) {
          inputHtml = `<div class="dropdown-search-wrap" id="ddw-${q.id}">
            <input type="text" class="dropdown-search-input" id="q-${q.id}" placeholder="— Select —" readonly autocomplete="off">
            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m6 9 6 6 6-6"/></svg>
            <div class="dropdown-list" id="ddl-${q.id}">
              <div class="dropdown-search-box">
                <input type="text" id="dds-${q.id}" placeholder="Search…" autocomplete="off">
              </div>
              <div id="ddo-${q.id}">
                ${opts.map(opt => `<div class="dropdown-option" data-val="${esc(opt)}">${esc(opt)}</div>`).join("")}
              </div>
              <div class="dropdown-no-results" id="ddnr-${q.id}" style="display:none">No results</div>
            </div>
          </div>`;
        } else {
          inputHtml = `<div style="position:relative">
            <select id="q-${q.id}" class="q-input" style="width:100%;padding:9px 36px 9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit;appearance:none;cursor:pointer">
              <option value="">— Select —</option>
              ${opts.map(opt => `<option value="${esc(opt)}">${esc(opt)}</option>`).join("")}
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted)"><path d="m6 9 6 6 6-6"/></svg>
          </div>`;
        }
        break;
      }
      case "rating": {
        const max = q.maxRating || 5;
        inputHtml = `<div class="star-row" id="sr-${q.id}">` +
          Array.from({length: max}, (_,i) => `<button type="button" class="star-opt" data-qid="${q.id}" data-val="${i+1}">★</button>`).join("") +
          `</div>`;
        break;
      }
      case "date":
        inputHtml = `<input type="date" id="q-${q.id}" class="q-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      case "time":
        inputHtml = `<input type="time" id="q-${q.id}" class="q-input" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
        break;
      case "toggle": {
        const onLbl  = q.toggleOnLabel  || "Yes";
        const offLbl = q.toggleOffLabel || "No";
        const def    = !!q.toggleDefault;
        inputHtml = `<div class="toggle-switch-wrap">
          <button type="button" class="toggle-track${def?" on":""}" id="q-${q.id}" aria-pressed="${def}">
            <div class="toggle-knob"></div>
          </button>
          <span class="toggle-label-text" id="qtl-${q.id}">${esc(def?onLbl:offLbl)}</span>
        </div>`;
        break;
      }
      case "multiselect": {
        const msOpts = Array.isArray(q.multiselectOptions) ? q.multiselectOptions : [];
        const msMax  = q.multiselectMax || 0;
        inputHtml = `<div class="ms-wrap" id="msw-${q.id}">
          <div class="ms-trigger" id="mst-${q.id}" tabindex="0" role="combobox" aria-expanded="false">
            <span class="ms-placeholder" id="msp-${q.id}">${esc(q.multiselectPlaceholder||"Select options…")}</span>
          </div>
          <svg class="ms-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m6 9 6 6 6-6"/></svg>
          <div class="ms-panel" id="mspanel-${q.id}">
            <div class="ms-search-box"><input type="text" id="mssearch-${q.id}" placeholder="Search…" autocomplete="off"></div>
            <div class="ms-options" id="mslist-${q.id}">
              ${msOpts.map(o=>`<div class="ms-opt" data-val="${esc(o)}"><div class="ms-opt-check"></div><span>${esc(o)}</span></div>`).join("")}
            </div>
            <div class="ms-no-res" id="msnr-${q.id}" style="display:none">No results</div>
            ${msMax>0?`<div class="ms-max-note">Max ${msMax} selections</div>`:""}
          </div>
        </div>`;
        break;
      }
      case "likert": {
        const scale    = q.likertScale || 5;
        const lkRows   = (q.likertRows||[""]).filter(Boolean);
        const startLbl = q.likertStartLabel || "Strongly Disagree";
        const endLbl   = q.likertEndLabel   || "Strongly Agree";
        const cols     = Array.from({length:scale},(_,i)=>i+1);
        inputHtml = `<div class="likert-scroll"><table class="likert-table" id="lkt-${q.id}">
          <thead><tr>
            <th class="lk-label">${esc(startLbl)}</th>
            ${cols.map(n=>`<th>${n}</th>`).join("")}
            <th class="lk-label-r">${esc(endLbl)}</th>
          </tr></thead>
          <tbody>
            ${lkRows.map((r,ri)=>`<tr>
              <td class="lk-row-label">${esc(r)}</td>
              ${cols.map(n=>`<td><input type="radio" class="likert-radio" name="lkr-${q.id}-${ri}" data-row="${ri}" data-val="${n}" value="${n}"></td>`).join("")}
              <td></td>
            </tr>`).join("")}
          </tbody>
        </table></div>`;
        break;
      }
      case "matrix": {
        const mRows = q.matrixRows || ["Row 1","Row 2"];
        const mCols = q.matrixCols || ["Column 1","Column 2","Column 3"];
        const mType = q.matrixType || "radio";
        inputHtml = `<div class="matrix-scroll"><table class="matrix-table" id="mxt-${q.id}">
          <thead><tr>
            <th></th>
            ${mCols.map(c=>`<th>${esc(c)}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${mRows.map((r,ri)=>`<tr>
              <td>${esc(r)}</td>
              ${mCols.map((c,ci)=>`<td><input type="${mType}" class="matrix-input" name="${mType==="radio"?`mx-${q.id}-${ri}`:""}" data-row="${ri}" data-col="${ci}" data-rowname="${esc(r)}" data-colname="${esc(c)}" value="${esc(c)}"></td>`).join("")}
            </tr>`).join("")}
          </tbody>
        </table></div>`;
        break;
      }
      case "multi_input": {
        const miFields = q.multiInputFields || [];
        inputHtml = `<div class="multi-input-grid" id="mig-${q.id}">
          ${miFields.map((f,fi)=>`<div class="mi-field-wrap">
            <div class="mi-field-label">${esc(f.label||"")}</div>
            <input type="${f.type||"text"}" id="mif-${q.id}-${fi}" placeholder="${esc(f.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit" data-fi="${fi}">
          </div>`).join("")}
        </div>`;
        break;
      }
      case "url_input": {
        inputHtml = `<div class="url-input-wrap">
          <svg class="url-prefix-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <input type="url" id="q-${q.id}" class="q-input" placeholder="${esc(q.urlPlaceholder||"https://")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">
        </div>`;
        break;
      }
      case "file_upload": {
        const accept = q.allowedFileTypes || "";
        const maxMb = q.maxFileSizeMb || 10;
        const hint = accept ? accept.replace(/,/g,", ") + ` · Max ${maxMb}MB` : `Any file · Max ${maxMb}MB`;
        inputHtml = `<div class="file-upload-area" id="fua-${q.id}" tabindex="0">
          <input type="file" id="q-${q.id}" ${accept ? `accept="${esc(accept)}"` : ""}>
          <div class="file-upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(q.placeholder||"Click or drag to upload")}</div>
          <div class="file-upload-hint">${esc(hint)}</div>
          <div class="file-upload-name" id="fun-${q.id}" style="display:none"></div>
        </div>`;
        break;
      }
      case "color": {
        const defColor = q.colorDefault || "#2BBDA4";
        inputHtml = `<div class="color-picker-wrap">
          <div class="color-picker-row">
            <div class="color-swatch" id="csw-${q.id}" style="background:${esc(defColor)}"></div>
            <input type="color" id="q-${q.id}" value="${esc(defColor)}" style="width:56px;height:48px;border:1px solid var(--border);border-radius:var(--radius);padding:3px;cursor:pointer;background:var(--bg-raised)">
          </div>
          <div class="color-codes">
            <div class="color-code-chip" id="cchex-${q.id}" title="Click to copy HEX">HEX: ${esc(defColor)}</div>
            <div class="color-code-chip" id="ccrgb-${q.id}" title="Click to copy RGB">RGB: —</div>
            <div class="color-code-chip" id="cchsl-${q.id}" title="Click to copy HSL">HSL: —</div>
          </div>
        </div>`;
        break;
      }
      case "password": {
        inputHtml = `<div class="password-wrap">
          <input type="password" id="q-${q.id}" class="q-input" placeholder="Enter password…"
            style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit;letter-spacing:.12em">
          <button type="button" class="password-toggle" id="ptog-${q.id}" title="Show/hide">
            <svg id="ptog-icon-${q.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="password-err" id="perr-${q.id}">Incorrect password. Please try again.</div>
        </div>`;
        break;
      }
      default:
        inputHtml = `<input type="text" id="q-${q.id}" class="q-input" placeholder="${esc(q.placeholder||"")}" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-raised);color:var(--text);font-size:14px;outline:none;font-family:inherit">`;
    }

    block.innerHTML = `
      ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px">` : ""}
      ${q.type !== "checkbox" ? `<div class="q-label">${esc(q.title)}${req}</div>` : ""}
      ${q.subtitle ? `<div class="q-subtitle">${q.subtitle}</div>` : ""}
      ${q.type === "checkbox" ? `<div class="q-label" style="margin-bottom:2px">${esc(q.title)}${req}</div>` : ""}
      ${inputHtml}
      ${q.type !== "password" ? `<div class="q-err" style="font-size:12px;color:var(--red);display:none">This field is required.</div>` : ""}`;
    card.appendChild(block);

    // Bind checkbox multi-select events
    if (q.type === "checkbox") {
      const selectedVals = new Set();
      block.querySelectorAll(".check-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          const val = opt.dataset.val;
          const otherInput = block.querySelector(`#q-${q.id}-other`);
          if (opt.classList.contains("checked")) {
            opt.classList.remove("checked");
            selectedVals.delete(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "none";
          } else {
            opt.classList.add("checked");
            selectedVals.add(val);
            if (val === "__other__" && otherInput) otherInput.style.display = "";
          }
          // Build answer string
          const parts = [];
          selectedVals.forEach(v => {
            if (v === "__other__") {
              const txt = otherInput?.value?.trim();
              if (txt) parts.push("Other: " + txt);
            } else {
              parts.push(v);
            }
          });
          answers[q.id] = parts.join(", ");
        });
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        const parts = [];
        selectedVals.forEach(v => {
          if (v === "__other__") {
            if (e.target.value.trim()) parts.push("Other: " + e.target.value.trim());
          } else {
            parts.push(v);
          }
        });
        answers[q.id] = parts.join(", ");
      });
    }

    // Bind choice events
    if (q.type === "choice") {
      block.querySelectorAll(".choice-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          block.querySelectorAll(".choice-opt").forEach(o => o.classList.remove("selected"));
          opt.classList.add("selected");
          const val = opt.dataset.val;
          const otherInput = block.querySelector(`#q-${q.id}-other`);
          if (val === "__other__") {
            if (otherInput) otherInput.style.display = "";
            answers[q.id] = otherInput?.value || "";
          } else {
            if (otherInput) otherInput.style.display = "none";
            answers[q.id] = val;
          }
        });
      });
      block.querySelector(`#q-${q.id}-other`)?.addEventListener("input", e => {
        answers[q.id] = e.target.value;
      });
    }

    // Bind rating events
    if (q.type === "rating") {
      block.querySelectorAll(".star-opt").forEach(star => {
        star.addEventListener("click", () => {
          const val = Number(star.dataset.val);
          starState[q.id] = val;
          answers[q.id] = val + " / " + (q.maxRating || 5) + " stars";
          block.querySelectorAll(".star-opt").forEach((s, i) => {
            s.classList.toggle("lit", i < val);
          });
        });
      });
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel) {
        sel.addEventListener("change", () => {
          answers[q.id] = sel.value;
        });
      }
    }

    // Bind dropdown select
    if (q.type === "dropdown") {
      const sel = block.querySelector(`#q-${q.id}`);
      if (sel && sel.tagName === "SELECT") sel.addEventListener("change", () => { answers[q.id] = sel.value; });
      // Searchable dropdown (> 10 opts)
      const ddWrap = block.querySelector(`#ddw-${q.id}`);
      if (ddWrap) {
        const trigger = ddWrap.querySelector(`#q-${q.id}`);
        const list    = ddWrap.querySelector(`#ddl-${q.id}`);
        const search  = ddWrap.querySelector(`#dds-${q.id}`);
        const optsDiv = ddWrap.querySelector(`#ddo-${q.id}`);
        const noRes   = ddWrap.querySelector(`#ddnr-${q.id}`);
        trigger.addEventListener("click", () => { list.classList.toggle("open"); if (list.classList.contains("open")) search.focus(); });
        document.addEventListener("click", e => { if (!ddWrap.contains(e.target)) list.classList.remove("open"); }, true);
        search.addEventListener("input", () => {
          const q2 = search.value.toLowerCase();
          let shown = 0;
          optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
            const match = o.dataset.val.toLowerCase().includes(q2);
            o.style.display = match ? "" : "none";
            if (match) shown++;
          });
          noRes.style.display = shown === 0 ? "" : "none";
        });
        optsDiv.querySelectorAll(".dropdown-option").forEach(o => {
          o.addEventListener("click", () => {
            optsDiv.querySelectorAll(".dropdown-option").forEach(x => x.classList.remove("selected"));
            o.classList.add("selected");
            trigger.value = o.dataset.val;
            answers[q.id] = o.dataset.val;
            list.classList.remove("open");
          });
        });
      }
    }

    // Bind file upload
    if (q.type === "file_upload") {
      const fileInput = block.querySelector(`#q-${q.id}`);
      const area = block.querySelector(`#fua-${q.id}`);
      const nameDiv = block.querySelector(`#fun-${q.id}`);
      const maxMb = q.maxFileSizeMb || 10;
      const processFile = file => {
        if (!file) return;
        if (file.size > maxMb * 1024 * 1024) {
          nameDiv.textContent = `File too large. Max ${maxMb}MB.`;
          nameDiv.style.color = "var(--red)";
          nameDiv.style.display = "";
          answers[q.id] = "";
          return;
        }
        nameDiv.style.color = "var(--teal)";
        nameDiv.textContent = "📎 " + file.name + " (" + (file.size/1024/1024).toFixed(2) + "MB)";
        nameDiv.style.display = "";
        answers[q.id] = "[Attached: " + file.name + "]";
      };
      area.addEventListener("click", () => fileInput.click());
      area.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
      area.addEventListener("dragover", e => { e.preventDefault(); area.classList.add("dragover"); });
      area.addEventListener("dragleave", () => area.classList.remove("dragover"));
      area.addEventListener("drop", e => { e.preventDefault(); area.classList.remove("dragover"); processFile(e.dataTransfer.files[0]); });
      fileInput.addEventListener("change", () => processFile(fileInput.files[0]));
    }

    // Bind color picker
    if (q.type === "color") {
      const colorInp = block.querySelector(`#q-${q.id}`);
      const swatch   = block.querySelector(`#csw-${q.id}`);
      const hexChip  = block.querySelector(`#cchex-${q.id}`);
      const rgbChip  = block.querySelector(`#ccrgb-${q.id}`);
      const hslChip  = block.querySelector(`#cchsl-${q.id}`);
      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        return {r,g,b};
      }
      function rgbToHsl(r,g,b) {
        r/=255; g/=255; b/=255;
        const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
        if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
          switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;default:h=((r-g)/d+4)/6;}}
        return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
      }
      function updateColor(hex) {
        swatch.style.background = hex;
        hexChip.textContent = "HEX: " + hex.toUpperCase();
        const {r,g,b} = hexToRgb(hex);
        rgbChip.textContent = `RGB: ${r}, ${g}, ${b}`;
        const {h,s,l} = rgbToHsl(r,g,b);
        hslChip.textContent = `HSL: ${h}°, ${s}%, ${l}%`;
        answers[q.id] = `${hex.toUpperCase()} | RGB(${r},${g},${b}) | HSL(${h}°,${s}%,${l}%)`;
      }
      updateColor(colorInp.value);
      colorInp.addEventListener("input", () => updateColor(colorInp.value));
      [hexChip, rgbChip, hslChip].forEach(chip => {
        chip.addEventListener("click", () => {
          navigator.clipboard?.writeText(chip.textContent.replace(/^[A-Z]+: /,"")).catch(()=>{});
          const orig = chip.textContent; chip.textContent = "Copied!";
          setTimeout(() => { chip.textContent = orig; }, 1200);
        });
      });
    }

    // Bind password
    if (q.type === "password") {
      const pwInp = block.querySelector(`#q-${q.id}`);
      const togBtn = block.querySelector(`#ptog-${q.id}`);
      const togIcon = block.querySelector(`#ptog-icon-${q.id}`);
      togBtn.addEventListener("click", () => {
        const isHidden = pwInp.type === "password";
        pwInp.type = isHidden ? "text" : "password";
        togIcon.innerHTML = isHidden
          ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
          : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      });
      pwInp.addEventListener("input", () => {
        answers[q.id] = pwInp.value;
        block.querySelector(`#perr-${q.id}`).style.display = "none";
      });
    }

    // Bind toggle
    if (q.type === "toggle") {
      const track  = block.querySelector(`#q-${q.id}`);
      const lblEl  = block.querySelector(`#qtl-${q.id}`);
      const onLbl  = q.toggleOnLabel  || "Yes";
      const offLbl = q.toggleOffLabel || "No";
      let state = !!q.toggleDefault;
      answers[q.id] = state ? onLbl : offLbl;
      track.addEventListener("click", () => {
        state = !state;
        track.classList.toggle("on", state);
        track.setAttribute("aria-pressed", state);
        if (lblEl) lblEl.textContent = state ? onLbl : offLbl;
        answers[q.id] = state ? onLbl : offLbl;
      });
    }

    // Bind multiselect
    if (q.type === "multiselect") {
      const trigger  = block.querySelector(`#mst-${q.id}`);
      const panel    = block.querySelector(`#mspanel-${q.id}`);
      const searchEl = block.querySelector(`#mssearch-${q.id}`);
      const listEl   = block.querySelector(`#mslist-${q.id}`);
      const noResEl  = block.querySelector(`#msnr-${q.id}`);
      const phEl     = block.querySelector(`#msp-${q.id}`);
      const msMax    = q.multiselectMax || 0;
      const selected = new Set();

      function updateTrigger() {
        const tags = [...selected].map(v =>
          `<span class="ms-tag">${esc(v)}<button type="button" class="ms-tag-rm" data-val="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`
        ).join("");
        if (selected.size === 0) {
          trigger.innerHTML = `<span class="ms-placeholder">${esc(q.multiselectPlaceholder||"Select options…")}</span>`;
        } else {
          trigger.innerHTML = tags;
          trigger.querySelectorAll(".ms-tag-rm").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              selected.delete(btn.dataset.val);
              listEl.querySelectorAll(".ms-opt").forEach(o => {
                if (o.dataset.val === btn.dataset.val) o.classList.remove("selected");
              });
              updateTrigger();
              answers[q.id] = [...selected].join(", ");
            });
          });
        }
      }

      trigger.addEventListener("click", () => {
        const open = panel.classList.toggle("open");
        trigger.setAttribute("aria-expanded", open);
        if (open) { searchEl.focus(); searchEl.value = ""; filterMs(""); }
      });
      document.addEventListener("click", e => { if (!block.contains(e.target)) panel.classList.remove("open"); }, true);

      function filterMs(q2) {
        let shown = 0;
        listEl.querySelectorAll(".ms-opt").forEach(o => {
          const match = o.dataset.val.toLowerCase().includes(q2.toLowerCase());
          o.style.display = match ? "" : "none";
          if (match) shown++;
        });
        noResEl.style.display = shown === 0 ? "" : "none";
      }
      searchEl.addEventListener("input", () => filterMs(searchEl.value));

      listEl.querySelectorAll(".ms-opt").forEach(opt => {
        opt.addEventListener("click", () => {
          const val = opt.dataset.val;
          if (selected.has(val)) {
            selected.delete(val); opt.classList.remove("selected");
          } else {
            if (msMax > 0 && selected.size >= msMax) return;
            selected.add(val); opt.classList.add("selected");
          }
          updateTrigger();
          answers[q.id] = [...selected].join(", ");
        });
      });
      answers[q.id] = "";
    }

    // Bind likert
    if (q.type === "likert") {
      const lkRows = (q.likertRows||[""]).filter(Boolean);
      const rowAnswers = {};
      lkRows.forEach((r, ri) => { rowAnswers[ri] = null; });
      block.querySelectorAll(`.likert-radio`).forEach(inp => {
        inp.addEventListener("change", () => {
          rowAnswers[inp.dataset.row] = inp.dataset.val;
          const parts = lkRows.map((r,ri) => rowAnswers[ri] ? `${r}: ${rowAnswers[ri]}` : null).filter(Boolean);
          answers[q.id] = parts.join(" | ");
        });
      });
    }

    // Bind matrix
    if (q.type === "matrix") {
      const mType = q.matrixType || "radio";
      const mRows = q.matrixRows || [];
      const cellAnswers = {};
      mRows.forEach((_,ri) => { cellAnswers[ri] = mType === "checkbox" ? new Set() : null; });
      block.querySelectorAll(".matrix-input").forEach(inp => {
        inp.addEventListener("change", () => {
          const ri = Number(inp.dataset.row);
          if (mType === "radio") {
            cellAnswers[ri] = inp.dataset.colname;
          } else {
            if (inp.checked) cellAnswers[ri].add(inp.dataset.colname);
            else cellAnswers[ri].delete(inp.dataset.colname);
          }
          const parts = mRows.map((r,ri) => {
            const v = mType === "radio" ? cellAnswers[ri] : (cellAnswers[ri].size ? [...cellAnswers[ri]].join("+") : null);
            return v ? `${r}: ${v}` : null;
          }).filter(Boolean);
          answers[q.id] = parts.join(" | ");
        });
      });
    }

    // Bind multi_input
    if (q.type === "multi_input") {
      const miFields = q.multiInputFields || [];
      const fieldVals = {};
      miFields.forEach((f,fi) => { fieldVals[fi] = ""; });
      block.querySelectorAll(`[data-fi]`).forEach(inp => {
        const fi = Number(inp.dataset.fi);
        const f = miFields[fi];
        inp.addEventListener("input", () => {
          fieldVals[fi] = inp.value.trim();
          const parts = miFields.map((f,fi) => fieldVals[fi] ? `${f.label||("Field "+(fi+1))}: ${fieldVals[fi]}` : null).filter(Boolean);
          answers[q.id] = parts.join(" | ");
        });
      });
    }

    // Bind url_input
    if (q.type === "url_input") {
      const el = block.querySelector(`#q-${q.id}`);
      if (el) el.addEventListener("input", () => { answers[q.id] = el.value.trim(); });
    }

    // Bind text inputs
    if (!["choice","dropdown","rating","file_upload","color","password","url_input","checkbox",
           "toggle","multiselect","likert","matrix","multi_input"].includes(q.type)) {
      const el = block.querySelector(`#q-${q.id}`);
      if (el) {
        el.addEventListener("input", () => {
          if (q.type === "phone") {
            const prefix = block.querySelector(`#q-${q.id}-prefix`)?.value || "";
            answers[q.id] = prefix + " " + el.value.trim();
          } else {
            answers[q.id] = el.value.trim();
          }
        });
        // Also bind prefix changes for phone
        if (q.type === "phone") {
          block.querySelector(`#q-${q.id}-prefix`)?.addEventListener("input", () => {
            const prefix = block.querySelector(`#q-${q.id}-prefix`).value;
            answers[q.id] = prefix + " " + el.value.trim();
          });
        }
      }
    }
  });

  // Submit button(s)
  const target = settings.target || "wa";
  const submitDiv = document.createElement("div");
  submitDiv.className = "form-submit";

  if (target === "both") {
    const labelWa = settings.submitLabelWa || "Send WateForm to WhatsApp";
    const labelTg = settings.submitLabelTg || "Send WateForm to Telegram";
    submitDiv.innerHTML = `
      <button class="btn-submit btn-submit-wa" id="submit-btn-wa">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.997 0C5.373 0 0 5.373 0 12c0 2.122.559 4.112 1.532 5.835L.054 23.94l6.285-1.448A11.94 11.94 0 0 0 12 24c6.627 0 12-5.373 12-12S18.624 0 11.997 0zm.003 21.818a9.82 9.82 0 0 1-5.022-1.376l-.36-.214-3.733.979 1.001-3.656-.234-.376A9.82 9.82 0 0 1 2.182 12c0-5.421 4.41-9.818 9.818-9.818 5.42 0 9.818 4.397 9.818 9.818 0 5.42-4.397 9.818-9.818 9.818z"/></svg>
        ${esc(labelWa)}
      </button>
      <button class="btn-submit btn-submit-tg" id="submit-btn-tg">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.17 14.147l-2.95-.924c-.64-.203-.655-.64.136-.953l11.57-4.461c.537-.194 1.006.131.968.412z"/></svg>
        ${esc(labelTg)}
      </button>
    `;
  } else {
    const submitLabel = settings.submitLabel || (
      target === "tg" ? "Send WateForm to Telegram" : "Send WateForm to WhatsApp"
    );
    submitDiv.innerHTML = `<button class="btn-submit" id="submit-btn">${esc(submitLabel)}</button>`;
  }

  card.appendChild(submitDiv);
  root.appendChild(card);

  // ── Branding footer & navbar ───────────────────────────────────
  // removeWatermark defaults to true — hides the topbar (logo/name) and the
  // "created using WateForm" footer, leaving only the form itself.
  const hideBranding = settings.removeWatermark !== false;
  document.querySelector(".form-topbar")?.classList.toggle("hidden", hideBranding);
  if (!hideBranding) {
    const branding = document.createElement("p");
    branding.style.cssText = "text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-muted)";
    branding.innerHTML = '<strong>This form was created using <a href="https://wateform.my.id" target="_blank" rel="noopener" style="color:#2bbda4;text-decoration:underline">WateForm</a></strong>';
    root.appendChild(branding);
  }

  // ── Validate helper ─────────────────────────────────────────
  function validateForm() {
    let valid = true;
    questions.forEach(q => {
      const block = card.querySelectorAll(".q-block")[questions.indexOf(q)];
      const errEl = block?.querySelector(".q-err");

      // Password gate: always validate regardless of required flag
      if (q.type === "password") {
        const pwInp = block?.querySelector(`#q-${q.id}`);
        const perrEl = block?.querySelector(`#perr-${q.id}`);
        const entered = (pwInp?.value || "").trim();
        const expected = (q.passwordValue || "").trim();
        if (expected && entered !== expected) {
          if (perrEl) perrEl.style.display = "";
          if (pwInp) pwInp.style.borderColor = "var(--red)";
          valid = false;
        } else {
          if (perrEl) perrEl.style.display = "none";
          if (pwInp) pwInp.style.borderColor = "";
        }
        return;
      }

      const ans = answers[q.id];
      const isEmpty = !ans || (typeof ans === 'string' && ans.trim() === '');
      if (q.required && isEmpty) {
        if (errEl) errEl.style.display = "";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "var(--red)";
        }
        valid = false;
      } else {
        if (errEl) errEl.style.display = "none";
        if (q.type === "file_upload") {
          const area = block?.querySelector(`#fua-${q.id}`);
          if (area) area.style.borderColor = "";
        }
      }
    });
    return valid;
  }

  // ── Submit ──────────────────────────────────────────────────
  let submitting = false;
  async function doSubmit(targetOverride) {
    if (submitting) return;
    if (!validateForm()) return;
    submitting = true;
    const btns = [
      document.getElementById("submit-btn-wa"),
      document.getElementById("submit-btn-tg"),
      document.getElementById("submit-btn"),
    ].filter(Boolean);
    btns.forEach(b => b.disabled = true);

    try {
      // Record the response (who answered what, and when) before sending off.
      await sb.from("responses").insert({
        form_id: form.id,
        answers: answers,
        sent_to: targetOverride || target,
      });
    } catch (err) {
      console.error("Failed to save response:", err);
      // Non-blocking: still let the person send their answers even if the save failed.
    }

    window.open(buildLink(settings, questions, answers, targetOverride), "_blank");
    showSuccess(settings, targetOverride);
    btns.forEach(b => b.disabled = false);
    submitting = false;
  }

  if (target === "both") {
    document.getElementById("submit-btn-wa")?.addEventListener("click", () => doSubmit("wa"));
    document.getElementById("submit-btn-tg")?.addEventListener("click", () => doSubmit("tg"));
  } else {
    document.getElementById("submit-btn")?.addEventListener("click", () => doSubmit());
  }

  // Enter key on single-line inputs triggers submit (not textarea)
  root.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const tag = e.target?.tagName?.toLowerCase();
      if (tag === "textarea") return; // allow newline in textarea
      if (tag === "input" || tag === "select") {
        e.preventDefault();
        if (target === "both") {
          document.getElementById("submit-btn-wa")?.click();
        } else {
          document.getElementById("submit-btn")?.click();
        }
      }
    }
  });
}

// ── Main: fetch form ──────────────────────────────────────────
(async function() {
  let form = null;

  if (customSlug) {
    // ── Custom single-segment URL: wateform.my.id/{slug} ──────
    const { data, error } = await sb
      .from("forms")
      .select("*")
      .eq("slug", customSlug)
      .maybeSingle();

    if (error || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else if (wsShort && formShort) {
    // ── Auto-generated two-segment URL: /ws_short/form_short ──
    const { data: wsData, error: wsErr } = await sb
      .from("workspaces")
      .select("id")
      .eq("short_id", wsShort)
      .single();

    if (wsErr || !wsData) {
      showError("This form link is invalid or has been deleted.");
      return;
    }

    const { data, error: formErr } = await sb
      .from("forms")
      .select("*")
      .eq("short_id", formShort)
      .eq("workspace_id", wsData.id)
      .single();

    if (formErr || !data) {
      showError("This form link is invalid or has been deleted.");
      return;
    }
    form = data;

  } else {
    showError("No form ID found in the URL.");
    return;
  }

  if (!form.is_published) {
    showError("This form is not published yet.");
    return;
  }

  const s   = form.settings || {};
  const now = new Date();

  // Check Active toggle first — an inactive form always shows the inactive page
  if (s.isActive === false) {
    showInactive();
    return;
  }

  // Check open schedule
  if (s.openAt) {
    const openTime = new Date(s.openAt);
    if (now < openTime) {
      showScheduled("not-open", openTime, s.closeAt ? new Date(s.closeAt) : null, null);
      return;
    }
  }

  
  // Check close schedule
  if (s.closeAt) {
    const closeTime = new Date(s.closeAt);
    if (now >= closeTime) {
      showScheduled("closed", null, closeTime, s.closedMessage || null);
      return;
    }
  }

  renderForm(form);
})();
</script>
